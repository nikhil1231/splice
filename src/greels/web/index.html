/* Like the pane below, one element for the life of the page: adding to the
   shortlist repaints this and nothing else, so it does not disturb the
   editor -- or the search results -- to add a row to a strip above them. */
const shortlistBar = el('div', { class: 'shortlist' });

const shortlisted = id => state.shortlist.some(s => s.id === id);

const writeShortlist = () => {
  try { localStorage.setItem(SHORTLIST_KEY, JSON.stringify(state.shortlist)); }
  catch { toast('could not remember the shortlist in this browser'); }
  paintShortlist();
  refreshShortlistButtons();
};

function addToShortlist(entry) {
  if (shortlisted(entry.id)) return;
  state.shortlist = [...state.shortlist, entry];
  writeShortlist();
}

function dropFromShortlist(id) {
  state.shortlist = state.shortlist.filter(s => s.id !== id);
  writeShortlist();
}

/* Renamed after it was shortlisted, which happens constantly -- fixing the
   title is half of what the pane is for. */
function renameInShortlist(id, title) {
  const entry = state.shortlist.find(s => s.id === id);
  if (!entry || entry.title === title) return;
  entry.title = title;
  writeShortlist();
}

/* Nothing at all when it is empty. A strip explaining that it has no items is
   a row of the page spent on a feature you are not using. */
function paintShortlist() {
  if (!state.shortlist.length) return shortlistBar.replaceChildren();
  shortlistBar.replaceChildren(
    el('span', { class: 'label', style: 'margin:0' },
      `Shortlist ${state.shortlist.length}`),
    el('div', { class: 'shortlist-strip' },
      ...state.shortlist.map(s => momentChip(s, {
        remove: () => toggleShortlist(s),
        title: 'Take it off the shortlist' }))));
}

/* The chip the shortlist is made of, and the only thing a plan's moments are
   drawn with -- a plan is a shortlist with a name, and two ways of drawing the
   same thing drift apart by the second edit. `drag` and `plan` are the plan's:
   its chips wear the moment's state and the tick that says it was chosen, and
   open in the side panel. The strip on Segments has no running order to
   disturb and is already beside the pane its chips open in. */
function momentChip(entry, { remove, title = 'Take it out', drag = null, plan = null }) {
  const open = plan && state.panel?.id === entry.id && state.panel?.planId === plan.id;
  const chip = el('div', {
    class: 'shortlist-item' + (open ? ' on' : ''),
    ...(plan ? { 'data-state-seg': entry.id, 'data-state': standing(entry.id).state,
                 'data-chip': `${plan.id}|${entry.id}` } : {}),
    ...(drag ? {
      draggable: 'true',
      ondragstart: e => {
        e.dataTransfer.setData('text/plain', String(drag.at));
        chip.classList.add('dragging');
      },
      ondragend: () => chip.classList.remove('dragging'),
      ondragover: e => e.preventDefault(),
      ondrop: e => {
        e.preventDefault();
        const from = Number(e.dataTransfer.getData('text/plain'));
        if (Number.isInteger(from)) drag.move(from, drag.at);
      },
    } : {}),
  },
    thumb(entry.id, 'shortlist-thumb', entry.title || ''),
    plan ? segBadge(entry.id) : null,
    el('span', { class: 't', title: entry.title || '',
      onclick: () => plan ? openPanel(entry.id, plan.id) : showMoment(entry.id) },
      entry.title || '(untitled)'),
    plan ? el('button', { class: 'iconbtn tick', 'aria-pressed': String(Boolean(entry.in_edit)),
      title: entry.in_edit ? 'Chosen for this edit — click to un-choose'
        : 'One of the takes — click to choose it for the edit',
      onclick: () => toggleInEdit(plan.id, entry.id) }, '✓') : null,
    el('button', { class: 'iconbtn', title, onclick: remove }, '×'));
  return chip;
}

/* --- plan storage ---------------------------------------------------------- */

const sendJSON = (method, body) => ({ method,
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

const findPlan = id => state.plans.find(p => p.id === id);
const plansUsing = id => state.plans.filter(plan => plan.moments.some(m => m.id === id));
const planCount = id => plansUsing(id).length;

async function loadStates() {
  try { state.segStates = await api('/api/states'); }
  catch (e) { console.warn('Could not load segment states:', e); }
  refreshPlanUsage();
}

/* The outline in `plans/schedule.json`, for its title and cadence -- and, in
   an archive that has never had plans, as the plans to start from. */
async function loadSeed() {
  try {
    const seed = await api('/api/plans/seed');
    if (!seed?.plans?.length) return null;
    const live = new Set((await api('/api/segments?')).map(r => r.id));
    // A different media root must not inherit this family's release schedule.
    return seed.plans.some(p => p.moments.some(m => live.has(m.id))) ? seed : null;
  } catch (e) {
    console.warn('Could not load the saved plan schedule:', e);
    return null;
  }
}

/* Out of this browser and into the archive, once per archive. What this
   browser had wins over the outline, since it is the outline plus an evening
   of edits; the outline is only the start for a browser that never loaded it.
   One that loaded it and then deleted every plan made a decision, and the
   outline does not come back over it.

   The server refuses a second import, so a second tab still holding the old
   copy cannot bring back what the first deleted since. */
async function movePlansIntoArchive() {
  let found = readLegacyPlans();
  if (!found.length && state.planSeed) {
    let applied = [];
    try { applied = JSON.parse(localStorage.getItem(PLAN_SEEDS_KEY) || '[]'); } catch {}
    if (!applied.includes(state.planSeed.id)) found = state.planSeed.plans;
  }
  if (!found.length) return false;
  try { await api('/api/plans/import', sendJSON('POST', { plans: found })); }
  catch (e) { if (e.status !== 409) throw e; }   // 409: another tab got there first
  try { localStorage.setItem(PLANS_MOVED_KEY, new Date().toISOString()); } catch {}
  return true;
}

async function loadPlans() {
  await flushPlans();
  state.planSeed = await loadSeed();
  try {
    let got = await api('/api/plans');
    if (!got.exists && await movePlansIntoArchive()) got = await api('/api/plans');
    state.plans = got.plans;
    state.plansReady = true;
  } catch (e) {
    /* Not an empty list. "Nothing planned yet" invites a New plan, and the
       first new plan makes the directory that says the move is done. */
    state.plansReady = false;
    state.plansError = e.message;
  }
  await loadStates();
}

/* Typing saves 700 ms after the last key; a stage, a tick or a moved moment is
   sent at once. What is queued is which *fields* changed, not their values, so
   a save sends whatever the plan holds when it goes. Saves of one plan go one
   after another, each with the revision the last got back -- two in flight
   with the same one, and the server would rightly refuse the second. */
const PLAN_TYPING_MS = 700;
const planSaves = new Map();

const planFields = (plan, keys) => Object.fromEntries(keys.map(k =>
  [k, k === 'moments' ? plan.moments.map(({ reattached, ...m }) => m) : plan[k]]));

function savePlan(plan, keys, { typing = false } = {}) {
  const pending = planSaves.get(plan.id)
    || { keys: new Set(), timer: null, chain: Promise.resolve() };
  planSaves.set(plan.id, pending);
  keys.forEach(k => pending.keys.add(k));
  clearTimeout(pending.timer);
  if (typing) {
    pending.timer = setTimeout(() => flushPlan(plan.id), PLAN_TYPING_MS);
    return pending.chain;
  }
  return flushPlan(plan.id);
}

function flushPlan(id) {
  const pending = planSaves.get(id);
  if (!pending) return Promise.resolve();
  clearTimeout(pending.timer);
  const keys = [...pending.keys];
  pending.keys.clear();
  if (!keys.length) return pending.chain;
  pending.chain = pending.chain.then(async () => {
    const plan = findPlan(id);
    if (!plan) return;
    try {
      const saved = await api('/api/plan/' + encodeURIComponent(id),
        sendJSON('PATCH', { revision: plan.revision, ...planFields(plan, keys) }));
      /* Onto whatever holds this plan now: a reload in between replaces the
         objects, and a revision written to the old one is the next 409. */
      const now = findPlan(id) || plan;
      Object.assign(now, { revision: saved.revision, stage_at: saved.stage_at,
                           updated_at: saved.updated_at });
      applyPlanOrders(saved.orders);
      for (const m of saved.moments) {
        const mine = now.moments.find(x => x.id === m.id);
        if (mine) Object.assign(mine, { stem: m.stem, start: m.start, end: m.end });
      }
      if (keys.includes('moments') || keys.includes('stage')) await loadStates();
    } catch (e) {
      /* The server's sentence says to reload; this does it, so the toast
         says what is left to do instead. */
      if (e.status === 409 || e.status === 404) {
        toast(`“${plan.title || 'That plan'}” was changed elsewhere — reloaded; make that change again`);
        await reloadPlans();
      }
      else toast('could not save the plan: ' + e.message);
    }
  });
  return pending.chain;
}

const flushPlans = () => Promise.all([...planSaves.keys()].map(flushPlan));

async function reloadPlans() {
  try { state.plans = (await api('/api/plans')).plans; } catch {}
  forgetUndo('Plans', 'Schedule');
  await loadStates();
  if (state.tab === 'Plans') renderView();
}

/* A tab closed within 700 ms of the last key would lose the word. */
window.addEventListener('pagehide', () => {
  for (const [id, pending] of planSaves) {
    const plan = findPlan(id);
    if (!plan || !pending.keys.size) continue;
    fetch('/api/plan/' + encodeURIComponent(id), { keepalive: true,
      ...sendJSON('PATCH', { revision: plan.revision, ...planFields(plan, [...pending.keys]) }) });
  }
});

async function newPlan({ title = '', moments = [], ...fields } = {}) {
  await flushPlans();
  try {
    const { orders, ...plan } = await api('/api/plans', sendJSON('POST', { ...fields, title, moments }));
    state.plans.push(plan);
    applyPlanOrders(orders);   // last among the ideas, which is not last
    await loadStates();
    return plan;
  } catch (e) { toast('could not start a plan: ' + e.message); return null; }
}

/* What a duplicate starts from: the words and the pool, not the decisions.
   It is an idea, because it has not been gathered for yet. None of its takes
   are ticked, because a take ticked in two plans is flagged as a
   contradiction, and every ticked moment would come out of the copy wearing
   the red ring. It is not finished or posted and has no week or slot, because it did not
   go out and the outline never placed it. */
function copyOfPlan(plan) {
  return {
    title: `${plan.title || 'Untitled plan'} (copy)`,
    desc: plan.desc || '', strand: plan.strand || '', target: plan.target || '',
    moments: plan.moments.map(({ reattached, ...m }) => ({ ...m, in_edit: false })),
  };
}

async function duplicatePlan(id) {
  await flushPlan(id);   // the copy is of what is on screen, not of the last save
  const plan = findPlan(id);
  if (!plan) return;
  const copy = await newPlan(copyOfPlan(plan));
  if (!copy) return;
  rememberMade(copy, `duplicated ${planTitle(plan)}`);
  focusPlan = copy.id;
  if (state.planStage && state.planStage !== copy.stage) setPlanStageFilter('');
  renderView();
  toast(`Duplicated — the copy is last among the ideas`);
}

/* Every change to a plan's moments: saved, and the one card redrawn in place
   -- a whole-page render drops the scroll back to the top of forty-two plans. */
function movedMoments(plan) {
  savePlan(plan, ['moments']);
  refreshPlanUsage();
  repaintPlan(plan.id);
}

function addToPlan(planId, entry) {
  const plan = findPlan(planId);
  if (!plan || plan.moments.some(m => m.id === entry.id)) return;
  const before = planSnapshot(plan, ['moments']);
  plan.moments.push({ in_edit: false, ...entry });
  movedMoments(plan);
  rememberPlan(plan, before, `added “${entry.title || 'a moment'}” to ${planTitle(plan)}`);
}

function dropFromPlan(planId, id) {
  const plan = findPlan(planId);
  if (!plan) return;
  const before = planSnapshot(plan, ['moments']);
  const gone = plan.moments.find(m => m.id === id);
  plan.moments = plan.moments.filter(m => m.id !== id);
  movedMoments(plan);
  rememberPlan(plan, before, `took “${gone?.title || 'a moment'}” out of ${planTitle(plan)}`);
}

function movePlanMoment(planId, from, to) {
  const plan = findPlan(planId);
  if (!plan || from === to) return;
  if (to < 0 || to >= plan.moments.length || from < 0 || from >= plan.moments.length) return;
  const before = planSnapshot(plan, ['moments']);
  plan.moments.splice(to, 0, plan.moments.splice(from, 1)[0]);
  movedMoments(plan);
  rememberPlan(plan, before, `moved a moment in ${planTitle(plan)}`);
}

function toggleInEdit(planId, id) {
  const plan = findPlan(planId);
  const m = plan?.moments.find(x => x.id === id);
  if (!m) return;
  const before = planSnapshot(plan, ['moments']);
  m.in_edit = !m.in_edit;
  movedMoments(plan);
  rememberPlan(plan, before, `${m.in_edit ? 'chose' : 'un-chose'} “${m.title || 'a moment'}” in ${planTitle(plan)}`);
  if (state.panel?.id === id && state.panel?.planId === planId) paintPanelPlan();
}

function setStage(planId, stage) {
  const plan = findPlan(planId);
  if (!plan || plan.stage === stage) return;
  /* Leaving Ready takes a reel off the schedule, and coming back would put
     it last; its old place goes with the entry. */
  const before = planSnapshot(plan, ['stage']);
  const order = scheduleView.reels.map(r => r.id);
  remember(`set ${planTitle(plan)} to ${stageInfo(stage)[1]}`,
    async () => { await putPlanBack(planId, before); await restoreSlot(planId, before.stage, order); },
    () => putPlanBack(planId, { stage }));
  plan.stage = stage;
  restackPlans(state.plans, plan);
  // The schedule link on the card waits for the save: its number is the server's.
  savePlan(plan, ['stage']).then(loadSchedule).then(() => {
    // Its number on the Schedule has arrived, which can place it.
    state.plans.sort(planPlace);
    placePlanCards();
    repaintPlan(plan.id);
  });
  refreshPlanUsage();
  repaintPlan(plan.id);
  paintStageFilter();
  if (placePlanCards())
    toast(`“${plan.title || 'Untitled plan'}” moved to the end of the ${stageInfo(stage)[1].toLowerCase()} plans`);
}

/* The cards into the order of `state.plans`, moving only the ones out of
   place. A whole-page render would put the scroll back at the top of
   forty-two plans, and moving every card would take the focus out of one
   being typed into. Returns whether anything moved. */
function placePlanCards() {
  const list = $('.plan-list');
  if (!list) return false;
  let at = list.firstElementChild, moved = false;
  for (const plan of state.plans) {
    const card = document.getElementById('plan-' + plan.id);
    if (!card) continue;
    if (card === at) { at = at.nextElementSibling; continue; }
    list.insertBefore(card, at);
    moved = true;
  }
  return moved;
}

async function deletePlan(id) {
  await flushPlan(id);
  const plan = findPlan(id);
  if (!plan) return false;
  const kept = keptPlan(id);
  try {
    await api('/api/plan/' + encodeURIComponent(id), sendJSON('DELETE', { revision: plan.revision }));
    state.plans = state.plans.filter(p => p.id !== id);
    if (state.panel?.planId === id) closePanel();
    rememberDeleted(kept);
    await loadStates();
    return true;
  } catch (e) {
    toast('could not delete: ' + e.message);
    if (e.status === 409) await reloadPlans();
    return false;
  }
}

/* The two things that happen to a moment under a plan that is not looking:
   renamed in the pane, or deleted out of the sidecar. Both are hooked in the
   segment editor, the way the shortlist's already were. */
function renameInPlans(id, title) {
  for (const plan of state.plans) {
    const mine = plan.moments.filter(m => m.id === id && m.title !== title);
    if (!mine.length) continue;
    mine.forEach(m => { m.title = title; });
    savePlan(plan, ['moments']);
  }
  document.querySelectorAll(`[data-chip$="|${CSS.escape(id)}"] .t`).forEach(n => {
    n.textContent = title; n.title = title;
  });
}

function dropFromPlans(id) {
  for (const plan of state.plans) {
    if (!plan.moments.some(m => m.id === id)) continue;
    plan.moments = plan.moments.filter(m => m.id !== id);
    savePlan(plan, ['moments']);
  }
  refreshPlanUsage();
}

async function showPlan(id) {
  const plan = findPlan(id);
  // A plan hidden by the stage filter is not a place anything can scroll to.
  if (plan && state.planStage && plan.stage !== state.planStage) setPlanStageFilter('');
  if (state.tab !== 'Plans') { state.tab = 'Plans'; await render(); }
  else if (!document.getElementById('plan-' + id)) await renderView();
  const card = document.getElementById('plan-' + id);
  // The navigation wraps to two rows in the app's narrower browser panel.
  if (card) card.style.scrollMarginTop = `${$('header').getBoundingClientRect().height + 16}px`;
  card?.scrollIntoView({ block: 'start' });
  card?.querySelector('input')?.focus({ preventScroll: true });
}

/* Named by title. Plans have no numbers: a number said "the order these go
   out in", and that is the Schedule's to say. */
function planLinkBody(plan, id = null) {
  const m = id ? plan.moments.find(x => x.id === id) : null;
  return [stageBadge(plan.stage, { word: false }), plan.title || 'Untitled plan', m?.in_edit ? ' ✓' : ''];
}

/* A plan a moment is in, as a link to it -- and, where the moment is open
   in front of you, a × on hover to take it out. Taking a moment out of a plan
   used to mean going to the plan and finding its chip among thirteen; the
   question comes up while looking at the moment, so the answer is here.
   Hover-only, because the rows in a list carry these too and a cross on every
   one of them would be a column of targets for a stray click. */
function planChip(plan, id, { remove = null } = {}) {
  const link = el('button', { class: 'plan-link' + (plan.stage === 'shelved' ? ' shelved' : ''),
    title: `Open this plan — ${stageInfo(plan.stage)[1]}`
      + (plan.moments.find(m => m.id === id)?.in_edit ? ', and chosen for its edit' : ''),
    onclick: e => { e.stopPropagation(); showPlan(plan.id); } },
    ...planLinkBody(plan, id));
  if (!remove) return link;
  return el('span', { class: 'plan-chip' }, link,
    el('button', { class: 'plan-chip-x', 'aria-label': `Take it out of “${plan.title || 'Untitled plan'}”`,
      title: `Take it out of “${plan.title || 'Untitled plan'}”`,
      onclick: e => {
        e.stopPropagation();
        remove();
        toast(`taken out of “${plan.title || 'Untitled plan'}”`);
      } }, '×'));
}

function paintPlanUsage(node) {
  const id = node.dataset.planSeg;
  const matches = plansUsing(id);
  node.replaceChildren(...(matches.length ? matches.map(plan => planChip(plan, id, {
    remove: node.dataset.removable ? () => dropFromPlan(plan.id, id) : null,
  })) : [el('span', { class: 'pill' }, 'Not in a plan')]));
}

function planUsage(id, { removable = false } = {}) {
  const node = el('div', { class: 'plan-usage', 'data-plan-seg': id,
    'data-removable': removable ? '1' : null, 'aria-label': 'Used in plans' });
  paintPlanUsage(node);
  return node;
}

/* Every plan, ticked where it holds the moment: choosing one puts the moment
   in or takes it out. The Segments editor and the side panel on Plans share
   it, so the two menus cannot drift into saying different things. */
function planMenu(anchor, id, entry, after = () => {}) {
  popMenu(anchor, 'planmenu', close => [
    ...state.plans.map(plan => {
      const holds = plan.moments.some(m => m.id === id);
      return el('button', { role: 'menuitem', onclick: () => {
        close();
        holds ? dropFromPlan(plan.id, id) : addToPlan(plan.id, entry());
        after();
      } },
        el('div', { class: 'menu-row' }, stageBadge(plan.stage, { word: false }),
          el('div', {},
            el('strong', {}, `${holds ? '✓ ' : ''}${plan.title || 'Untitled plan'}`),
            el('span', {}, holds ? 'take it out'
              : `${stageInfo(plan.stage)[1]} · ${plan.moments.length} moment(s)`))));
    }),
    el('button', { role: 'menuitem', onclick: async () => {
      close();
      const plan = await newPlan({ moments: [entry()] });
      if (plan) rememberMade(plan, 'started a plan with this moment');
      if (plan) after(plan);
    } }, el('strong', {}, 'New plan with this moment'),
      el('span', {}, state.tab === 'Plans' ? 'name it in the list' : 'name it on the Plans page')),
  ]);
}

/* What the editor's plan button says. Here rather than in the editor so a
   moment taken out of a plan by its chip's × updates the count beside it. */
function paintPlanCount(node) {
  const n = planCount(node.dataset.planCount);
  node.textContent = n ? `✓ In ${n} plan${n > 1 ? 's' : ''} ▾` : '+ Add to plan ▾';
  node.setAttribute('aria-pressed', String(Boolean(n)));
}

/* Everything on the page that depends on the plans or the states, repainted
   where it stands: the Segments editor's video keeps playing, and a search
   box keeps its caret. */
function refreshPlanUsage() {
  document.querySelectorAll('[data-plan-seg]').forEach(paintPlanUsage);
  document.querySelectorAll('[data-plan-count]').forEach(paintPlanCount);
  if (state.panel) { paintPanelPlan(); paintPanelAlso(); }
  document.querySelectorAll('[data-plan-title]').forEach(node => {
    const plan = findPlan(node.dataset.planTitle);
    if (plan) node.replaceChildren(...planLinkBody(plan));
  });
  document.querySelectorAll('[data-badge-seg]').forEach(node => node.replaceWith(
    segBadge(node.dataset.badgeSeg, { word: Boolean(node.dataset.badgeWord) })));
  document.querySelectorAll('[data-state-seg]').forEach(node => {
    node.dataset.state = standing(node.dataset.stateSeg).state;
  });
  document.querySelectorAll('[data-state-count]').forEach(node => {
    node.textContent = String(state.segStates?.counts?.[node.dataset.stateCount] ?? '·');
  });
}

/* The right-hand half of Segments, and one element for the life of the page.
   `renderView` throws its tree away on every search keystroke, so an editor
   rebuilt with the list would take a half-retyped caption with it; moving
   this node into each new tree keeps the live inputs and what is in them. */
const detail = el('div', { class: 'detail' });

/* Nothing may replace what is in the pane behind your back. */
function detailGuard() {
  return !detail._dirty || !detail._dirty()
    || confirm('Throw away what you have typed here?');
}

let detailToken = 0;

async function paintDetail() {
  const mine = ++detailToken;
  detail._dirty = null;
  if (!state.openSeg) {
    detail.replaceChildren(el('div', { class: 'empty' },
      'Pick a moment on the left to watch it and fix what it says.'));
    return;
  }
  detail.replaceChildren(el('div', { class: 'empty' }, 'loading…'));
  try {
    const node = await segmentEditor(state.openSeg, state.openSegAt, {
      close: () => selectSegment(null),
      open: id => selectSegment(id),
      saved: async () => { await boot(); paintDetail(); },
      gone: async () => { state.openSeg = null; await boot(); },
    });
    if (mine !== detailToken) return;
    detail.replaceChildren(node);
    detail._dirty = node.dirty;
  } catch (e) {
    if (mine === detailToken) detail.replaceChildren(el('div', { class: 'empty' }, e.message));
  }
}

/* A chip on the Plans page is a moment that lives on Segments; clicking one
   goes to where it can be watched and its transcript fixed. Painting the pane
   before the tab renders, so `split` finds it already filled and viewSegments
   marks the row on its own from `state.openSeg`. */
function showMoment(id) {
  if (state.tab === 'Segments') return selectSegment(id);
  if (!detailGuard()) return;
  state.openSeg = id;
  state.openSegAt = null;
  state.tab = 'Segments';
  paintDetail();
  render();
}

function selectSegment(id, at = null) {
  if (!detailGuard()) return;
  const was = state.openSeg;
  state.openSeg = id;
  state.openSegAt = at;
  syncUrl();
  for (const row of document.querySelectorAll('.results .row'))
    row.classList.toggle('on', row.getAttribute('data-seg') === id);
  /* Below the list rather than beside it on a narrow window, so opening a
     moment would otherwise look like it did nothing and closing one would
     leave you at the bottom of a list you had scrolled halfway down. After
     the pane has been filled, not before: an empty one is `display: none`
     there, and scrolling to something with no box is scrolling to nothing. */
  paintDetail().then(() => {
    if (window.innerWidth > 1000) return;
    const to = document.querySelector(
      id ? '.detail' : `.results .row[data-seg="${CSS.escape(was || '')}"]`);
    if (to) to.scrollIntoView({ block: 'nearest' });
  });
}

/* List on the left, the moment itself on the right. The pane used to be a
   modal, which meant the page under it was a list and nothing else, and
   every correction cost an open and a close. */
function split(...list) {
  if (!detail.firstChild) paintDetail();
  return el('div', { class: 'split' },
    el('div', { class: 'results' }, ...list),
    detail);
}

/* The first thing under the header rather than a band floating in the middle
   of the results. */
function segmentsPage(...rest) {
  paintShortlist();
  return el('div', {}, shortlistBar, ...rest);
}

/* --- Plans ---------------------------------------------------------------

   The page the browser opens on, and the only one here that is not about the
   footage. Everything else describes what was shot; this describes the reels it
   might become -- a title, a sentence about why, a stage, and the moments that
   might go in it.

   It is the middle that was missing. The shortlist answers "those four might go
   together" once and has nowhere to say why; a cut costs a file, a trash copy
   and a revision token because a cut is a decision. A plan is neither: it is
   the idea, kept. `reel new` is still what turns one into a cut. */

/* Which plan's title box to put the caret in after the page redraws. A plan
   made by a button is untitled, and naming it is the next thing you do. */
let focusPlan = null;
const sizesItself = CSS.supports('field-sizing', 'content');

/* What the plans page last fetched from the index, kept so one card can be
   redrawn without asking for all 477 moments again. */
const plansView = { live: new Map(), indexed: true, refound: new Set(), slots: new Map() };

function setPlanStageFilter(stage) {
  state.planStage = stage;
  try { localStorage.setItem('planStage', stage); } catch {}
}

/* One element for the life of the page, so a stage change repaints the counts
   without rebuilding the plans under them. */
const stageFilter = el('div', { class: 'subnav', role: 'tablist', 'aria-label': 'Stage' });

function paintStageFilter() {
  const count = key => state.plans.filter(p => p.stage === key).length;
  stageFilter.replaceChildren(
    el('button', { role: 'tab', 'aria-selected': String(!state.planStage),
      onclick: () => { setPlanStageFilter(''); renderView(); } }, `All ${state.plans.length}`),
    ...STAGES.filter(([key]) => count(key) || state.planStage === key).map(([key, name]) =>
      el('button', { role: 'tab', 'aria-selected': String(state.planStage === key),
        title: stageInfo(key)[3],
        onclick: () => { setPlanStageFilter(state.planStage === key ? '' : key); renderView(); } },
        stageBadge(key, { word: false }), ` ${name} ${count(key)}`)));
}

/* How the archive divides between the states, as a bar and as the legend for
   every badge on the page. Each name opens Segments filtered to it -- "what is
   seen and in no plan" is where the next idea comes from. */
function stateSummary() {
  const counts = state.segStates?.counts;
  if (!counts) return null;
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  return el('div', { id: 'state-summary' },
    el('div', { class: 'ruler states', role: 'img',
      'aria-label': STATES.map(([k, n]) => `${counts[k]} ${n.toLowerCase()}`).join(', ') },
      ...STATES.filter(([k]) => counts[k]).map(([k, name]) => el('span', {
        title: `${counts[k]} ${name.toLowerCase()}`,
        style: `width:${100 * counts[k] / total}%;background:var(--st-${k})` }))),
    el('div', { class: 'legend' }, ...STATES.map(([k, name, why]) => el('button', {
      title: `${why} — show them on Segments`,
      onclick: () => { state.segState = k; state.tab = 'Segments'; render(); } },
      stateBadge(k, { title: why }), ` ${name}`, el('span', { class: 'n' }, String(counts[k]))))));
}

function plansOverview() {
  const { live, indexed } = plansView;
  const assigned = new Set(state.plans.filter(p => p.stage !== 'shelved')
    .flatMap(p => p.moments.map(m => m.id)));
  const covered = [...live.values()].filter(r => assigned.has(r.id));
  const seed = state.planSeed;
  return el('div', { class: 'reel', id: 'plan-overview' },
    el('h4', {}, seed?.title || 'Plan overview'),
    el('p', { class: 'stats' }, indexed
      ? `${covered.length} of ${live.size} segments in plans · ${live.size - covered.length} not yet assigned · `
        + `${hms(covered.reduce((n, r) => n + r.end - r.start, 0))} of source material`
      : 'The index is unavailable; source coverage cannot be checked.'),
    stateSummary(),
    seed ? el('p', { class: 'stats' }, seed.note) : null,
    indexed && live.size > covered.length ? el('details', {},
      el('summary', {}, 'Segments not yet assigned'),
      el('ul', {}, ...[...live.values()].filter(r => !assigned.has(r.id)).map(r =>
        el('li', {}, segBadge(r.id), ' ', r.title || r.id,
          el('span', { class: 'stats' }, ' — ' + (seed?.unassigned?.find(m => m.id === r.id)?.reason || 'Available for another idea.')))))) : null);
}

/* "4 of 13 chosen · 0:52 chosen / 5:12 in the pool". The pool is alternate
   takes and is always longer than the reel; what is chosen is the number to
   hold against the target. */
function planFoot(plan) {
  const { live, indexed } = plansView;
  const known = plan.moments.map(m => live.get(m.id)).filter(Boolean);
  const lost = plan.moments.length - known.length;
  const length = rows => rows.reduce((n, r) => n + (r.end - r.start), 0);
  const chosen = plan.moments.filter(m => m.in_edit);
  const chosenRows = chosen.map(m => live.get(m.id)).filter(Boolean);
  const twice = chosen.filter(m => standing(m.id).warn.includes('in the edit for'));
  const reattached = plan.moments.filter(m => plansView.refound.has(`${plan.id}|${m.id}`)).length;
  return el('div', { class: 'plan-foot' },
    el('span', {},
      `${plan.moments.length} moment(s)`
      + (chosen.length ? ` · ${chosen.length} chosen` : '')
      + (indexed ? ` · ${chosen.length ? `${hms(length(chosenRows))} chosen / ` : ''}${hms(length(known))} in the pool` : '')),
    /* The one way from a plan to where it sits in the running order. */
    plan.stage === 'ready' && plansView.slots.has(plan.id) ? el('button', { class: 'plan-link',
      title: plan.posted ? 'Posted — see it on the Schedule' : 'Where it sits in the running order',
      onclick: () => showOnSchedule(plan.id) },
      `#${plansView.slots.get(plan.id)} on the schedule${scheduleMark(plan)} →`) : null,
    lost && indexed ? el('span', { class: 'pill rej' }, `${lost} no longer in the index`) : null,
    reattached ? el('span', { class: 'pill', title: 'Re-analysis renumbered these; they were found '
      + 'again by where they are in the clip' }, `${reattached} found again after re-analysis`) : null,
    twice.length ? el('span', { class: 'pill rej', title: twice.map(m => standing(m.id).warn).join('\n') },
      `${twice.length} also chosen for another plan`) : null,
    el('button', { class: 'btn spacer', title: 'A new idea with the same words and moments, none of them ticked',
      onclick: () => duplicatePlan(plan.id) }, 'Duplicate'),
    el('button', { class: 'btn danger', onclick: () => {
      if (confirm(`Delete “${plan.title || 'Untitled plan'}”? A copy goes to index/.trash — `
        + '`greels trash list` gets it back.')) deletePlan(plan.id).then(() => renderView());
    } }, 'Delete plan'));
}

/* Where it has got to on the Schedule, after its stage: nothing while it is
   only ready. */
const scheduleMark = plan => plan.stage !== 'ready' ? ''
  : plan.posted ? ' · posted' : plan.finished ? ' · finished' : '';

/* A finished or posted plan's other stages are offered and explained rather
   than left for the server to refuse: it was cut, or it went out, and taking
   that back is a step on the Schedule, not a stage. */
function stagePill(plan) {
  return el('button', { class: 'stage-pill', 'aria-haspopup': 'menu',
    title: `${stageInfo(plan.stage)[3]} — change the stage`,
    onclick: e => popMenu(e.currentTarget, 'stagemenu', close => STAGES.map(([key, name, , why]) => {
      const held = (plan.posted || plan.finished) && key !== 'ready';
      return el('button', { role: 'menuitem', disabled: held ? '' : null,
        onclick: () => { close(); setStage(plan.id, key); } },
        el('div', { class: 'menu-row' }, stageBadge(key, { word: false }),
          el('div', {}, el('strong', {}, (plan.stage === key ? '✓ ' : '') + name),
            el('span', {}, held ? `It is ${plan.posted ? 'posted' : 'finished'} — set it back to Ready on Schedule first` : why))));
    })) },
    stageBadge(plan.stage), scheduleMark(plan), ' ▾');
}

function planCard(plan) {
  /* The box's own undo goes a keystroke at a time; leaving it makes the
     whole retyping one step for the page's. */
  const typed = key => ({
    onfocus: e => { e.target._was = planSnapshot(plan, [key]); },
    onchange: e => {
      const live = findPlan(plan.id);
      if (live && e.target._was) rememberPlan(live, e.target._was,
        `${key === 'title' ? 'renamed' : 'rewrote the description of'} ${planTitle(live)}`);
      e.target._was = planSnapshot(plan, [key]);
    },
  });
  const title = el('input', { type: 'text', value: plan.title,
    placeholder: 'What is this one?', 'aria-label': 'Plan title', ...typed('title'),
    oninput: e => {
      plan.title = e.target.value;
      savePlan(plan, ['title'], { typing: true });
      refreshPlanUsage();
    } });
  /* `field-sizing: content` sizes the box to the text; where a browser
     does not know it yet, the height is set by hand once the card is on the
     page (a detached textarea has no scrollHeight) and again on every key. */
  const fit = () => {
    if (sizesItself) return;
    desc.style.height = 'auto';
    desc.style.height = desc.scrollHeight + 2 + 'px';
  };
  const desc = el('textarea', { placeholder: 'Why these, and what it is for…',
    rows: 1, 'aria-label': 'Plan description', ...typed('desc'),
    oninput: e => { plan.desc = e.target.value; savePlan(plan, ['desc'], { typing: true }); fit(); } });
  desc.value = plan.desc || '';
  setTimeout(fit, 0);
  if (focusPlan === plan.id) {
    focusPlan = null;
    setTimeout(() => title.focus(), 0);
  }

  return el('div', { class: 'reel plan', id: 'plan-' + plan.id },
    el('div', { class: 'plan-words' },
      el('div', { class: 'plan-head' },
        title, stagePill(plan)),
      plan.strand || plan.target ? el('div', { class: 'meta' },
        [plan.strand, plan.target && `target ${plan.target}`].filter(Boolean).join(' · ')) : null,
      desc),
    el('div', { class: 'plan-moments' },
      plan.moments.length
        ? el('div', { class: 'moment-grid' }, ...plan.moments.map((m, at) =>
            momentChip(m, {
              plan,
              remove: () => dropFromPlan(plan.id, m.id),
              title: 'Take it out of this plan',
              drag: { at, move: (from, to) => movePlanMoment(plan.id, from, to) },
            })))
        : el('p', { class: 'stats plan-empty' },
            'No moments yet — open one on Segments and use Add to plan.'),
      /* Delete sits on the count's line rather than a bar of its own: a
         row holding one button was 64 px of every card, forty-two times. */
      planFoot(plan)));
}

/* One card redrawn where it is. The title and description boxes are part of
   the card, so a card being typed into is left alone -- what changed under
   it is a badge, and the badges repaint themselves. */
function repaintPlan(id) {
  const card = document.getElementById('plan-' + id);
  const plan = findPlan(id);
  if (!card || !plan) return;
  if (card.contains(document.activeElement) && document.activeElement.matches('input, textarea')) {
    card.querySelector('.plan-foot')?.replaceWith(planFoot(plan));
    return;
  }
  card.replaceWith(planCard(plan));
  $('#plan-overview')?.replaceWith(plansOverview());
}

async function viewPlans() {
  /* One request for every moment in the archive rather than one per chip: a
     plan remembers an id and a title, and the running time, the count and
     whether the moment is still there have to come from the index. */
  plansView.live = new Map();
  plansView.indexed = true;
  try { plansView.live = new Map((await api('/api/segments?')).map(r => [r.id, r])); }
  catch { plansView.indexed = false; }
  await loadSchedule();

  if (!state.plansReady)
    return el('div', { class: 'empty' }, 'The plans could not be read: '
      + (state.plansError || 'the server did not answer') + '. Nothing has been changed.');

  /* A moment renamed since it was put in a plan, or re-attached after
     re-analysis. The editor's save fixes the plans that were open; this
     fixes the rest, once. */
  for (const plan of state.plans) {
    let corrected = false;
    for (const m of plan.moments) {
      /* Said once, on the card, and then saved under its new id -- left on
         the moment, the flag would have every visit here save it again. */
      if (m.reattached) {
        plansView.refound.add(`${plan.id}|${m.id}`);
        delete m.reattached;
        corrected = true;
      }
      const row = plansView.live.get(m.id);
      if (row && row.title && row.title !== m.title) { m.title = row.title; corrected = true; }
    }
    if (corrected) savePlan(plan, ['moments']);
  }

  const bar = el('div', { class: 'bar' },
    el('button', { class: 'btn primary', onclick: async () => {
      const plan = await newPlan();
      if (!plan) return;
      rememberMade(plan, 'started a plan');
      focusPlan = plan.id;
      if (state.planStage && state.planStage !== plan.stage) setPlanStageFilter('');
      renderView();
    } }, 'New plan'),
    /* It says move because it moves: the strip is a scratch pad and emptying
       it is what makes room for the next thought. */
    state.shortlist.length ? el('button', { class: 'btn',
      title: 'The strip on Segments becomes a plan, and the strip is emptied',
      onclick: async () => {
        const moved = [...state.shortlist];
        const plan = await newPlan({ moments: moved });
        if (!plan) return;
        state.shortlist = [];
        writeShortlist();
        const refill = list => { state.shortlist = [...list]; writeShortlist(); };
        rememberMade(plan, 'moved the shortlist into a plan',
          { undo: () => refill(moved), redo: () => refill([]) });
        focusPlan = plan.id;
        renderView();
      } }, `Move the shortlist (${state.shortlist.length}) into a new plan`) : null,
    el('span', { class: 'stats spacer' },
      state.plans.length ? `${state.plans.length} plan(s)` : ''));

  if (!state.plans.length)
    return el('div', {}, bar, el('div', { class: 'empty' },
      'Nothing planned yet. Shortlist a few moments on Segments and move them here, '
      + 'or start a plan and add to it from any moment you open.'));

  paintStageFilter();
  // Plans from before the files kept this order, until their first save.
  state.plans.sort(planPlace);
  const shown = state.plans.filter(plan => !state.planStage || plan.stage === state.planStage);
  return el('div', {}, bar, plansOverview(), stageFilter,
    el('div', { class: 'plan-list' }, ...shown.map(plan => planCard(plan)),
      shown.length ? null : el('div', { class: 'empty' },
        `No plan is at ${stageInfo(state.planStage)[1].toLowerCase()}.`)));
}

/* --- the side panel on Plans -----------------------------------------------

   Clicking a moment in a plan used to leave the plan for Segments, and
   comparing two takes meant going there and back twice. This is enough of
   the moment to decide about it -- watch it, read it, keep or reject it,
   choose it for the edit -- without leaving the plan. Fixing its captions is
   still Segments' job, one click away at the foot.

   One element for the life of the page, outside #view: `renderView` replaces
   everything in there, and would take the playing video with it. */
const panel = el('aside', { class: 'moment-panel', hidden: '', 'aria-label': 'Moment' });
let panelToken = 0;

function openPanel(id, planId = null) {
  state.panel = { id, planId };
  document.querySelectorAll('.plan .shortlist-item.on').forEach(n => n.classList.remove('on'));
  document.querySelector(`[data-chip="${CSS.escape(`${planId}|${id}`)}"]`)?.classList.add('on');
  if (!panel.isConnected) document.body.append(panel);
  panel.style.top = `${$('header').offsetHeight}px`;
  panel.hidden = false;
  document.body.classList.add('panel-open');
  syncUrl();
  paintPanel();
}

function closePanel() {
  if (!state.panel) return;
  panel.querySelector('video')?.pause();
  state.panel = null;
  panel.hidden = true;
  panel.replaceChildren();
  document.body.classList.remove('panel-open');
  document.querySelectorAll('.plan .shortlist-item.on').forEach(n => n.classList.remove('on'));
  syncUrl();
}

/* Step through the plan's moments in its order. */
function panelStep(by) {
  const plan = findPlan(state.panel?.planId);
  if (!plan?.moments.length) return;
  const at = plan.moments.findIndex(m => m.id === state.panel.id);
  const next = plan.moments[Math.max(0, Math.min(plan.moments.length - 1, at + by))];
  if (next && next.id !== state.panel.id) openPanel(next.id, plan.id);
}

/* The other plans and cuts holding the moment, repainted alone when the plan
   menu or a chip's × changes them. From `state.plans` rather than the states,
   which arrive a request later and would list the plan just left. */
const panelAlso = el('div', {});
function paintPanelAlso() {
  const { id, planId } = state.panel || {};
  if (!id) return panelAlso.replaceChildren();
  const others = state.plans.filter(p => p.id !== planId && p.moments.some(m => m.id === id));
  const cuts = standing(id).cuts || [];
  panelAlso.replaceChildren(...(others.length || cuts.length ? [el('h5', {}, 'Also in'),
    el('div', { class: 'plan-usage' },
      ...others.map(p => planChip(p, id, { remove: () => dropFromPlan(p.id, id) })),
      ...cuts.map(c => el('span', { class: 'pill fav', title: `a cut, ${c.status}` }, 'cut ' + c.slug)))] : []));
}

/* The part of the panel about the plan it was opened from, repainted alone
   when a tick changes -- the video above it keeps playing. */
const panelPlan = el('div', {});
function paintPanelPlan() {
  const { id, planId } = state.panel || {};
  const plan = findPlan(planId);
  if (!plan) return panelPlan.replaceChildren();
  const at = plan.moments.findIndex(m => m.id === id);

    el('h5', {}, `In “${plan.title || 'Untitled plan'}”`),

        title: 'Chosen for this plan’s edit, rather than one of the takes it was chosen from (t)',
        onclick: () => toggleInEdit(plan.id, id) }, m.in_edit ? '✓ Chosen for the edit' : 'Choose for the edit')
        : el('button', { class: 'btn', onclick: () => {
            addToPlan(plan.id, { id, title: panel.querySelector('.mp-title')?.value || '' });

        onclick: () => panelStep(-1) }, '←'),
      el('span', { class: 'stats' }, at >= 0 ? `${at + 1} of ${plan.moments.length}` : '—'),
      el('button', { class: 'iconbtn', title: 'Next moment in this plan (])',
        disabled: at < 0 || at >= plan.moments.length - 1 ? '' : null,

}

    title: 'Open in Segments — captions, tags and prose', 'aria-label': 'Open in Segments',

  const planBtn = el('button', { class: 'btn', 'aria-haspopup': 'menu', 'data-plan-count': id,

document.addEventListener('keydown', e => {
  if (!state.panel || state.tab !== 'Plans' || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('dialog[open]') || $('.menu')) return;   // those own Escape while they are up
  if (e.key === 'Escape') { closePanel(); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === '[') panelStep(-1);
  else if (e.key === ']') panelStep(1);
  else if (e.key === 't' && state.panel.planId) toggleInEdit(state.panel.planId, state.panel.id);
});
window.addEventListener('resize', () => {
  if (state.panel) panel.style.top = `${$('header').offsetHeight}px`;

/* --- Schedule --------------------------------------------------------------

   The order the ready plans go out in, and nothing else. It used to live on
   the plans themselves -- a week and a slot on each, from the generated
   outline, and a number -- which made a page of ideas into a timetable that
   could not be rearranged without rewriting the ideas. A plan set to Ready
   appears here; this page puts them in order and says which have gone out.

   The numbers are the page's, not the tiles': they stay where they are while
   a tile is dragged past them, because "third" is a place in the running
   order and not a property of whatever reel is in it this week. */

const scheduleView = { revision: null, reels: [], focus: null };

async function loadSchedule() {
  try {
    const got = await api('/api/schedule');
    scheduleView.revision = got.revision;
    scheduleView.reels = got.reels;
  } catch (e) {
    console.warn('Could not load the schedule:', e);
    scheduleView.reels = [];
  }
  plansView.slots = new Map(scheduleView.reels.map(r => [r.id, r.number]));
}

/* Move `dragged` to just before or after `target`, among the reels that have
   not gone out. A posted reel keeps its index whatever moves round it: episode
   2 went out as episode 2, and a drag that renumbered it would be rewriting
   what happened rather than planning what happens next. */
function reorderAround(order, posted, dragged, target, after) {
  if (dragged === target || posted.has(dragged) || !order.includes(target)) return order;
  const free = order.filter(id => !posted.has(id) && id !== dragged);
  let at;
  if (posted.has(target)) {
    /* Onto a posted reel: the nearest open slot on that side of it. The open
       slots are refilled in order, so the index wanted is a count of slots --
       the dragged reel's own included, since it is one of them. */
    const before = order.slice(0, order.indexOf(target)).filter(id => !posted.has(id)).length;
    at = after ? before : Math.max(0, before - 1);
  } else {
    at = free.indexOf(target) + (after ? 1 : 0);
  }
  free.splice(at, 0, dragged);
  let k = 0;
  return order.map(id => posted.has(id) ? id : free[k++]);
}

/* How far a reel on the schedule has got. Ready has its takes chosen, which
   is not the same as a reel anyone could post: without the middle step the
   one due on Friday and the one nobody had opened Final Cut for looked alike.
   Only posted holds a reel in its place; a finished one still moves. */
const PROGRESS = [
  ['ready', 'Ready', 'Takes chosen, not cut yet'],
  ['finished', 'Finished', 'Cut, and waiting to go out'],
  ['posted', 'Posted', 'It has gone out — its chosen moments become published, and it keeps its place'],
];
const progressOf = plan => plan.posted ? 'posted' : plan.finished ? 'finished' : 'ready';

function scheduleTile(reel, live, onProgress) {
  const plan = findPlan(reel.id) || reel;
  const chosen = plan.moments.filter(m => m.in_edit);
  /* The takes it will use, as the picture of the reel. With none chosen yet
     the pool stands in, faded, so a tile is never a blank row. */
  const shown = (chosen.length ? chosen : plan.moments).slice(0, 6);
  const length = chosen.map(m => live.get(m.id)).filter(Boolean)
    .reduce((n, r) => n + r.end - r.start, 0);
  const st = plan.posted ? 'published' : 'planned';
  const at = progressOf(plan);
  return el('div', {
    class: `sched-tile ${at}`,
    'data-state': st, 'data-plan': plan.id, tabindex: '0',
    draggable: plan.posted ? null : 'true',
    title: plan.posted ? 'Posted — it keeps its place' : 'Drag to move it, or Alt+↑ / Alt+↓',
  },
    el('div', { class: 'sched-thumbs' + (chosen.length ? '' : ' faded') },
      ...shown.map(m => thumb(m.id, 'shortlist-thumb', m.title || ''))),
    el('div', { class: 'sched-words' },
      el('button', { class: 'sched-title', title: 'Open it on Plans',
        onclick: () => showPlan(plan.id) }, stateBadge(st), ' ', plan.title || 'Untitled plan'),
      el('div', { class: 'stats' }, [
        plan.strand,
        chosen.length ? `${chosen.length} chosen · ${hms(length)}` : 'no takes chosen yet',
        plan.target && `target ${plan.target}`,
      ].filter(Boolean).join(' · '))),
    el('div', { class: 'sched-progress', role: 'group', 'aria-label': 'How far it has got' },
      ...PROGRESS.map(([key, name, why]) => el('button', {
        class: 'btn', 'data-step': key, 'aria-pressed': String(key === at),
        title: at === 'posted' && key !== 'posted' ? `${why} — un-posting puts its chosen moments back to planned` : why,
        onclick: e => { e.stopPropagation(); onProgress(plan.id, key); } },
        key === at && key !== 'ready' ? `✓ ${name}` : name))));
}

async function viewSchedule() {
  await flushPlans();
  await loadSchedule();
  if (!state.plansReady)
    return el('div', { class: 'empty' }, 'The plans could not be read: '
      + (state.plansError || 'the server did not answer') + '. Nothing has been changed.');
  let live = new Map();
  try { live = new Map((await api('/api/segments?')).map(r => [r.id, r])); } catch {}

  const reels = scheduleView.reels;
  const counts = el('span', { class: 'stats' });
  const paintCounts = () => {
    const at = reels.map(r => progressOf(findPlan(r.id) || r));
    counts.textContent = `${reels.length} on the schedule · `
      + PROGRESS.map(([key]) => `${at.filter(a => a === key).length} ${key}`).join(' · ');
  };
  paintCounts();
  const bar = el('div', { class: 'bar' }, counts,
    el('span', { class: 'stats spacer' }, 'Drag to reorder. A plan set to Ready on Plans appears here.'));
  if (!reels.length)
    return el('div', {}, bar, el('div', { class: 'empty' },
      'Nothing is ready yet — set a plan to Ready on Plans.'));

  let order = reels.map(r => r.id);
  let dragging = null;
  const board = el('div', { class: 'schedule-board' },
    ...order.map((_, i) => el('div', { class: 'sched-num', 'aria-hidden': 'true',
      style: `grid-row:${i + 1}` }, String(i + 1))));
  const tiles = new Map();
  const posted = () => new Set(order.filter(id => findPlan(id)?.posted));

  /* Only the tiles move. Each is given its row outright and re-appended in
     order, so the tab order follows what is on screen. */
  const arrange = () => order.forEach((id, i) => {
    const tile = tiles.get(id);
    tile.style.gridRow = String(i + 1);
    board.append(tile);
  });

  const commit = async moved => {
    const before = scheduleView.reels.map(r => r.id);
    if (order.join('\n') === before.join('\n')) return;
    try {
      const got = await api('/api/schedule', sendJSON('PUT', { revision: scheduleView.revision, order }));
      const after = [...order];
      remember(`moved ${planTitle(findPlan(moved))} on the schedule`,
        async () => { await putScheduleBack(before); await renderInPlace(); },
        async () => { await putScheduleBack(after); await renderInPlace(); });
      scheduleView.revision = got.revision;
      scheduleView.reels = got.reels;
      plansView.slots = new Map(got.reels.map(r => [r.id, r.number]));
    } catch (e) {
      toast(e.status === 409 ? 'The schedule changed elsewhere — reloaded; move it again'
        : 'could not move it: ' + e.message);
      renderView();
    }
  };

  /* Both marks in one save, so the server never sees a reel posted and not
     finished on the way from one to the other. */
  const onProgress = async (id, step) => {
    const plan = findPlan(id);
    if (!plan || progressOf(plan) === step) return;
    const wasPosted = plan.posted;
    const before = planSnapshot(plan, ['finished', 'posted']);
    plan.finished = step !== 'ready';
    plan.posted = step === 'posted';
    const tile = scheduleTile(plan, live, onProgress);
    tiles.get(id).replaceWith(tile);
    tiles.set(id, tile);
    arrange();
    paintCounts();
    tile.querySelector(`[data-step="${step}"]`)?.focus();
    rememberPlan(plan, before, `marked ${planTitle(plan)} ${step}`);
    await savePlan(plan, ['finished', 'posted']);
    if (wasPosted !== plan.posted) await loadStates();
  };

  for (const r of reels) tiles.set(r.id, scheduleTile(r, live, onProgress));
  arrange();

  board.addEventListener('dragstart', e => {
    const tile = e.target.closest?.('.sched-tile');
    if (!tile || tile.classList.contains('posted')) return e.preventDefault();
    dragging = tile.dataset.plan;
    tile.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragging);
  });
  board.addEventListener('dragover', e => {
    if (!dragging) return;
    e.preventDefault();
    const over = e.target.closest?.('.sched-tile');
    if (!over || over.dataset.plan === dragging) return;
    const box = over.getBoundingClientRect();
    const next = reorderAround(order, posted(), dragging, over.dataset.plan,
      e.clientY > box.top + box.height / 2);
    if (next.join('\n') !== order.join('\n')) { order = next; arrange(); }
  });
  board.addEventListener('drop', e => e.preventDefault());
  board.addEventListener('dragend', () => {
    tiles.get(dragging)?.classList.remove('dragging');
    const moved = dragging;
    dragging = null;
    commit(moved);
  });
  /* The same move without a mouse: one open slot up or down. */
  board.addEventListener('keydown', e => {
    const tile = e.target.closest?.('.sched-tile');
    if (!tile || e.target !== tile || !e.altKey || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const id = tile.dataset.plan, held = posted();
    if (held.has(id)) return toast('A posted reel keeps its place');
    const free = order.filter(x => !held.has(x));
    const down = e.key === 'ArrowDown';
    const neighbour = free[free.indexOf(id) + (down ? 1 : -1)];
    if (!neighbour) return;
    order = reorderAround(order, held, id, neighbour, down);
    arrange();
    tile.focus();
    commit(id);
  });

  if (scheduleView.focus) {
    const id = scheduleView.focus;
    scheduleView.focus = null;
    setTimeout(() => {
      const tile = tiles.get(id);
      tile?.scrollIntoView({ block: 'center' });
      tile?.focus({ preventScroll: true });
    }, 0);
  }
  return el('div', {}, bar, board);
}

function showOnSchedule(id) {
  scheduleView.focus = id;
  state.tab = 'Schedule';
  render();
}

/* Three quotes, then a count. A moment can have a dozen lines with the word
   in them, and a card that lists all twelve has stopped being a row in a
   list; the moment itself is one click away and has the rest. */
const SAID_SHOWN = 3;

/* Every filter that is narrowing the list, each with a cross. They outlive a
   visit to another tab -- the legend on Plans sets a state and sends you here
   -- and a search for "coconut" then came back empty under an Unseen filter
   whose only sign was a highlighted row halfway down the sidebar. */
const clearFilters = () => { state.segState = ''; state.rating = ''; state.tags = []; };
function activeFilters() {
  const chip = (label, clear) => el('button', { class: 'filter-chip', title: 'Stop filtering by this',
    onclick: () => { clear(); renderSide(); renderView(); } }, ...label, ' ×');
  return [
    state.segState ? chip([stateBadge(state.segState), ' ', stateInfo(state.segState)[1]],
      () => { state.segState = ''; }) : null,
    state.rating ? chip([`rating: ${state.rating}`], () => { state.rating = ''; }) : null,
    ...state.tags.map(t => chip([t], () => { state.tags = state.tags.filter(x => x !== t); })),
  ].filter(Boolean);
}

async function viewSegments() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.segState) p.set('state', state.segState);
  if (state.rating) p.set('rating', state.rating);
  for (const t of state.tags) p.append('tag', t);
  const filters = activeFilters();
  const filterBar = filters.length ? el('div', { class: 'bar filters' },
    el('span', { class: 'stats' }, 'Only showing'), ...filters) : null;
  let rows;
  try { rows = await api('/api/segments?' + p); }
  catch (e) { return segmentsPage(filterBar,
    el('div', { class: 'empty' }, 'Search error: ' + e.message)); }
  if (!rows.length) {
    /* Say what the filters are hiding, so an empty list is never mistaken
       for search not finding the word. */
    let hidden = 0;
    if (filters.length && state.q) {
      try { hidden = (await api('/api/segments?' + new URLSearchParams({ q: state.q }))).length; }
      catch {}
    }
    return segmentsPage(filterBar, el('div', { class: 'empty' },
      hidden ? el('div', {}, `Nothing here matches “${state.q}”, but ${hidden} moment(s) do once the filters are off. `,
        el('button', { class: 'btn', onclick: () => { clearFilters(); renderSide(); renderView(); } },
          `Show all ${hidden}`))
      : 'No segments match.'));
  }

  return segmentsPage(filterBar, split(
    el('div', { class: 'bar' },
      el('span', { class: 'stats' }, `${rows.length} moment(s)`)),
    ...rows.map(r => el('div', {
      class: 'row' + (state.openSeg === r.id ? ' on' : ''),
      'data-seg': r.id,
      onclick: () => selectSegment(r.id),
    },
      thumb(r.id),
      el('div', { class: 't' }, segBadge(r.id), r.title || '(untitled)'),
      el('div', { class: 'm' },
        `${hms(r.start)}–${hms(r.end)}`,
        r.rating === 'favorite' ? ' ★' : r.rating === 'rejected' ? ' ✕' : ''),
      el('div', { class: 's' }, r.stem + (r.summary ? ' — ' + r.summary : '')),
      /* What was said, when the search found it in the transcript rather than
         in the prose. A moment averages 28 seconds and one of them runs 108,
         so "he says it somewhere in here" is not the answer you came for:
         each of these opens the moment with the player on that sentence. */
      r.said?.length ? el('div', { class: 'said' },
        ...r.said.slice(0, SAID_SHOWN).map(l => el('div', {
          class: 'saidline', title: 'Open the moment where this is said',
          onclick: e => { e.stopPropagation(); selectSegment(r.id, l.start); },
        },
          el('span', { class: 'tc' }, hms(l.start)),
          el('span', { class: 'quote' }, l.en || l.kok || ''))),
        r.said.length > SAID_SHOWN
          ? el('div', { class: 'saidmore' },
              `and ${r.said.length - SAID_SHOWN} more in this moment`)
          : null) : null,
      r.reels ? el('div', { class: 's' },
        ...r.reels.split(',').map(slug => el('span', { class: 'pill fav' }, 'in ' + slug))) : null,
      planUsage(r.id),
      el('div', { class: 'tags' }, ...(r.tags || '').split(' ').filter(Boolean)
        .map(t => el('span', { class: 'tag' }, t)))))));
}

/* Captions for a cut that was assembled in an editor rather than here.

   The other direction already worked: a cut made here exports with its lines
   on it. This is for after the edit has been argued with -- b-roll cut in,
   music under it -- when the running order is the editor's and the
   translations still have to land on it.

   The .fcpxml is read in the browser and posted as text. Final Cut's own
   library was the tempting shortcut and does not hold a running order: the
   clips are in there, the order is not.

   Either editor's XML is read the same way, so there is nothing to choose
   here. What the header's choice changes is the sentence about where the
   .srt goes afterwards, because the two menu paths are not alike. */
function viewTimelineCaptions() {
  const out = el('div', {});

  const run = async (xml, name) => {
    state.timelineName = name || state.timelineName;
    try {
      state.timeline = await api('/api/captions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ xml, lang: state.timelineLang,
                               editor: state.editor }),
      });
      state.timeline.xml = xml;
      renderView();
    } catch (e) { toast('could not read it: ' + e.message); }
  };

  const take = file => {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => run(String(r.result), file.name);
    r.readAsText(file);
  };

  /* Since 10.6.6 Final Cut exports a `.fcpxmld` *bundle*, which is a folder
     with Info.fcpxml in it. Finder shows it as one file and the browser hands
     it over as a directory entry, so a plain `dataTransfer.files[0]` is empty
     and the drop looks broken for the format everyone actually gets. */
  const fromDrop = async dt => {
    for (const item of [...(dt.items || [])]) {
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (entry && entry.isDirectory) {
        return await new Promise((resolve, reject) => entry.getFile(
          'Info.fcpxml', {}, fe => fe.file(resolve, reject),
          () => reject(new Error(entry.name + ' has no Info.fcpxml in it'))));
      }
    }
    return dt.files[0];
  };

  const save = (text, name) => {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    const a = el('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const picker = el('input', { type: 'file', accept: '.fcpxml,.xml',
    style: 'display:none', onchange: e => take(e.target.files[0]) });

  const drop = el('div', {
    class: 'empty', style: 'border:2px dashed var(--line,#555);padding:28px;'
      + 'border-radius:8px;cursor:pointer;text-align:center',
    onclick: () => picker.click(),
    ondragover: e => { e.preventDefault(); drop.style.opacity = '.6'; },
    ondragleave: () => { drop.style.opacity = '1'; },
    ondrop: async e => {
      e.preventDefault(); drop.style.opacity = '1';
      try { take(await fromDrop(e.dataTransfer)); }
      catch (err) { toast(err.message); }
    },
  },
    el('div', {}, el('strong', {}, 'Drop the timeline\u2019s XML here'),
      ' — or click to pick an .fcpxml'),
    el('div', { class: 'm', style: 'margin-top:8px' },
      'In Final Cut: select the project in the browser, then File ▸ Export '
      + 'XML — the project, not the event, since an event has no timeline '
      + 'in it. A .fcpxmld bundle can be dropped whole.'),
    el('div', { class: 'm' },
      'In Resolve: right-click the timeline in the media pool, then Timelines '
      + '▸ Export ▸ FCPXML 1.10. Not the FCP7 XML above it, which is '
      + 'a different format.'));

  out.append(el('div', { class: 'bar' },
    el('span', { class: 'stats' }, 'Captions for a cut you made in an editor'),
    el('span', { class: 'spacer' }),
    el('select', { style: 'width:auto', title: 'Which language the captions carry',
      onchange: e => {
        state.timelineLang = e.target.value;
        if (state.timeline) run(state.timeline.xml, state.timelineName);
      } }, ...[['en', 'English'], ['kok', spokenName()], ['both', 'Both']].map(
      ([v, label]) => el('option', { value: v,
        selected: state.timelineLang === v || null }, label)))),
    picker, drop);

  const tl = state.timeline;
  if (!tl) return out;

  out.append(el('div', { class: 'bar', style: 'margin-top:16px' },
    el('span', { class: 'stats' },
      `${tl.project} · ${tl.shots.length} shots · ${hms(tl.duration)} · `
      + `${tl.captions.length} captions`),
    el('span', { class: 'spacer' }),
    /* Handed over as downloads rather than written into the archive: an .srt
       is a thing an editor imports, not a decision worth keeping, and it is
       regenerated in a second from the document the editor exported. */
    el('button', { class: 'btn primary', title: 'One file per voice. An .srt '
      + 'has nowhere to put a speaker, so import each as its own caption track '
      + 'and colour the track.',
      onclick: () => {
        const parts = Object.entries(tl.by_speaker || {});
        if (!parts.length) return toast('nothing is said in this cut');
        /* One download a file, staggered: a browser asked for four at once
           treats the second as the one it should block. */
        parts.forEach(([who, body], i) => setTimeout(
          () => save(body, `${tl.slug || 'timeline'}.${who}.srt`), i * 300));
        toast(`${parts.length} track(s) — colour each one after importing`);
      } }, 'Download .srt per speaker'),
    el('button', { class: 'btn', title: 'Every caption in one file, with no '
      + 'speakers in it — an .srt has nowhere to put one.',
      onclick: () => {
        save(tl.srt, (tl.slug || 'timeline') + '.srt');
        toast('one file, every caption, no speakers');
      } }, 'Download one .srt')));

  /* Where the file goes afterwards, in the words of whichever editor is
     chosen. Two very different menus, and the page used to name only one. */
  out.append(el('div', { class: 's' },
    `Import it in ${editorLabel()}: ${tl.captions_menu || 'File > Import > Captions'}.`));

  if (tl.skipped.length) out.append(el('div', { class: 's' },
    'Nothing said for: ' + tl.skipped.join(', ')
    + ' — not in the archive, which is what music and titles look like.'));
  for (const problem of tl.problems)
    out.append(el('div', { class: 's' }, el('span', { class: 'pill rej' }, problem)));

  out.append(el('div', { style: 'margin-top:12px' }, ...tl.shots.map(s => el('div',
    { class: 'row' },
    el('span', {}),
    el('div', { class: 't' }, s.stem),
    el('div', { class: 'm' }, hms(s.offset)),
    el('div', { class: 's' },
      `source ${s.start.toFixed(1)}–${s.end.toFixed(1)}s · `
      + (s.lines ? `${s.lines} line(s)` : 'nothing said')
      + (s.lane ? ` · lane ${s.lane}` : '')),
    s.problem ? el('div', { class: 's' },
      el('span', { class: 'pill rej' }, s.problem)) : null))));

  out.append(el('h4', { style: 'margin-top:18px' }, 'What it will say'));
  out.append(el('ol', {}, ...tl.captions.map(c => el('li', {},
    el('span', { class: 'm' }, `${hms(c.start)}  `),
    el('span', {}, c.text)))));
  return out;
}

// --- the player ------------------------------------------------------
//
// The proxies analysis already built are 480p and about a megabyte, which is
// the only thing here small enough to scrub over HTTP -- and quite enough to
// find a trim point. Playing a cut means seeking one <video> from shot to
// shot: there is a beat at each join while the next clip loads, so this shows
// you the running order and the performances, not the finished rhythm.

const playable = shots => shots.filter(s => s.proxy !== false && !s.problem);
/* A quote needs a breath either side of it, the same one `reel add --line`
   leaves. */
const LINE_PAD = 0.3;

const player = {
  video: null, queue: [], at: 0, onShot: null, lines: [],

  /* One <video> for the life of the editor. Every edit re-renders the cut, and
     a fresh element each time would stop playback the moment you set an in
     point -- which is exactly when you are watching. */
  mount(onShot) {
    this.onShot = onShot;
    if (this.video) return this.video;
    const v = this.video = el('video', {
      controls: '', playsinline: '', preload: 'metadata',
    });
    v.addEventListener('timeupdate', () => this.tick());
    v.addEventListener('ended', () => this.next());
    return v;
  },

  dispose() {
    if (this.video) this.video.pause();
    this.video = null; this.queue = []; this.at = 0;
  },

  /* After an edit the shots are new objects with new out points. Swap them in
     without reloading, so a trim you just made takes effect where you are. */
  retarget(shots) {
    const playing = this.queue[this.at];
    this.queue = playable(shots);
    if (!playing) { this.at = 0; return; }
    const same = this.queue.findIndex(
      s => playing.id ? s.id === playing.id
        : s.stem === playing.stem && Math.abs(s.start - playing.start) < 30);
    this.at = Math.max(0, same >= 0 ? same : Math.min(this.at, this.queue.length - 1));
  },

  /* Whether anything has been loaded yet -- the keyboard has to be able to
     start the cut, not only toggle one that is already running. */
  started() { return Boolean(this.video && this.video.src); },

  /* Each shot is {stem, start, end}; playback runs them back to back.
     `from` indexes the caller's list, which may include shots that cannot be
     played -- filtering first and reusing the index would start the wrong one. */
  play(shots, from = 0) {
    const wanted = shots[from];
    this.queue = playable(shots);
    const at = this.queue.indexOf(wanted);
    this.at = at >= 0 ? at : 0;
    this.load(true);
  },

  load(autoplay) {
    const shot = this.queue[this.at];
    if (!shot) return;
    const src = '/media/' + encodeURIComponent(shot.stem) + '.mp4';
    const seek = () => {
      this.video.currentTime = shot.start;
      if (autoplay) this.video.play().catch(() => {});
    };
    if (!this.video.src.endsWith(src)) {
      this.video.src = src;
      this.video.addEventListener('loadedmetadata', seek, { once: true });
    } else seek();
    if (this.onShot) this.onShot(shot, this.at);
  },

  tick() {
    const shot = this.queue[this.at];
    if (!shot) return;
    // A frame of slack: timeupdate fires every ~250ms, so an exact test
    // overshoots into the next moment before it notices.
    if (this.video.currentTime >= shot.end - 0.04) this.next();
    if (this.onShot) this.onShot(shot, this.at, this.video.currentTime);
  },

  next() {
    if (this.at + 1 >= this.queue.length) { this.video.pause(); return; }
    this.at += 1;
    this.load(true);
  },

  /* Where the playhead is, in the source clip's own seconds -- which is what
     an in or out point is measured in. Proxies keep the original timing. */
  head() { return this.video ? this.video.currentTime : null; },
  stem() { return (this.queue[this.at] || {}).stem; },
};

/* A one-range preview, for looking at a moment rather than editing a cut.
   Separate from `player` on purpose: the dialog is torn down on close, and a
   shared element would be dragged in and out of the DOM with it. */
function rangePreview(stem, start, end, lines, at = null) {
  const video = el('video', { controls: '', playsinline: '', preload: 'metadata',
    src: '/media/' + encodeURIComponent(stem) + '.mp4' });
  const sub = el('div', { class: 'sub' });
  const show = t => {
    const spoken = spokenAt(lines, t);
    sub.replaceChildren(...[
      spoken ? el('div', {}, spoken.en || '') : el('span', { class: 'kok' }, '—'),
      spoken && spoken.kok ? el('div', { class: 'kok' }, spoken.kok) : null,
    ].filter(Boolean));
  };
  /* `at` is where a line search landed you: opening the moment from a hit on
     something said should start on that sentence, not 90 seconds before it. */
  const from = at !== null && at >= start && at < end ? at : start;
  video.addEventListener('loadedmetadata', () => { video.currentTime = from; show(from); },
    { once: true });
  video.addEventListener('timeupdate', () => {
    if (video.currentTime >= end - 0.04) { video.pause(); video.currentTime = start; }
    show(video.currentTime);
  });
  return el('div', { class: 'player', style: 'position:static; border:0; padding:0' },
    video,
    el('div', {},
      el('div', { class: 'bar', style: 'margin:0 0 8px' },
        el('button', { class: 'btn', onclick: () => {
          video.currentTime = start; video.play().catch(() => {});
        } }, '▶ Play this moment'),
        el('span', { class: 'stats' }, `${hms(start)}–${hms(end)}`)),
      sub));
}

function spokenAt(lines, t) {
  return (lines || []).find(l => t >= l.start - 0.15 && t <= l.end + 0.15);
}

// --- the cut editor --------------------------------------------------

async function saveCut(slug, patch) {
  return api('/api/cut/' + encodeURIComponent(slug), {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
}

/* The whole running order is sent on every change rather than a diff: there is
   then no position to race against, and a reorder cannot half apply. */
async function mutateShots(cut, fn) {
  const shots = cut.shots.map(s => ({
    stem: s.stem, start: s.start, end: s.end,
    segment_id: s.segment_id, note: s.note,
  }));
  const next = fn(shots) || shots;
  try {
    await saveCut(cut.slug, { shots: next });
    renderView();
  } catch (e) { toast('save failed: ' + e.message); }
}

async function viewCut(slug) {
  let cut;
  try { cut = await api('/api/cut/' + encodeURIComponent(slug)); }
  catch (e) { state.openCut = null; return el('div', { class: 'empty' }, e.message); }

  const f = {};
  const head = el('div', {},
    el('div', { class: 'bar' },
      el('button', { class: 'iconbtn', onclick: () => { state.openCut = null; renderView(); } }, '← All cuts'),
      el('span', { class: 'stats' },
        `${cut.shots.length} shots · ${cut.clips.length} clips · ${hms(cut.duration)}` +
        /* Which editor, since the two go to different files and the one
           timestamp cannot say which of them is on disk. */
        (cut.stale ? ' · changed since export — a re-export arrives as a second timeline'
          : cut.exported_at ? ' · exported to ' + editorLabel(cut.exported_editor)
            + ', unchanged since' : '')),
      el('span', { class: 'spacer' }),
      /* Both editors, named, rather than one button meaning whichever the
         header is set to. The header decides which is filled; the other is
         still one click, because "send this one to Resolve" is a thing you
         decide about a cut and not about an evening. */
      ...state.editors.map(ed => el('button', {
        class: 'btn' + (ed.name === state.editor ? ' primary' : ''),
        onclick: async () => {
          try {
            const r = await api('/api/cut/' + encodeURIComponent(slug) + '/export',
              { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ editor: ed.name }) });
            toast(`exported ${hms(r.duration)} → ${r.path.split('/').pop()}`);
            if (r.problems.length) alert('Left out of the timeline:\n' + r.problems.join('\n'));
            renderView();
          } catch (e) { toast('export failed: ' + e.message); }
        } }, 'Export to ' + (ed.name === 'fcp' ? 'Final Cut' : 'Resolve'))),
      el('button', { class: 'btn', title: 'Move every in and out point to the '
        + 'nearest edge of an utterance. A copy of the cut goes to the trash first.',
        onclick: async () => {
          try {
            const r = await api('/api/cut/' + encodeURIComponent(slug) + '/snap',
              { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}) });
            toast(r.moved ? `${r.moved} shot(s) moved onto speech`
                          : 'every shot already starts and ends on speech');
            if (r.moved) renderView();
          } catch (e) { toast('could not snap: ' + e.message); }
        } }, 'Snap to speech'),
      ...RENDER_KINDS.map(([kind, lang, label, why]) =>
        el('button', { class: 'btn', title: why,
          onclick: () => startRender(slug, kind, lang) }, label)),
      el('button', { class: 'btn', title: 'Try a shorter one without losing this one',
        onclick: async () => {
          const title = prompt('Call the copy what?', cut.title + ', shorter');
          if (!title) return;
          try {
            const copy = await api('/api/cut/' + encodeURIComponent(slug) + '/duplicate', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title }) });
            state.cuts = []; state.openCut = copy.slug;
            toast(`${copy.slug}: a copy of ${slug}`); renderView();
          } catch (e) { toast('could not copy: ' + e.message); }
        } }, 'Duplicate'),
      el('button', { class: 'btn danger', onclick: async () => {
        if (!confirm(`Delete the cut “${cut.title}”? The footage is untouched, and a `
          + `copy goes to index/.trash — \`greels trash list\` gets it back.`)) return;
        await api('/api/cut/' + encodeURIComponent(slug), { method: 'DELETE' });
        state.openCut = null; toast('deleted'); renderView();
      } }, 'Delete')),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, 'Title'),
        f.title = el('input', { value: cut.title })),
      el('div', {}, el('label', {}, 'Status'),
        f.status = el('select', {}, ...['planned', 'cut', 'published'].map(v =>
          el('option', { value: v, selected: cut.status === v || null }, v))))),
    el('div', {}, el('label', {}, 'Hook — the idea, or the opening line'),
      f.hook = el('input', { value: cut.hook || '' })),
    el('div', {}, el('label', {}, 'Notes'),
      f.notes = el('textarea', {})),
    el('div', { class: 'bar' },
      f.save = el('button', { class: 'btn', onclick: async () => {
        try {
          await saveCut(slug, { title: f.title.value, status: f.status.value,
                                hook: f.hook.value, notes: f.notes.value });
          toast('saved'); renderView();
        } catch (e) { toast('save failed: ' + e.message); }
      } }, 'Save details')),
  );
  f.notes.value = cut.notes || '';

  /* Leaving this view discards what is typed in it, and nothing about a plain
     grey button says there is anything to lose. It goes bright the moment one
     of these differs from what was loaded. */
  const saved = () => [f.title.value, f.status.value, f.hook.value, f.notes.value];
  const asLoaded = JSON.stringify(saved());
  for (const field of [f.title, f.status, f.hook, f.notes])
    field.addEventListener('input', () => f.save.classList.toggle(
      'primary', JSON.stringify(saved()) !== asLoaded));

  const ruler = cut.duration ? el('div', { class: 'ruler', title: 'shot lengths' },
    ...cut.shots.map((s, i) => el('span', {
      style: `flex: ${Math.max(s.duration, 0.1)}; background: ${
        s.problem ? 'var(--bad)' : i % 2 ? 'var(--accent)' : 'var(--muted)'}`,
      title: `${s.display_title} — ${s.duration.toFixed(1)}s`,
      onclick: () => player.play(cut.shots, i),
    }))) : null;

  const canPlay = playable(cut.shots);
  const now = el('div', { class: 'now' });
  const sub = el('div', { class: 'sub' });
  /* The whole moment's dialogue, not only the shot's trim: an in point is
     usually "start where he says that", and the line you want is often just
     outside what the shot currently holds. */
  const script = el('div', { class: 'transcript' });
  let scripted = null;

  const showShot = (shot, i, at) => {
    const spoken = spokenAt(shot.lines, at ?? shot.start);
    now.replaceChildren(
      el('b', {}, `${i + 1}. ${shot.display_title}`),
      el('div', { class: 'm' },
        `${shot.stem}  ${(at ?? shot.start).toFixed(1)}  ` +
        `[in ${shot.start.toFixed(1)} · out ${shot.end.toFixed(1)}]`));
    sub.replaceChildren(...[
      spoken ? el('div', {}, spoken.en || '') : el('span', { class: 'kok' }, '—'),
      spoken && spoken.kok ? el('div', { class: 'kok' }, spoken.kok) : null,
    ].filter(Boolean));

    if (scripted !== shot) {
      scripted = shot;
      let anchor = null;
