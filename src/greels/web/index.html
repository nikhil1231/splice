      /* Click plays from a line; shift-click takes the run between the two as
         the shot. Trimming a 113-second answer down to the twenty seconds
         that matter is otherwise four gestures and two number fields, and
         this is the half of the archive where that keeps happening. */
      script.replaceChildren(...(shot.lines || []).map((line, at) => el('div', {
        'data-at': String(line.start),
        class: line.inside === false ? 'outside' : '',
        title: line.inside === false
          ? 'Outside the trim — play from here, or shift-click to take it in'
          : 'Play from here; shift-click another line to keep just that run',
        onclick: e => {
          const lines = shot.lines || [];
          if (e.shiftKey && anchor !== null) {
            const from = lines[Math.min(anchor, at)], to = lines[Math.max(anchor, at)];
            const clip = shot.clip_duration ?? to.end;
            mutateShots(cut, shots => {
              shots[i].start = Math.max(0, from.start - LINE_PAD);
              shots[i].end = Math.min(clip, to.end + LINE_PAD);
            });
            return;
          }
          anchor = at;
          const video = player.video;
          if (!video) return;
          video.currentTime = line.start;
          video.play().catch(() => {});
        },
      }, el('span', { class: 'tc' }, `${hms(line.start)}  `),
         el('span', {}, line.en || line.kok || ''))));
    }
    for (const line of script.children)
      line.classList.toggle('on', spoken && Math.abs(parseFloat(line.dataset.at) - spoken.start) < 0.01);
  };
  const video = player.mount(showShot);
  player.retarget(cut.shots);

  /* Trimming is play, mark in, mark out, next -- four keys, done a hundred
     times. Reaching for two number fields between each one is the slow part. */
  cutKeys.handle = e => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    const shot = player.queue[player.at];
    const i = shot ? cut.shots.indexOf(shot) : -1;
    const at = player.head();
    const trim = (start, end) => {
      const clip = shot.clip_duration ?? end;
      mutateShots(cut, shots => {
        shots[i].start = Math.max(0, Math.min(start, clip));
        shots[i].end = Math.max(shots[i].start + 0.1, Math.min(end, clip));
      });
    };

    if (e.key === ' ') {
      if (!player.started()) player.play(cut.shots, 0);
      else if (video.paused) video.play().catch(() => {});
      else video.pause();
    }
    else if (e.key === 'ArrowRight') player.next();
    else if (e.key === 'ArrowLeft') { player.at = Math.max(0, player.at - 1); player.load(true); }
    else if (!shot || i < 0) return;
    else if (e.key.toLowerCase() === 'i' && at !== null) trim(at, Math.max(at + 0.2, shot.end));
    else if (e.key.toLowerCase() === 'o' && at !== null) trim(Math.min(shot.start, at - 0.2), at);
    else if (e.key === '[') trim(shot.start + (e.shiftKey ? -0.5 : 0.5), shot.end);
    else if (e.key === ']') trim(shot.start, shot.end + (e.shiftKey ? 0.5 : -0.5));
    else return;
    e.preventDefault();
  };

  const list = el('div', { id: 'shots' },
    ...cut.shots.map((s, i) => shotRow(cut, s, i)));

  const rendered = el('div', { id: 'rendered' });
  renderPanel(slug, rendered);

  return el('div', {},
    el('div', { class: 'cut-head' }, el('h2', {}, cut.title)),
    head,
    rendered,
    canPlay.length ? el('div', { class: 'player' },
      video,
      el('div', {},
        el('div', { class: 'bar', style: 'margin:0 0 10px' },
          el('button', { class: 'btn primary',
            onclick: () => player.play(cut.shots, 0) }, '▶ Play the cut'),
          el('span', { class: 'stats' },
            'Shots run back to back — there is a beat at each join while the next clip loads.')),
        el('div', { class: 'keys' },
          el('kbd', {}, 'Space'), ' play/pause   ',
          el('kbd', {}, '←'), el('kbd', {}, '→'), ' shot   ',
          el('kbd', {}, 'I'), ' in here   ',
          el('kbd', {}, 'O'), ' out here   ',
          el('kbd', {}, '['), el('kbd', {}, ']'), ' nudge in/out (⇧ the other way)'),
        now, sub, script)) : null,
    ruler,
    cut.shots.length ? list
      : el('div', { class: 'empty' }, 'No shots yet — add them from Segments.'),
    cut.problems.length ? el('p', { class: 'stats' },
      'A shot comes loose when its clip is gone or its range runs past the end of a replaced file. It is kept here and left out of the timeline.') : null,
    cut.observations.length ? el('div', { class: 'keys' },
      el('div', {}, 'What you might notice on a second viewing — none of it is a rule:'),
      ...cut.observations.map(n => el('div', {},
        `· ${n.shot === null ? 'This cut' : 'Shot ' + (n.shot + 1)} ${n.text}`))) : null,
  );
}

/* Rendering a cut: the only thing here that takes long enough to need to say
   how it is going. The panel is filled from the server's own idea of the
   state, not from what the button did, so a reload during a render finds it
   still running rather than nothing at all. */
const RENDER_POLL = 1200;
let renderTimer = null;

/* Two renders, and they are for different things. One to watch back yourself,
   with the subtitles as a track you can turn off; one to send to the people in
   it, where a track does not survive the sending. */
/* What the original lines are called: the project's language, from
   greels.yaml, or "Original" for one that has not said. */
const spokenName = () => state.overview?.language || 'Original';

const RENDER_KINDS = [
  ['soft', 'en', 'Render a video', 'Subtitles as a track you can turn off — for watching it back'],
  ['burn', 'both', 'Render one to send',
   'Captions drawn on the picture, the original above the English, and small enough to send'],
];

async function startRender(slug, captions = 'soft', lang = 'en') {
  try {
    await api('/api/cut/' + encodeURIComponent(slug) + '/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      /* One to send is one that can be sent: a five-minute cut at the bitrate
         a phone shoots is a quarter of a gigabyte. */
      body: JSON.stringify({ source: 'raw', level: true, captions, lang,
                             fit: captions === 'burn' }),
    });
    toast('rendering — this takes about a fifth of the running time');
    renderPanel(slug, $('#rendered'));
  } catch (e) { toast('render failed: ' + e.message); }
}

async function renderPanel(slug, host) {
  if (!host) return;
  clearTimeout(renderTimer);
  let state;
  try { state = await api('/api/cut/' + encodeURIComponent(slug) + '/render'); }
  catch (e) { return; }
  if (!document.body.contains(host)) return;   // the view moved on

  host.textContent = '';
  if (state.state === 'running') {
    host.append(el('div', { class: 'bar' },
      el('div', { class: 'progress' },
        el('div', { class: 'fill', style: `width:${Math.round(state.progress * 100)}%` })),
      el('span', { class: 'stats' },
        state.total ? `rendering — ${hms(state.done)} of ${hms(state.total)}`
                    : 'rendering — starting up')));
    renderTimer = setTimeout(() => renderPanel(slug, host), RENDER_POLL);
    return;
  }
  if (state.state === 'failed')
    host.append(el('p', { class: 'stats bad' }, 'render failed: ' + state.error));
  if (!state.exists) return;

  const video = el('video', {
    controls: '', playsinline: '', preload: 'metadata',
    src: '/render/' + encodeURIComponent(slug) + '.mp4?v=' + (state.rendered_at || ''),
  });
  /* Only over a file that has none of its own. The two renders overwrite each
     other, and a subtitle track laid over a video with the captions already
     drawn on shows both.

     They come from the cut as it stands rather than from the file, which is
     what makes them right after a trim and wrong only after a re-render --
     the safer way round of the two. */
  if (state.rendered_captions !== 'burn') video.append(el('track', {
    kind: 'captions', srclang: 'en', label: 'English', default: '',
    src: '/captions/' + encodeURIComponent(slug) + '.vtt',
  }));
  host.append(el('div', { class: 'player' }, video, el('div', {},
    el('p', { class: 'stats' },
      `The cut as one file — no gaps, levels matched, captions `
      + (state.rendered_captions === 'burn' ? 'drawn on'
         : state.rendered_captions === 'none' ? 'left out' : 'as a track')
      + `. ${(state.bytes / 1e6).toFixed(0)} MB`
      + (state.bytes > 100e6
          ? ' · more than most ways of sending a video will take'
          : '')
      + (state.stale ? ' · the cut has changed since this was rendered' : '')),
    el('div', { class: 'bar' },
      ...RENDER_KINDS.map(([kind, lang, label, why]) =>
        el('button', { class: 'btn', title: why,
          onclick: () => startRender(slug, kind, lang) },
          kind === 'soft' ? 'Render again' : 'Render one to send')),
      el('a', { class: 'btn', href: '/render/' + encodeURIComponent(slug) + '.mp4',
                download: slug + '.mp4' }, 'Save it'),
      el('span', { class: 'stats' }, state.path)))));
}

function shotRow(cut, s, i) {
  const num = (value, onchange) => el('input', {
    type: 'number', step: '0.1', min: '0', value: value.toFixed(1),
    onchange: e => onchange(parseFloat(e.target.value)),
  });
  const setRange = (start, end) => mutateShots(cut, shots => {
    const clip = s.clip_duration ?? end;
    shots[i].start = Math.max(0, Math.min(start, clip));
    shots[i].end = Math.max(shots[i].start + 0.1, Math.min(end, clip));
  });
  const move = to => mutateShots(cut, shots => {
    if (to < 0 || to >= shots.length) return;
    shots.splice(to, 0, shots.splice(i, 1)[0]);
  });

  const row = el('div', {
    class: 'shot' + (s.problem ? ' broken' : ''), draggable: 'true', 'data-i': String(i),
  },
    el('div', { class: 'n' }, String(i + 1)),
    s.segment_id
      ? el('img', { class: 'thumb', loading: 'lazy', alt: '',
          src: '/thumb/' + encodeURIComponent(s.segment_id),
          title: 'Play from here',
          onerror: e => e.target.setAttribute('data-missing', ''),
          onclick: () => player.play(cut.shots, i) })
      : el('div', { class: 'thumb' }),
    el('div', { class: 't' }, s.display_title),
    el('div', { class: 'at' }, `${hms(s.offset)} · ${s.duration.toFixed(1)}s`),
    el('div', { class: 'src' },
      el('a', { href: '#', onclick: e => { e.preventDefault();
        if (s.segment_id) openSegment(s.segment_id); } }, s.stem),
      ` ${s.start.toFixed(1)}–${s.end.toFixed(1)}`,
      s.segment_start !== null && s.segment_start !== undefined
        ? ` (moment ${s.segment_start.toFixed(0)}–${s.segment_end.toFixed(0)})` : ''),
    s.problem ? el('div', { class: 'warn' }, '⚠ ' + s.problem) : null,
    el('div', { class: 'trim' },
      el('label', {}, 'in'), num(s.start, v => setRange(v, s.end)),
      el('label', {}, 'out'), num(s.end, v => setRange(s.start, v)),
      s.segment_start !== null && s.segment_start !== undefined
        ? el('button', { class: 'iconbtn', title: 'Back to the whole moment',
            onclick: () => setRange(s.segment_start, s.segment_end) }, 'reset') : null,
      el('button', { class: 'iconbtn', title: 'Play from here',
        onclick: () => player.play(cut.shots, i) }, '▶'),
      el('button', { class: 'iconbtn', title: 'In point = where the playhead is',
        onclick: () => {
          const at = player.head();
          if (at === null || player.stem() !== s.stem) return toast('play this shot first');
          setRange(at, Math.max(at + 0.2, s.end));
        } }, '⇤ in'),
      el('button', { class: 'iconbtn', title: 'Out point = where the playhead is',
        onclick: () => {
          const at = player.head();
          if (at === null || player.stem() !== s.stem) return toast('play this shot first');
          setRange(Math.min(s.start, at - 0.2), at);
        } }, 'out ⇥'),
      el('button', { class: 'iconbtn', title: 'Why this shot is here',
        onclick: async () => {
          const note = prompt('What is this shot doing here?', s.note || '');
          if (note === null) return;
          mutateShots(cut, shots => { shots[i].note = note; });
        } }, s.note ? `note: ${s.note}` : 'note'),
      el('span', { class: 'spacer' }),
      el('button', { class: 'iconbtn', title: 'Move up', onclick: () => move(i - 1) }, '↑'),
      el('button', { class: 'iconbtn', title: 'Move down', onclick: () => move(i + 1) }, '↓'),
      el('button', { class: 'iconbtn', title: 'Take it out',
        onclick: () => mutateShots(cut, shots => { shots.splice(i, 1); }) }, '×')),
  );

  row.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', String(i));
    e.dataTransfer.effectAllowed = 'move';
    row.classList.add('dragging');
  });
  row.addEventListener('dragend', () => row.classList.remove('dragging'));
  row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('over'); });
  row.addEventListener('dragleave', () => row.classList.remove('over'));
  row.addEventListener('drop', e => {
    e.preventDefault(); row.classList.remove('over');
    const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (Number.isNaN(from) || from === i) return;
    mutateShots(cut, shots => { shots.splice(i, 0, shots.splice(from, 1)[0]); });
  });
  return row;
}

async function viewTexts() {
  if (!state.texts) state.texts = await api('/api/texts');
  const [field, heading] = TEXT_MODES.find(([key]) => key === state.textMode);
  const rows = state.texts.filter(item => item[field] && item[field].trim());
  const subnav = el('div', { class: 'subnav', role: 'tablist', 'aria-label': 'Text type' },
    ...TEXT_MODES.map(([key, label]) => el('button', {
      role: 'tab', 'aria-selected': String(key === field),
      onclick: () => { state.textMode = key; renderView(); },
    }, label)));

  return el('div', {}, subnav,
    el('div', { class: 'text-head' },
      el('h2', {}, heading),
      el('span', { class: 'stats' }, `${rows.length} segments`)),
    rows.length ? el('div', {}, ...rows.map(item => el('article', { class: 'text-entry' },
      el('h3', { style: 'cursor:pointer', onclick: () => openSegment(item.id) },
        item.title || '(untitled)'),
      el('div', { class: 'meta' }, `${item.stem} · ${hms(item.start)}–${hms(item.end)}`),
      el('p', {}, item[field]),
    ))) : el('div', { class: 'empty' }, `No ${heading.toLowerCase()} yet.`));
}

// --- review ----------------------------------------------------------
//
// 192 segments is more than anyone will click through a dialog at a time. This
// is one moment on screen with the footage playing, and a keyboard: the whole
// archive can be sorted into keep and discard in one sitting, which is what
// has to happen before any of it becomes a reel.
//
// Ratings are applied optimistically. A verdict must land the instant the key
// is pressed, and re-rendering the list after each one would make the
// keyboard useless.

/* One handler for the life of the page. Binding per render would stack a
   listener on every visit to the tab. */
const review = { keys: null, states: null };
const cutKeys = { handle: null };
document.addEventListener('keydown', e => {
  if ($('#dlg').open) return;
  if (state.tab === 'Review' && review.keys) review.keys(e);
  else if (state.tab === 'Reels' && (state.openCut || state.openDraft) && cutKeys.handle) cutKeys.handle(e);
});

const clipCache = new Map();
/* The <video> is kept while the segment does not change, so a verdict does not
   restart the footage you were in the middle of watching. */
const reviewVideo = { id: null, el: null };
/* And so is the editor, for the same reason and a worse consequence: a
   verdict repaints the whole pass, and rebuilding the fields under you would
   take the sentence you were halfway through retyping with it. Moved into
   each new tree rather than made again. */
const reviewEdit = { id: null, node: null };
const reviewEditGuard = () =>
  !reviewEdit.node || !reviewEdit.node.dirty()
  || confirm('Throw away what you have typed here?');
const reviewEditClose = () => { reviewEdit.id = null; reviewEdit.node = null; };
async function clipOf(stem) {
  if (!clipCache.has(stem)) clipCache.set(stem, await api('/api/clip/' + encodeURIComponent(stem)));
  return clipCache.get(stem);
}

async function viewReview() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.segState) p.set('state', state.segState);
  if (state.rating) p.set('rating', state.rating);
  p.set('order', state.reviewOrder);
  for (const tag of state.tags) p.append('tag', tag);
  const rows = await api('/api/segments?' + p);
  if (!rows.length) return el('div', { class: 'empty' }, 'Nothing matches — widen the filters.');

  /* Start where the work is. Coming back to a half-done pass at segment 1 and
     pressing J forty times is the fastest way to stop doing the pass. */
  if (state.reviewAt === null) {
    const asked = state.reviewFrom ? rows.findIndex(r => r.id === state.reviewFrom) : -1;
    const next = rows.findIndex(r => r.rating === 'none' && r.status === 'indexed');
    state.reviewAt = asked >= 0 ? asked : next >= 0 ? next : 0;
  }
  state.reviewFrom = null;
  state.reviewAt = Math.max(0, Math.min(state.reviewAt, rows.length - 1));
  const host = el('div', {});
  await paintReview(host, rows);
  return host;
}

const judged = row => row.rating !== 'none' || row.status !== 'indexed';

async function paintReview(host, rows) {
  const row = rows[state.reviewAt];
  state.reviewSeg = row.id;
  syncUrl();
  const clip = await clipOf(row.stem);
  const seg = clip.segments.find(s => s.id === row.id) || {};

  const fresh = reviewVideo.id !== row.id;
  if (fresh) {
    reviewVideo.id = row.id;
    reviewVideo.el = clip.proxy ? el('video', {
      controls: '', playsinline: '', autoplay: '',
      src: '/media/' + encodeURIComponent(row.stem) + '.mp4',
    }) : null;
  }
  const video = reviewVideo.el;
  /* Set on every paint, not only on a new clip: the element is reused across
     segments of the same clip, and a rate that silently reverted between two
     moments of one interview would be the confusing kind of bug. */
  if (video) video.playbackRate = state.reviewRate;
  const transcript = el('div', { class: 'transcript' },
    ...(seg.lines || []).map(l => el('div', { 'data-at': String(l.start),
      onclick: () => { if (video) { video.currentTime = l.start; video.play().catch(() => {}); } } },
      el('span', { class: 'tc' }, hms(l.start) + '  '),
      el('span', {}, l.en || l.kok || ''))));

  if (video) {
    video.onhighlight = lines => {
      if (video.currentTime >= row.end - 0.04) { video.pause(); video.currentTime = row.start; }
      for (const line of lines)
        line.classList.toggle('on',
          video.currentTime >= parseFloat(line.dataset.at) - 0.15 &&
          video.currentTime < parseFloat(line.dataset.at) + 6);
    };
    if (fresh) {
      video.addEventListener('loadedmetadata',
        () => { video.currentTime = row.start; }, { once: true });
      video.addEventListener('timeupdate', () => video.onhighlight(video._lines || []));
    }
    video._lines = [...transcript.children];
  }

  const go = delta => {
    if (!reviewEditGuard()) return;
    const next = state.reviewAt + delta;
    if (next < 0 || next >= rows.length) return toast(next < 0 ? 'first' : 'that was the last one');
    state.reviewAt = next;
    paintReview(host, rows);
  };

  /* 91 minutes of footage is an evening at 1x and forty minutes at 2x, which
     is the difference between a pass that gets finished and one that does
     not. Kept across reloads, because the speed you can follow Konkani at is
     a fact about you, not about this sitting. */
  const setRate = rate => {
    state.reviewRate = rate;
    localStorage.setItem('reviewRate', String(rate));
    if (video) video.playbackRate = rate;
    paintReview(host, rows);
  };

  /* Optimistic: the row and the button update now, the sidecar catches up. */
  const set = async (field, value, then = 0) => {
    const was = judged(row);
    row[field] = seg[field] = value;
    if (state.overview && judged(row) !== was) {
      state.overview.judged += judged(row) ? 1 : -1;
      paintStats();
    }
    if (then) go(then); else paintReview(host, rows);
    try {
      await api('/api/segment/' + encodeURIComponent(row.id), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value }),
      });
      /* A verdict moves a moment between unseen, seen and rejected, and the
         State counts beside the pass should follow -- once the keys stop,
         not after every one of them. */
      clearTimeout(review.states);
      review.states = setTimeout(loadStates, 1500);
    } catch (e) { toast('could not save: ' + e.message); }
  };

  /* A verdict moves on by itself: two keystrokes a segment across 192 of them
     is 192 keystrokes that carry no decision. K goes back if you mis-hit. */
  const rate = (value, advance = false) => set(
    'rating', row.rating === value ? 'none' : value,
    advance && row.rating !== value && state.reviewAt < rows.length - 1 ? 1 : 0,
  );
  const left = rows.slice(state.reviewAt).filter(r => !judged(r))
    .reduce((t, r) => t + r.duration, 0);

  const verdict = (label, field, value, current) => el('button', {
    class: 'btn', 'aria-pressed': String(current === value),
    onclick: () => field === 'rating' ? rate(value) : set(field, value),
  }, label);

  /* Editing happens here rather than in a dialog over the top. The footage is
     the reason you are on this screen, and a modal put it behind a scrim at
     the moment you were deciding what somebody had actually said. */
  const toggleEdit = () => {
    if (state.reviewEditing && !reviewEditGuard()) return;
    state.reviewEditing = !state.reviewEditing;
    if (!state.reviewEditing) reviewEditClose();
    paintReview(host, rows);
  };

  if (state.reviewEditing && reviewEdit.id !== row.id) {
    reviewEditClose();
    try {
      reviewEdit.id = row.id;
      reviewEdit.node = await segmentEditor(row.id, null, {
        compact: true,
        close: toggleEdit,
        open: id => { reviewEditClose(); openSegment(id); },
        saved: async () => { await loadOverview(); paintReview(host, rows); },
        gone: async () => { state.reviewEditing = false; reviewEditClose(); renderView(); },
      });
    } catch (e) { toast(e.message); state.reviewEditing = false; reviewEditClose(); }
  }
  const editing = state.reviewEditing && reviewEdit.node;

  host.replaceChildren(el('div', {},
    el('div', { class: 'pass' },
      el('span', { style: `width:${(state.reviewAt + 1) / rows.length * 100}%` })),
    el('div', { class: 'review' },
      el('div', {}, video || el('div', { class: 'empty' }, 'No proxy for this clip.')),
      el('div', {},
        el('div', { class: 'meta' },
          `${state.reviewAt + 1} of ${rows.length} · ` +
          `${rows.filter(judged).length} judged · ` +
          /* Footage left, not moments left. "155 to go" says nothing about
             whether this is an evening or twenty minutes. */
          `${hms(left / state.reviewRate)} left at ${state.reviewRate}× · ` +
          `${row.stem} · ${hms(row.start)}–${hms(row.end)}`),
        editing ? null : el('h2', {}, row.title || '(untitled)'),
        editing ? null : el('div', { class: 'summary' }, row.summary || ''),
        editing ? null : el('div', { class: 'tags' },
          ...(row.tags || '').split(' ').filter(Boolean).map(x => el('span', { class: 'tag' }, x)),
          ...(row.reels || '').split(',').filter(Boolean)
            .map(slug => el('span', { class: 'pill fav' }, 'in ' + slug))),
        el('div', { class: 'verdict' },
          verdict('★ Keep', 'rating', 'favorite', row.rating),
          verdict('✕ Reject', 'rating', 'rejected', row.rating),
          verdict('Seen', 'status', 'reviewed', row.status),
          el('span', { class: 'spacer' }),
          el('button', { class: 'btn', onclick: () => go(-1) }, '←'),
          el('button', { class: 'btn', onclick: () => go(1) }, '→'),
          el('button', { class: 'btn', 'aria-pressed': String(!!editing),
            onclick: toggleEdit }, editing ? 'Done editing' : 'Edit'),
          el('select', { style: 'width:auto', title: 'Which end to start from',
            onchange: e => {
              state.reviewOrder = e.target.value;
              localStorage.setItem('reviewOrder', e.target.value);
              state.reviewAt = null; renderView();
            } },
            ...REVIEW_ORDERS.map(([v, label]) =>
              el('option', { value: v, selected: state.reviewOrder === v || null }, label))),
          el('button', { class: 'btn', title: 'Playback speed — , and . change it',
            onclick: () => setRate(RATES[(RATES.indexOf(state.reviewRate) + 1) % RATES.length]) },
            state.reviewRate + '×')),
        editing || transcript,
        el('div', { class: 'keys' },
          el('div', {},
            el('kbd', {}, 'J'), '/', el('kbd', {}, '→'), ' next   ',
            el('kbd', {}, 'K'), '/', el('kbd', {}, '←'), ' back   ',
            el('kbd', {}, 'F'), ' keep   ',
            el('kbd', {}, 'X'), ' reject   ',
            el('kbd', {}, 'S'), ' seen   ',
            el('kbd', {}, 'Space'), ' play/pause   ',
            el('kbd', {}, ','), el('kbd', {}, '.'), ' slower/faster   ',
            el('kbd', {}, 'E'), ' edit here   ',
            el('kbd', {}, 'Esc'), ' back to the pass'))))));

  review.keys = e => {
    /* Before the check below, not after: Escape is the way out of the editor
       and you press it from inside the box you have been typing in. */
    if (e.key === 'Escape' && state.reviewEditing) {
      toggleEdit();
      e.preventDefault();
      return;
    }
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    const key = e.key.toLowerCase();
    if (e.key === '.' || e.key === ',') {
      const at = RATES.indexOf(state.reviewRate);
      setRate(RATES[Math.max(0, Math.min(RATES.length - 1, at + (e.key === '.' ? 1 : -1)))]);
    }
    else if (key === 'j' || e.key === 'ArrowRight') go(1);
    else if (key === 'k' || e.key === 'ArrowLeft') go(-1);
    else if (key === 'f') rate('favorite', true);
    else if (key === 'x') rate('rejected', true);
    else if (key === 's') set('status', seg.status === 'reviewed' ? 'indexed' : 'reviewed');
    else if (key === 'e') toggleEdit();
    else if (e.key === ' ' && video) { video.paused ? video.play() : video.pause(); }
    else return;
    e.preventDefault();
  };
}

// --- the moment editor -----------------------------------------------

/* One editor, mounted in two places: as the right-hand pane of Segments,
   where most of the fixing happens, and still as a dialog everywhere else --
   leaving a review pass or a cut to go and look at a moment is a detour, and
   a detour should hand you back where you were.

   `opts` is how it is told which: `close` dismisses it, `open` follows a
   related moment, `saved` and `gone` are what to do once the sidecar has
   changed under everybody. `compact` is for Review, which is already a big
   player with the times above it -- a second copy of both, of the same clip,
   is not a detail view, it is two of the same thing on one screen.

   The returned node carries `dirty()`, because whatever is holding it has to
   ask before throwing it away. */
async function segmentEditor(id, at, opts) {
  const stem = id.split('#')[0];
  const clip = await api('/api/clip/' + encodeURIComponent(stem));
  const seg = clip.segments.find(s => s.id === id);
  if (!seg) throw new Error('segment not found');
  let related = [], using = [];
  try { related = await api('/api/related/' + encodeURIComponent(id)); } catch {}
  try { using = await api('/api/using/' + encodeURIComponent(id)); } catch {}

  const f = { rows: null, rating: seg.rating || 'none' };
  let written = false;
  let shortlistBtn = null;
  const paintShortlistBtn = () => {
    if (!shortlistBtn) return;
    const on = shortlisted(id);
    shortlistBtn.textContent = on ? '✓ Shortlisted' : '+ Shortlist';
    shortlistBtn.setAttribute('aria-pressed', String(on));
  };

  /* How many plans this moment is already in, said on the button rather than
     only inside the menu: the question "have I already put this somewhere" is
     asked before the menu is opened, not after. */
  let planBtn = null;
  const paintPlanBtn = () => { if (planBtn) paintPlanCount(planBtn); };

  /* Only the fields that were actually retyped. As a dialog this was open for
     as long as it took to fix one moment; as a pane it sits there for the
     evening, while a review pass lands verdicts on the same sidecar and
     `align` walks sixty of them -- and a save that stamped every field would
     put this copy of them, an hour old, back over the top.

     It is also what tells you whether there is anything to lose: Escape
     closes a <dialog>, and an evening of fixing Konkani is exactly the
     session where you hit it by reflex over a paragraph you just typed. */
  const changes = () => {
    const patch = {};
    for (const key of ['title', 'summary', 'konkani', 'english'])
      if (f[key].value !== (seg[key] || '')) patch[key] = f[key].value;
    const tags = f.tags.value.split(/\s+/).filter(Boolean);
    if (tags.join(' ') !== [...(seg.tags || []), ...(seg.proposed_tags || [])].join(' '))
      patch.tags = tags;
    if (f.rating !== (seg.rating || 'none')) patch.rating = f.rating;
    if (f.status.value !== seg.status) patch.status = f.status.value;
    if (f.rows) {
      /* Every field the line has, not the ones this editor shows: rebuilding
         it from en and kok alone silently dropped the speaker, so correcting
         a typo un-attributed the line. The underscore keys are where the
         cursor was and are ours. */
      const lines = f.rows
        .filter(r => (r.en || r.kok || '').trim())
        .map(r => Object.fromEntries(
          Object.entries(r).filter(([k]) => !k.startsWith('_'))));
      if (JSON.stringify(lines) !== JSON.stringify(seg.lines)) patch.lines = lines;
    }
    return patch;
  };

  const field = (key, label, tag = 'input') => {
    const n = el(tag, { value: tag === 'input' ? (seg[key] || '') : null });
    if (tag === 'textarea') n.value = seg[key] || '';
    f[key] = n;
    return el('div', {}, el('label', {}, label), n);
  };

  /* Three buttons rather than a dropdown: a rating is the one field here you
     set without reading it first, and a dropdown costs two clicks to say the
     thing you already knew when you clicked the row. */
  const ratings = el('div', { class: 'verdict' });
  const paintRating = () => ratings.replaceChildren(
    el('label', { style: 'margin:0' }, 'Rating'),
    ...[['favorite', '★ Keep'], ['rejected', '✕ Reject'], ['none', '— Undecided']]
      .map(([v, label]) => el('button', {
        class: 'btn', 'aria-pressed': String(f.rating === v),
        onclick: () => { f.rating = v; paintRating(); },
      }, label)));
  paintRating();

  const lines = seg.lines && seg.lines.length ? (() => {
    /* A working copy, because a line can be split and removed and not only
       retyped. One utterance per caption is the rule the whole caption path
       assumes, and the model does not always hear the join: "Kide yeh"
       answered by "Hya ek don aashat" arrived as one line in one voice. */
    f.rows = seg.lines.map(l => ({ ...l }));
    const box = el('div', { class: 'lines' });
    const label = el('label', {});

    const caret = (row, key) => e => { row['_' + key] = e.target.selectionStart; };

    const splitLine = i => {
      const row = f.rows[i];
      /* Split each language where the cursor was left in it, so the Konkani
         can break at a different word than the English -- they are not the
         same sentence and rarely divide at the same place. */
      const enAt = Math.min(row._en ?? Math.floor((row.en || '').length / 2),
                            (row.en || '').length);
      const kokAt = Math.min(row._kok ?? Math.round((row.kok || '').length
                               * (enAt / Math.max(1, (row.en || '').length))),
                             (row.kok || '').length);
      /* The timing is a guess proportional to the text, which is what the
         line's own timings already are; `greels align` measures them. */
      const span = Math.max(0.2, row.end - row.start);
      const guess = row.start + span * (enAt / Math.max(1, (row.en || '').length));
      const mid = Math.min(row.end - 0.1, Math.max(row.start + 0.1, guess));

      f.rows.splice(i, 1,
        { ...row, en: (row.en || '').slice(0, enAt).trim(),
          kok: (row.kok || '').slice(0, kokAt).trim(), end: mid },
        { ...row, en: (row.en || '').slice(enAt).trim(),
          kok: (row.kok || '').slice(kokAt).trim(), start: mid });
      paint();
    };

    const paint = () => {
      box.replaceChildren(...f.rows.map((row, i) => {
        /* Which line the cut was complaining about. 26 characters a second is
           the same slack figure `reel show` uses; shortening this box is the
           fix it asks for. */
        const rate = row.end > row.start
          ? (row.en || '').length / (row.end - row.start) : 0;
        return el('div', { class: 'lineedit' },
          el('span', { class: 'tc' + (rate > 26 ? ' bad' : '') },
            rate > 26 ? `${hms(row.start)} !` : `${hms(row.start)} `),
          el('input', { type: 'text', value: row.en || '',
            title: rate > 26
              ? `${rate.toFixed(0)} characters a second — too fast to read`
              : `${rate.toFixed(0)} characters a second`,
            oninput: e => { row.en = e.target.value; },
            onkeyup: caret(row, 'en'), onclick: caret(row, 'en'),
            onselect: caret(row, 'en') }),
          el('input', { type: 'text', class: 'kok', value: row.kok || '',
            oninput: e => { row.kok = e.target.value; },
            onkeyup: caret(row, 'kok'), onclick: caret(row, 'kok'),
            onselect: caret(row, 'kok') }),
          /* Who says it, which is what colours the caption in the styled
             titles. "—" is nobody decided, and draws in the default white
             rather than being guessed at. */
          el('select', { class: 'who', title: 'Who says this line',
            style: 'width:auto', onchange: e => { row.speaker = e.target.value; } },
            el('option', { value: '' }, '—'),
            ...(state.overview.speakers || []).map(name =>
              el('option', { value: name,
                selected: row.speaker === name || null }, name))),
          el('button', { class: 'iconbtn', title: 'Split here — two people '
            + 'in one line, or one caption too long to read. Splits each '
            + 'language at its own cursor.',
            onclick: () => splitLine(i) }, '⁄'),
          el('button', { class: 'iconbtn', title: 'Remove this line',
            onclick: () => { f.rows.splice(i, 1); paint(); } }, '×'));
      }));
      /* The rest of it -- that the timings are estimates and `greels align`
         measures them -- is a tooltip: it is true once and read once, and it
         was taking two lines of the pane every time. */
      label.textContent = `Subtitle lines (${f.rows.length}) — what the captions are made of`;
      label.title = 'Timings are estimated; `greels align` measures them';
    };

    paint();
    return el('div', {}, label, box);
  })() : null;

  /* Folded away, not dropped. The prose is what search reads and it still has
     to be fixable, but a corrected line already rewrites it: only prose the
     model wrote differently from its own lines has to be typed here, which is
     a handful of segments and not a reason for four boxes to sit between the
     title and the captions. */
  const prose = el('details', {},
    el('summary', {}, 'Summary, prose and whether it was seen'),
    field('summary', 'Summary', 'textarea'),
    el('div', { class: 'grid2' },
      field('konkani', `${spokenName()} (verbatim)`, 'textarea'),
      field('english', 'English translation', 'textarea')),
    /* Only whether it has been looked at. Planned, used and published are
       worked out from the plans and the cuts now, and a hand-set copy of them
       would be a second answer to the same question. An old sidecar that says
       one of them keeps it until it is changed here. */
    el('div', {}, el('label', {}, 'Seen'),
      f.status = el('select', {}, ...[...new Set(['indexed', 'reviewed', seg.status])]
        .map(v => el('option', { value: v, selected: seg.status === v || null },
          { indexed: 'not yet', reviewed: 'reviewed' }[v] || v)))));

  const save = async () => {
    const patch = changes();
    if (!Object.keys(patch).length) return toast('nothing changed');
    try {
      const saved = await api('/api/segment/' + encodeURIComponent(id), sendJSON('PATCH', patch));
      rememberSegment(id, saved.undo,
        `${Object.keys(patch).join(', ')} of “${saved.title || id}”`);
      clipCache.delete(stem);
      written = true;              // nothing left here worth warning about
      if ('title' in patch) {
        renameInShortlist(id, patch.title);
        renameInPlans(id, patch.title);
      }
      toast(`saved ${Object.keys(patch).join(', ')}`);
      await opts.saved();
    } catch (e) { toast('save failed: ' + e.message); }
  };

  const node = el('div', { class: 'segedit' },
    el('div', { class: 'segedit-head' },
      opts.compact ? null : segBadge(id, { word: true }),
      opts.compact ? null
        : el('div', { class: 'stats', title: id }, `${stem} · ${hms(seg.start)}–${hms(seg.end)}`),
      using.length ? el('div', { class: 'stats' },
        'already in ' + using.map(c => c.title).join(', ')) : null,
      /* A moment is a window onto a clip, and what came just before it is
         often why it is funny. A link, so ⌘-click keeps this moment open
         here; a plain click opens the clip on Clips at this moment, and Back
         comes back to it. Not in Review, which is already playing the clip. */
      opts.compact ? null : el('a', { class: 'btn', href: '/clips?clip=' + encodeURIComponent(stem),
        title: `Watch all of ${stem} (${hms(clip.asset.duration)}) and read along`,
        onclick: async e => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
          e.preventDefault();
          /* In the Segments pane what is typed survives the trip, because
             the pane is kept for the life of the page. In a dialog the clip
             takes the dialog's place, and what is typed goes with it. */
          if (state.tab !== 'Segments' && node.dirty()
              && !confirm('Throw away what you have typed here?')) return;
          // Named before the render, so the tab and the clip are one entry in
          // history and one Back undoes them, not two.
          state.tab = 'Clips';
          state.openClip = stem;
          await render();
          openClip(stem, id);
        } }, 'Whole clip ↗'),
      /* Not in Review, which is a pass and has just had its own row of
         buttons thinned out. */
      opts.compact ? null : (shortlistBtn = el('button', {
        class: 'btn spacer', title: 'A note to self, kept in this browser — '
          + 'not a cut, and not backed up',
        'data-shortlist': id,
        onclick: () => toggleShortlist({ id, title: f.title.value || seg.title || '' }) })),
      /* The shortlist is one strip and this is the named ones. Toggling an
         entry saves and repaints only this button: a `renderView` here would
         detach the pane and stop the clip playing beside it. */
      opts.compact ? null : (planBtn = el('button', {
        class: 'btn', 'aria-haspopup': 'menu', 'data-plan-count': id,
        title: 'A plan is kept in this browser too — a running order you have '
          + 'not committed to yet',
        onclick: e => planMenu(e.currentTarget, id,
          () => ({ id, title: f.title.value || seg.title || '' }), paintPlanBtn) })),
      el('button', { class: 'iconbtn' + (opts.compact ? ' spacer' : ''), title: 'Close',
        onclick: () => { if (node.dirty() && !confirm(
          'Throw away what you have typed here?')) return; opts.close(); } }, '×')),
    el('div', { class: 'segedit-body' },
      clip.proxy && !opts.compact
        ? rangePreview(stem, seg.start, seg.end, seg.lines, at) : null,
      field('title', 'Title'),
      opts.compact ? null : planUsage(id, { removable: true }),
      el('div', {}, el('label', {}, 'Tags (space separated)'),
        f.tags = el('input', { type: 'text',
          value: [...(seg.tags || []), ...(seg.proposed_tags || [])].join(' ') })),
      ratings,
      lines,
      prose,
      related.length ? el('div', {},
        el('label', {}, 'Related moments elsewhere'),
        ...related.map(r => el('div', { class: 'row', onclick: () => opts.open(r.id) },
          thumb(r.id),
          el('div', { class: 't' }, r.title),
          el('div', { class: 'm' }, r.score.toFixed(2)),
          el('div', { class: 's' }, `${r.stem} ${hms(r.start)} · via ${r.via.join(', ')}`)))) : null),
    el('div', { class: 'segedit-foot' },
      el('button', { class: 'btn primary', onclick: save }, 'Save'),
      el('button', { class: 'btn danger spacer', onclick: async () => {
        if (!confirm('Delete this segment from the sidecar? The video is untouched, '
          + 'and a copy of the sidecar goes to index/.trash — `greels trash list` '
          + 'gets it back.')) return;
        const plansBefore = plansUsing(id).map(p => [p.id, planSnapshot(p, ['moments'])]);
        const shortlistAt = state.shortlist.findIndex(s => s.id === id);
        const shortlistEntry = state.shortlist[shortlistAt];
        try { const gone = await api('/api/segment/' + encodeURIComponent(id), { method: 'DELETE' });
          clipCache.delete(stem);
          written = true;
          dropFromShortlist(id);   // it cannot be in a plan if it is gone
          dropFromPlans(id);
          rememberSegmentDeleted(gone.segment, plansBefore, shortlistAt, shortlistEntry);
          toast('deleted'); await opts.gone(); }
        catch (e) { toast('delete failed: ' + e.message); }
      } }, 'Delete segment')));

  paintShortlistBtn();
  paintPlanBtn();
  node.dirty = () => !written && Object.keys(changes()).length > 0;
  return node;
}

/* From anywhere that is not Segments, where the pane does not exist. */
async function openSegment(id, at = null) {
  const dlg = $('#dlg');
  let node;
  try { node = await segmentEditor(id, at, {
    close: () => { dlg.oncancel = null; dlg.close(); },
    open: async nextId => { dlg.oncancel = null; dlg.close(); await openSegment(nextId); },
    saved: async () => { dlg.oncancel = null; dlg.close(); await boot(); },
    gone: async () => { dlg.oncancel = null; dlg.close(); await boot(); },
  }); } catch (e) { return toast(e.message); }
  dlg.oncancel = e => {
    if (!node.dirty()) return;
    e.preventDefault();
    if (confirm('Throw away what you have typed here?')) { dlg.oncancel = null; dlg.close(); }
  };
  dlg.replaceChildren(node);
  dlg.showModal();
}

/* A shot cut to one sentence, snapped to where that sentence begins and ends.
   The alternative is adding the whole moment and trimming it four times.

   This is the transcript picker's, not Segments' -- picking a run out of a
   twenty-minute interview and calling it a shot is the whole point of reading
   one, and there is nowhere else to say so. */
async function lineIntoCut(row) {
  const cuts = await api('/api/cuts');
  const names = cuts.map((c, i) => `${i + 1}. ${c.title}`).join('\n');
  const answer = prompt(
    `Add “${(row.en || row.kok || '').slice(0, 60)}” to which cut?\n\n${names}`
    + `\n\nA number, or a name for a new cut.`, cuts.length ? '1' : '');
  if (!answer) return;
  const pick = cuts[parseInt(answer, 10) - 1];
  try {
    let slug = pick && pick.slug;
    if (!slug) slug = (await api('/api/cuts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: answer }) })).slug;
    const cut = await api('/api/cut/' + encodeURIComponent(slug) + '/line', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        stem: row.stem, segment_id: row.segment_id,
        start: row.start, end: row.end, en: row.en, kok: row.kok }) });
    state.cuts = [];
    toast(`added to ${cut.slug} — ${cut.shots.length} shots, ${hms(cut.duration)}`);
  } catch (e) { toast('could not add: ' + e.message); }
}

/* Watch a clip and read along. The two life-story interviews are twenty
   minutes each, and finding the good bits of one meant scrubbing it in Final
   Cut with no idea what was being said where.

   `from` is a moment of it, when the Segments pane sent you here to see what
   was around one: the player is left on its first frame and its transcript
   scrolled to, rather than making you find your place again in twenty
   minutes of someone else's. */
async function openClip(stem, from = null) {
  state.openClip = stem;
  syncUrl();
  let clip;
  try { clip = await api('/api/clip/' + encodeURIComponent(stem)); }
  catch (e) {
    // A link to a clip that has been renamed since, most likely.
    if (state.openClip === stem) { state.openClip = null; syncUrl(); }
    return toast(e.message);
  }
  if (state.openClip !== stem) return;   // Back was pressed while it loaded
  const dlg = $('#dlg');
  /* However it closes -- its button, Escape, or a moment in it opening in
     the dialog's place -- the address stops naming it. */
  dlg.addEventListener('close', () => {
    if (state.openClip === stem) { state.openClip = null; syncUrl(); }
  }, { once: true });
  dlg.oncancel = null;   // nothing here is typed into
  const video = clip.proxy ? el('video', { controls: '', playsinline: '', preload: 'metadata',
    src: '/media/' + encodeURIComponent(stem) + '.mp4' }) : null;
  const seek = at => {
    if (!video) return;
    video.currentTime = at;
    video.play().catch(() => {});
  };

  /* The two life-story interviews are twenty minutes each and their moments
     run to 113 seconds, which is a paragraph rather than a shot. So the
     transcript is selectable: click a line, shift-click a later one, and the
     run between them becomes a shot. That is how a shot gets made out of an
     interview -- by reading it, not by scrubbing it. */
  const spoken = clip.segments
    .flatMap(s => (s.lines || []).map(l => ({ ...l, line: l, segment_id: s.id })))
    .sort((a, b) => a.start - b.start);
  /* Which row of the transcript is which utterance, by identity rather than
     by matching on times: two lines of one moment can share a start, and a
     lookup would then give both of them the first one's index. */
  const order = new Map(spoken.map((entry, i) => [entry.line, i]));
  const picked = { from: null, to: null };
  const chosen = () => picked.from === null ? []
    : spoken.slice(Math.min(picked.from, picked.to), Math.max(picked.from, picked.to) + 1);
  const bar = el('div', { class: 'pickbar' });

  const repaint = () => {
    const lo = picked.from === null ? -1 : Math.min(picked.from, picked.to);
    const hi = picked.from === null ? -2 : Math.max(picked.from, picked.to);
    for (const node of dlg.querySelectorAll('.transcript div[data-i]')) {
      const i = parseInt(node.dataset.i, 10);
      node.classList.toggle('picked', i >= lo && i <= hi);
    }
    const run = chosen();
    if (!run.length) { bar.replaceChildren(); bar.classList.remove('on'); return; }
    const from = run[0], to = run[run.length - 1];
    bar.classList.add('on');
    bar.replaceChildren(
      el('span', { class: 'stats' },
        `${run.length} line(s) · ${hms(from.start)}–${hms(to.end)} · `
        + `${(to.end - from.start).toFixed(1)}s`),
      el('button', { class: 'btn', onclick: () => seek(from.start) }, '▶ Play it'),
      el('button', { class: 'btn primary', onclick: async () => {
        await lineIntoCut({
          stem, segment_id: from.segment_id, start: from.start, end: to.end,
          en: run.map(l => l.en).filter(Boolean).join(' ').slice(0, 120),
          kok: run.map(l => l.kok).filter(Boolean).join(' ').slice(0, 120),
        });
      } }, run.length === 1 ? 'Add this line to a cut' : `Add these ${run.length} lines as a shot`),
      el('button', { class: 'btn', onclick: () => {
        picked.from = picked.to = null; repaint();
      } }, 'Clear'));
  };

  const pick = (i, event) => {
    if (event.shiftKey && picked.from !== null) picked.to = i;
    else { picked.from = picked.to = i; seek(spoken[i].start); }
    repaint();
  };

  const moments = clip.segments.map(s => el('div', { class: 'moment', 'data-seg': s.id },
    el('div', { class: 'row', style: 'margin:0', onclick: () => seek(s.start) },
      thumb(s.id),
      el('div', { class: 't' }, s.title),
      el('div', { class: 'm' }, `${hms(s.start)}–${hms(s.end)}`),
      el('div', { class: 's' }, s.summary || ''),
      el('div', { class: 'tags' }, ...(s.tags || []).map(x => el('span', { class: 'tag' }, x)),
        ...(s.proposed_tags || []).map(x => el('span', { class: 'tag proposed' }, x)),
        el('span', { class: 'pill', onclick: e => { e.stopPropagation(); dlg.close(); openSegment(s.id); } },
          'open')),
    ),
    (s.lines || []).length
      ? el('div', { class: 'transcript' }, ...s.lines.map(l => {
          const i = order.get(l);
          return el('div', {
            'data-at': String(l.start), 'data-i': String(i),
            title: 'Click to play from here; shift-click another line to take the run between them',
            onclick: e => pick(parseInt(e.currentTarget.dataset.i, 10), e),
          }, el('span', { class: 'tc' }, `${hms(l.start)}  `),
             el('span', {}, l.en || l.kok || ''));
        }))
      : null,
  ));

  if (video) {
    const all = () => [...dlg.querySelectorAll('.transcript div')];
    video.addEventListener('timeupdate', () => {
      const at = video.currentTime;
      let current = null;
      for (const line of all())
        if (parseFloat(line.dataset.at) <= at) current = line;
      for (const line of all()) line.classList.toggle('on', line === current);
    });
  }

  dlg.replaceChildren(
    el('div', { class: 'dlg-head' },
      el('h4', { style: 'margin:0' }, stem),
      el('div', { class: 'stats' },
        `${clip.asset.file} · ${hms(clip.asset.duration)} · ${clip.asset.width}×${clip.asset.height}` +
        (clip.asset.original_name ? ` · camera name ${clip.asset.original_name}` : '')),
      video ? el('div', { class: 'clipplayer' }, video) : null,
      bar),
    el('div', { class: 'dlg-body' },
      clip.analysis.errors.length
        ? el('p', { class: 'stats' }, 'Partial analysis: ' + clip.analysis.errors.join('; ')) : null,
      ...moments),
    el('div', { class: 'dlg-foot' }, el('button', { class: 'btn', onclick: () => dlg.close() }, 'Close')),
  );
  // Already open when Forward goes from one clip straight to another.
  if (!dlg.open) dlg.showModal();
  const here = from && clip.segments.find(s => s.id === from);
  if (here) {
    const row = dlg.querySelector(`.moment[data-seg="${CSS.escape(from)}"] .row`);
    if (row) { row.classList.add('on'); row.scrollIntoView({ block: 'start' }); }
    /* Before its metadata has loaded a video has no duration to seek in, and
       some browsers drop the position rather than keep it. */
    if (video) {
      if (video.readyState >= 1) video.currentTime = here.start;
      else video.addEventListener('loadedmetadata', () => { video.currentTime = here.start; }, { once: true });
    }
  }
}

// Drafts are kept in memory while editing, and saved with an optimistic
// revision. Reordering must not discard a note somebody is still typing.
const draftSessions = new Map();
const draftIntake = { brief: '', selected: new Map() };
const draftJSON = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body) });
const excerptData = e => ({ stem: e.stem, fingerprint: e.fingerprint || '',
  segment_id: e.segment_id || '', start: e.start, end: e.end });
const beatData = b => ({ ...excerptData(b), id: b.id, role: b.role || '', note: b.note || '',
  alternatives: (b.alternatives || []).map(excerptData) });
window.addEventListener('beforeunload', e => {
  if ([...draftSessions.values()].some(s => s.dirty)) { e.preventDefault(); e.returnValue = ''; }
});

async function pickDraftMoment(choose) {
  const dlg = $('#dlg');
  const results = el('div', {});
  let queryToken = 0;
  const input = el('input', { placeholder: 'Find a moment by words or topic',
    'aria-label': 'Find source moments', oninput: () => search() });
  const search = async () => {
    const mine = ++queryToken;
    try {
      const rows = await api('/api/segments?q=' + encodeURIComponent(input.value));
      if (mine !== queryToken) return;
      results.replaceChildren(...rows.filter(s => s.rating !== 'rejected').map(s =>
        el('div', { class: 'reel' }, el('b', {}, s.title),
          el('div', { class: 'meta' }, `${s.stem} · ${hms(s.start)}–${hms(s.end)}`),
          el('p', {}, s.summary || ''),
          el('button', { class: 'btn', onclick: async () => {
            try {
              const sourceClip = await api('/api/clip/' + encodeURIComponent(s.stem));
              const full = sourceClip.segments.find(m => m.id === s.id);
              if (!full?.lines?.length) throw new Error('This moment has no timestamped dialogue.');
              await choose({ ...s, ...full, sourceClip }); dlg.close();
            } catch (e) { results.prepend(el('p', { class: 'warn' }, e.message)); }
          } }, 'Choose moment'))));
    } catch (e) { results.textContent = e.message; }
  };
  dlg.oncancel = null;
  dlg.replaceChildren(el('div', { class: 'dlg-head' }, el('h2', {}, 'Source moments'), input),
    el('div', { class: 'dlg-body' }, results),
    el('div', { class: 'dlg-foot' }, el('button', { class: 'btn', onclick: () => dlg.close() }, 'Close')));
  dlg.showModal(); search();
}

async function viewDrafts() {
  const drafts = await api('/api/drafts');
  const brief = el('textarea', { placeholder: 'Optional: an angle, a feeling, or a story to explore…',
    maxlength: '3000', 'aria-label': 'Creative brief',
    oninput: e => { draftIntake.brief = e.target.value; } });
  brief.value = draftIntake.brief;
  const chosen = el('div', { class: 'bar' });
  const paintChosen = () => chosen.replaceChildren(...[...draftIntake.selected].map(([id, title]) =>
    el('button', { class: 'btn', onclick: () => { draftIntake.selected.delete(id); paintChosen(); } },
      title + ' ×')));
  paintChosen();
  const status = el('div', { class: 'keys', role: 'status', 'aria-live': 'polite' });
  let running = false;
  const start = async request => {
    generate.disabled = true;
    try {
      await api('/api/drafts/generate', draftJSON('POST', request));
      running = true; poll();
    } catch (e) { status.textContent = e.message; generate.disabled = false; }
  };
  const generate = el('button', { class: 'btn primary', onclick: () => start({
    brief: draftIntake.brief, selected: [...draftIntake.selected.keys()],
  }) }, 'Generate drafts');
  const poll = async () => {
    if (!status.isConnected) return;
    try {
      const job = await api('/api/drafts/generation');
      if (!status.isConnected) return;
      generate.disabled = job?.state === 'running';
      status.replaceChildren(job ? el('div', {}, job.message) :
        el('div', {}, 'Find up to three stories. Leave the selection empty to explore the library.'));
      if (job?.state === 'failed') status.append(el('p', {}, job.error),
        el('button', { class: 'btn', onclick: () => start(job.request) }, 'Retry generation'));
      if (job?.state === 'running') { running = true; setTimeout(poll, 1500); }
      else if (running && job?.state === 'done') { running = false; renderView(); }
    } catch (e) { status.textContent = e.message; generate.disabled = false; }
  };
  setTimeout(poll, 0);
  return el('div', {}, el('h2', {}, 'Draft scripts'),
    el('p', { class: 'stats' }, 'Start with what they actually said. Find the story, keep the context, make it yours.'),
    brief, chosen, el('div', { class: 'bar' }, generate,
      el('button', { class: 'btn', onclick: () => pickDraftMoment(s => {
        draftIntake.selected.set(s.id, s.title); paintChosen();
      }) }, 'Choose source moments'),
      el('button', { class: 'btn', onclick: async () => {
        try {
          const d = await api('/api/drafts', draftJSON('POST', { title: 'Untitled draft' }));
          state.openDraft = d.id; renderView();
        } catch (e) { toast(e.message); }
      } }, 'Blank draft')), status,
    ...drafts.map(d => el('div', { class: 'reel' }, el('h3', {}, d.title),
      el('p', {}, d.angle), el('div', { class: 'meta' },
        `${d.beats} beats · ${hms(d.duration)}` + (draftSessions.get(d.id)?.dirty ? ' · unsaved edits' : '')),
      el('button', { class: 'btn', onclick: () => { state.openDraft = d.id; renderView(); } }, 'Read and edit'))));
}

async function viewDraft(id) {
  if (!draftSessions.has(id)) draftSessions.set(id, { draft: await api('/api/draft/' + id), dirty: false });
  const session = draftSessions.get(id), d = session.draft;
  const status = el('span', { class: 'stats', role: 'status' }, session.dirty ? 'Unsaved edits' : 'Saved');
  const changed = () => { session.dirty = true; status.textContent = 'Unsaved edits'; };
  const redraw = () => { changed(); renderView(); };
  const message = el('div', { class: 'keys', role: 'status' });
  const save = async () => {
    if (!session.dirty) return;
    const payload = { revision: d.revision, title: d.title, angle: d.angle, brief: d.brief,
      notes: d.notes, beats: d.beats.map(beatData) };
    const updated = await api('/api/draft/' + id, draftJSON('PATCH', payload));
    // Lock the editor during save so an in-flight response cannot replace new typing.
    Object.assign(d, updated); session.draft = d; session.dirty = false; status.textContent = "Saved";
  };
  const root = el('div', { class: 'draft-editor' });
  const busy = async fn => {
    root.inert = true;
    try { await fn(); } catch (e) { message.textContent = e.message; }
    finally { root.inert = false; }
  };
  const field = (key, label, multiline = false) => {
    const input = el(multiline ? 'textarea' : 'input', { 'aria-label': label,
      oninput: e => { d[key] = e.target.value; changed(); } });
    input.value = d[key] || '';
    return el('div', {}, el('label', {}, label), input);
  };
  const now = el('div', { class: 'now' }), transcript = el('div', { class: 'transcript' });
  let contextBeat = null;
  const show = (shot, _, at) => {
    const b = shot.alternative ? shot : d.beats.find(x => x.id === shot.id);
    if (!b) return;
    now.textContent = `${b.role || 'Dialogue'} · ${hms(at ?? b.start)} · ${b.stem}`;
    const contextKey = `${b.id}:${b.stem}:${b.start}:${b.end}`;
    if (contextBeat !== contextKey) {
      contextBeat = contextKey;
      let anchor = null;
      transcript.replaceChildren(el('p', { class: 'stats' },
        'Surrounding dialogue · click to play; shift-click another line to keep that range.'),
        ...(b.context || b.lines || []).map((l, i, lines) => el('div', {
          class: l.end <= b.start || l.start >= b.end ? 'outside' : '', 'data-at': l.start,
          onclick: e => {
            if (e.shiftKey && anchor !== null) {
              const run = lines.slice(Math.min(anchor, i), Math.max(anchor, i) + 1);
              if (run.some(x => x.rejected)) return toast('That range includes a rejected moment.');
              b.start = run[0].start; b.end = Math.max(...run.map(x => x.end)); redraw(); return;
            }
            anchor = i;
            play([{ ...b, start: l.start, end: b.context_end ?? b.clip_duration ?? b.end }]);
          },
        }, el('span', { class: 'tc' }, `${hms(l.start)} · ${l.speaker || 'unknown'} · `),
          l.en || l.kok,
          l.kok ? el('div', { class: 'kok' }, l.kok) : null)));
    }
    for (const node of transcript.querySelectorAll('[data-at]'))
      node.classList.toggle('on', Math.abs(Number(node.dataset.at) - (spokenAt(b.context || b.lines, at)?.start ?? -10)) < .01);
  };
  const video = player.mount(show);
  player.retarget(d.beats);
  const play = (shots, from = 0) => {
    player.play(shots, from);
    video.scrollIntoView({ block: 'nearest' });
  };
  const setTrim = (b, start, end) => {
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end <= start ||
        end > (b.clip_duration ?? Infinity)) return toast('Choose a valid range within the source.');
    b.start = start; b.end = end; redraw();
  };
  cutKeys.handle = e => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select, button')) return;
    const playing = player.queue[player.at], b = d.beats.find(x => x.id === playing?.id);
    if (e.key === ' ') {
      if (!player.started()) play(d.beats);
      else if (video.paused) video.play().catch(() => {}); else video.pause();
    } else if (e.key === 'ArrowRight') player.next();
    else if (e.key === 'ArrowLeft') { player.at = Math.max(0, player.at - 1); player.load(true); }
    else if (b && e.key.toLowerCase() === 'i') setTrim(b, player.head(), b.end);
    else if (b && e.key.toLowerCase() === 'o') setTrim(b, b.start, player.head());
    else if (b && e.key === '[') setTrim(b, b.start + (e.shiftKey ? -.5 : .5), b.end);
    else if (b && e.key === ']') setTrim(b, b.start, b.end + (e.shiftKey ? .5 : -.5));
    else return;
    e.preventDefault();
  };
  const move = (from, to) => {
    if (to < 0 || to >= d.beats.length || from < 0 || from >= d.beats.length) return;
    d.beats.splice(to, 0, d.beats.splice(from, 1)[0]); redraw();
  };
  const rows = d.beats.map((b, i) => {
    const rows = (b.context || b.lines || b.snapshot || []).filter(l => l.end > b.start && l.start < b.end);
    const note = el('textarea', { 'aria-label': `Editorial note ${i + 1}`, placeholder: 'Your editing notes…',
      oninput: e => { b.note = e.target.value; changed(); } }); note.value = b.note || '';
    const row = el('div', { class: 'reel', draggable: 'true',
      ondragstart: e => { e.dataTransfer.setData('text/plain', String(i)); },
      ondragover: e => e.preventDefault(), ondrop: e => {
        e.preventDefault(); const from = Number(e.dataTransfer.getData('text/plain'));
        if (Number.isInteger(from)) move(from, i);
      },
    }, el('h3', {}, `${i + 1}. ${b.role || 'Dialogue'}`),
      el('div', { class: 'meta' }, `${b.stem} · ${hms(b.start)}–${hms(b.end)} · ${(b.end - b.start).toFixed(1)}s`),
      b.problem ? el('p', { class: 'warn' }, b.problem) : null,
      ...(b.warnings || []).map(w => el('p', { class: 'warn' }, w)),
      el('div', {}, ...rows.map(l => el('p', {},
        el('span', { class: 'tc' }, `${l.speaker || 'unknown'} · `), l.en || l.kok))),
      el('details', {}, el('summary', {}, spokenName()), ...rows.map(l => el('p', {}, l.kok || '—'))),
      el('div', { class: 'bar' },
        el('button', { class: 'btn', onclick: () => play(d.beats, i) }, 'Play excerpt'),
        el('button', { class: 'btn', onclick: () => play([{ ...b,
          start: b.context_start ?? Math.max(0, b.start - 10),
          end: b.context_end ?? Math.min(b.clip_duration ?? b.end, b.end + 10) }]) }, 'Watch context'),
        el('button', { class: 'btn', onclick: () => busy(async () => { await save(); draftSessions.delete(id); await openSegment(b.segment_id, b.start); }) }, 'Correct transcript'),
        el('button', { class: 'iconbtn', onclick: () => move(i, i - 1) }, '↑'),
        el('button', { class: 'iconbtn', onclick: () => move(i, i + 1) }, '↓'),
        el('button', { class: 'iconbtn', onclick: () => { d.beats.splice(i, 1); redraw(); } }, 'Remove')),
      el('div', { class: 'bar' }, ...['start', 'end'].map(key => el('label', {}, key === 'start' ? 'In ' : 'Out ',
        el('input', { type: 'number', step: '.1', min: '0', value: b[key],
          'aria-label': `${key} beat ${i + 1}`, onchange: e => setTrim(b,
            key === 'start' ? Number(e.target.value) : b.start,
            key === 'end' ? Number(e.target.value) : b.end) }))),
        ...['in', 'out'].map(key => el('button', { class: 'btn', onclick: () => {
          if (player.queue[player.at]?.id !== b.id) return toast('Play this excerpt first.');
          setTrim(b, key === 'in' ? player.head() : b.start, key === 'out' ? player.head() : b.end);
        } }, `Mark ${key}`))), note,
      ...(b.alternatives || []).map((a, j) => el('div', { class: 'keys' },
        el('div', {}, 'Alternative: ', (a.lines || a.snapshot || []).map(l => l.en || l.kok).join(' ')),
        a.problem ? el('p', { class: 'warn' }, a.problem) : null,
        el('button', { class: 'btn', onclick: () => play([{ ...a, id: b.id, alternative: true }]) }, 'Preview alternative'),
        el('button', { class: 'btn', onclick: () => {
          const alternatives = [...b.alternatives]; alternatives[j] = { ...b, alternatives: undefined };
          d.beats[i] = { ...a, id: b.id, role: b.role, note: b.note, alternatives }; redraw();
        } }, 'Use alternative'))));
    return row;
  });
  root.append(el('div', { class: 'bar' },
    el('button', { class: 'btn', onclick: () => { player.dispose(); state.openDraft = null; renderView(); } }, '← All drafts'),
    status,
    el('button', { class: 'btn primary', onclick: () => busy(async () => { await save(); renderView(); }) }, 'Save draft'),
    ...state.editors.map(ed => el('button', {
      class: 'btn' + (ed.name === state.editor ? ' primary' : ''),
      onclick: () => busy(async () => {
        await save();
        const result = await api('/api/draft/' + id + '/export', draftJSON('POST',
          { revision: session.draft.revision, editor: ed.name }));
        message.replaceChildren(el('p', {}, 'Timeline ready: ' + result.path),
          /* The menu path is the editor's own: "File → Import → XML" is
             wrong in Resolve, and reads as an instruction for a program you no
             longer have. */
          el('p', {}, `In ${result.editor_label}, choose ${result.import_menu}. `
            + 'Each export creates a new timeline.'),
          el('p', {}, result.captions_on_timeline
            ? 'The spoken lines are on the timeline as captions.'
            : `The spoken lines are the .srt beside it — ${result.captions_menu}.`),
          ...(result.warnings || []).map(w => el('p', {}, w)),
          el('button', { class: 'btn', onclick: () => {
            state.openDraft = null; state.openCut = result.cut; state.reelMode = 'cuts'; renderView();
          } }, 'Open saved cut snapshot'));
      }) }, 'Export to ' + (ed.name === 'fcp' ? 'Final Cut' : 'Resolve'))),
    el('button', { class: 'btn', onclick: () => busy(async () => {
      const fresh = await api('/api/draft/' + id);
      if (session.dirty && !confirm('Discard unsaved local edits and reload the saved draft?')) return;
      session.draft = fresh; session.dirty = false; renderView();
    }) }, 'Reload saved draft'),
    el('button', { class: 'btn danger', onclick: () => busy(async () => {
      if (!confirm('Delete this draft? Its saved version will be kept in the trash.')) return;
      await api('/api/draft/' + id, draftJSON('DELETE', { revision: d.revision }));
      draftSessions.delete(id); state.openDraft = null; renderView();
    }) }, 'Delete')), message,
    field('title', 'Title'), field('angle', 'Story angle', true), field('notes', 'Editorial notes', true),
    el('div', { class: 'player' }, video, el('div', {},
      el('button', { class: 'btn primary', onclick: () => play(d.beats) }, '▶ Play draft'),
      el('p', { class: 'keys' }, 'Space play/pause · ← → beat · I / O trim · [ / ] nudge'), now, transcript)),
    el('p', { class: 'stats' }, `${d.beats.length} beats · ${hms(d.beats.reduce((n, b) => n + b.end - b.start, 0))} · Drag beats to reorder.`),
    ...rows,
    el('button', { class: 'btn', onclick: () => pickDraftMoment(async s => {
      const clip = s.sourceClip;
      const context = clip.segments.flatMap(m => (m.lines || []).map(l => ({ ...l, segment_id: m.id,
        title: m.title, rejected: m.rating === 'rejected' })));
      d.beats.push({ id: crypto.randomUUID().replaceAll('-', ''), stem: s.stem,
        fingerprint: clip.asset.fingerprint || '', segment_id: s.id,
        start: s.lines[0].start, end: Math.max(...s.lines.map(l => l.end)),
        role: s.title, note: '', alternatives: [], lines: s.lines, context,
        clip_duration: clip.asset.duration, context_start: 0, context_end: clip.asset.duration });
      redraw();
    }) }, 'Add excerpt'));
  return root;
}

// --- undo ------------------------------------------------------------
//
// A tick in the wrong plan, a tile dropped one slot too low, a stage chosen
// from a menu that opened under the pointer: each was a save by the time it
// was noticed, and putting it back meant remembering what it had been.
//
// One history per page, because an undo should change something you can see:
// ⌘Z on Schedule taking a moment back out of a plan on Segments would be a
// change made out of sight. Each entry knows how to go both ways, and does it
// through the same saves the page already makes, so a revision the server
// has moved on from is refused the way any other stale save is. In a text box
// ⌘Z is the box's own, a keystroke at a time; the box's whole edit becomes
// one entry here when you leave it.

const UNDO_PAGES = ['Plans', 'Schedule', 'Segments'];
// Enough for an evening's clicks; the oldest go first.
const UNDO_KEPT = 100;
const undoLog = new Map(UNDO_PAGES.map(page => [page, { done: [], undone: [] }]));
/* Set while an entry is being played, so the functions it calls -- the same
   ones a click calls -- do not record the replay as a new action. */
let replaying = false;

const PLAN_KEPT = ['title', 'desc', 'stage', 'week', 'slot', 'strand', 'target', 'moments',
                   'finished', 'posted'];
const planTitle = plan => `“${plan?.title || 'Untitled plan'}”`;

/* `guard`, where given, is asked first and can leave the entry where it is. */
function remember(label, undo, redo, { guard = null, page = state.tab } = {}) {
  const log = undoLog.get(page);
  if (!log || replaying) return;
  log.done.push({ label, undo, redo, guard });
  if (log.done.length > UNDO_KEPT) log.done.shift();
  log.undone = [];
  paintUndo();
}

/* What this page remembers is about plans as they were. After a reload
   forced by another window it is about plans that are not there. */
function forgetUndo(...pages) {
  for (const page of pages) undoLog.set(page, { done: [], undone: [] });
  paintUndo();
}

async function undoStep(back) {
  const log = undoLog.get(state.tab);
  if (!log || replaying) return;
  const from = back ? log.done : log.undone;
  const entry = from.at(-1);
  if (!entry) return toast(back ? 'Nothing to undo' : 'Nothing to redo');
  if (entry.guard && !entry.guard()) return;
  from.pop();
  replaying = true;
  paintUndo();
  try {
    await (back ? entry.undo() : entry.redo());
    (back ? log.undone : log.done).push(entry);
    toast(`${back ? 'Undone' : 'Redone'}: ${entry.label}`);
  } catch (e) {
    /* Dropped rather than put back: what failed is a step onto a state
       that is no longer there, and it would fail the same way again. */
    toast(`Could not ${back ? 'undo' : 'redo'} ${entry.label}: ${e.message}`);
  } finally {
    replaying = false;
    paintUndo();
  }
}

const undoButtons = [true, false].map(back => el('button', {
  class: 'iconbtn undo-btn', onclick: () => undoStep(back),
}, back ? '↶' : '↷'));

function paintUndo() {
  const log = undoLog.get(state.tab);
  undoButtons.forEach((button, i) => {
    const back = i === 0;
    const entry = log && (back ? log.done : log.undone).at(-1);
    const key = back ? '⌘Z' : '⇧⌘Z';
    button.hidden = !log;
    button.disabled = !entry || replaying;
    button.title = entry ? `${back ? 'Undo' : 'Redo'}: ${entry.label} (${key})`
      : `Nothing to ${back ? 'undo' : 'redo'} (${key})`;
    button.setAttribute('aria-label', button.title);
  });
}

/* A text box keeps its own undo. Everything else on the three pages -- a
   button, a tile, the page itself -- hands ⌘Z / Ctrl+Z here. */
const TYPING = 'textarea, [contenteditable], input:not([type=checkbox]):not([type=radio])'
  + ':not([type=button]):not([type=range]):not([type=submit])';
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey || !undoLog.has(state.tab)) return;
  const key = e.key.toLowerCase();
  const redo = key === 'y' && !e.shiftKey;
  if (key !== 'z' && !redo) return;
  if (e.target.closest?.(TYPING) || $('#dlg').open || $('.menu')) return;
  e.preventDefault();
  undoStep(!e.shiftKey && !redo);
});

/* The page keeps its place: a whole render starts with "loading…", which
   takes the scroll back to the top of forty-two plans. */
async function renderInPlace() {
  const y = window.scrollY;
  await renderView();
  window.scrollTo(0, y);
}

/* --- plans --- */

const planSnapshot = (plan, keys) => structuredClone(planFields(plan, keys));

/* Called after the change, with what the fields were before it. */
function rememberPlan(plan, before, label) {
  const keys = Object.keys(before);
  const after = planSnapshot(plan, keys);
  if (JSON.stringify(before) === JSON.stringify(after)) return;
  remember(label, () => putPlanBack(plan.id, before), () => putPlanBack(plan.id, after));
}

async function putPlanBack(id, fields) {
  const plan = findPlan(id);
  if (!plan) throw Error('that plan is gone');
  const was = plan.stage;
  Object.assign(plan, structuredClone(fields));
  const restaged = plan.stage !== was;
  if (restaged) restackPlans(state.plans, plan);
  await savePlan(plan, Object.keys(fields));
  await loadStates();
  if (restaged) await loadSchedule();
  await showPlanChange(id);
}

/* Where the change can be seen: the one card on Plans, the chips and counts
   on Segments, and the board on Schedule, which is cheap to draw again. */
async function showPlanChange(id) {
  if (state.tab === 'Schedule') return renderInPlace();
  if (state.tab !== 'Plans') return refreshPlanUsage();
  state.plans.sort(planPlace);
  const card = document.getElementById('plan-' + id);
  if (state.planStage || !card) return renderInPlace();
  repaintPlan(id);
  placePlanCards();
  paintStageFilter();
  refreshPlanUsage();
  document.getElementById('plan-' + id)?.scrollIntoView({ block: 'nearest' });
}

/* `order` is the schedule as it was. Only the reels still ready are placed,
   and any made ready since go after them, where they already were. */
/* A stage change undone back to Ready: the reel returns to its place, not to
   the end of the schedule. */
async function restoreSlot(id, stage, order) {
  if (stage !== 'ready') return;
  try { await putScheduleBack(order); }
  catch (e) { toast('it is ready again, but not in its old place on the schedule: ' + e.message); }
  await showPlanChange(id);
}

async function putScheduleBack(order) {
  await loadSchedule();
  const now = scheduleView.reels.map(r => r.id);
  const wanted = [...order.filter(id => now.includes(id)), ...now.filter(id => !order.includes(id))];
  if (wanted.join('\n') === now.join('\n')) return;
  const got = await api('/api/schedule', sendJSON('PUT', { revision: scheduleView.revision, order: wanted }));
  scheduleView.revision = got.revision;
  scheduleView.reels = got.reels;
  plansView.slots = new Map(got.reels.map(r => [r.id, r.number]));
  state.plans.sort(planPlace);
}

/* A deleted plan, under its own id, so the schedule still knows it. */
async function bringPlanBack(kept, order) {
  const { orders, ...made } = await api('/api/plans', sendJSON('POST', {
    ...structuredClone(planFields(kept, PLAN_KEPT)),
    id: kept.id, created_at: kept.created_at, stage_at: kept.stage_at }));
  state.plans.push(made);
  applyPlanOrders(orders);
  if (made.stage === 'ready') {
    try { await putScheduleBack(order); }
    catch (e) { toast('it is back, but not in its old place on the schedule: ' + e.message); }
  }
  await loadStates();
  await showPlansChanged();
}

async function takePlanAway(id) {
  if (!await deletePlan(id)) throw Error('it could not be deleted');
  await showPlansChanged();
}

/* A plan coming or going moves every card below it; on Segments it is only
   the chips. */
const showPlansChanged = () => UNDO_PAGES.slice(0, 2).includes(state.tab)
  ? renderInPlace() : refreshPlanUsage();

/* A plan about to be deleted, as undo will want it back. */
function keptPlan(id) {
  const plan = findPlan(id);
  if (!plan) throw Error('that plan is gone');
  return { plan: structuredClone({ ...plan, ...planFields(plan, ['moments']) }),
           order: scheduleView.reels.map(r => r.id) };
}

function rememberDeleted(kept) {
  remember(`deleted ${planTitle(kept.plan)}`,
    () => bringPlanBack(kept.plan, kept.order),
    () => takePlanAway(kept.plan.id));
}

/* A plan just made. Undo deletes it and redo brings back what it had become
   by then; `also` is anything else the same click did, as a pair. */
function rememberMade(plan, label, also = null) {
  let kept = null;
  remember(label, async () => {
    await flushPlan(plan.id);
    kept = keptPlan(plan.id);
    await takePlanAway(plan.id);
    await also?.undo();
  }, async () => {
    await bringPlanBack(kept.plan, kept.order);
    await also?.redo();
  });
}

/* --- the shortlist --- */

function putInShortlist(entry, at) {
  if (shortlisted(entry.id)) return;
  state.shortlist = [...state.shortlist];
  state.shortlist.splice(Math.min(at, state.shortlist.length), 0, entry);
  writeShortlist();
}

/* Every "+ Shortlist" on the page, so an undo reaches the one you clicked. */
function refreshShortlistButtons() {
  document.querySelectorAll('[data-shortlist]').forEach(button => {
    const on = shortlisted(button.dataset.shortlist);
    button.textContent = on ? '✓ Shortlisted' : '+ Shortlist';
    button.setAttribute('aria-pressed', String(on));
  });
}

function toggleShortlist(entry) {
  const at = state.shortlist.findIndex(s => s.id === entry.id);
  const held = at >= 0 ? state.shortlist[at] : entry;
  const add = () => putInShortlist(held, at >= 0 ? at : state.shortlist.length);
  const drop = () => dropFromShortlist(held.id);
  if (at >= 0) {
    drop();
    remember(`took “${held.title || 'a moment'}” off the shortlist`, add, drop);
  } else {
    add();
    remember(`shortlisted “${held.title || 'a moment'}”`, drop, add);
  }
}

/* --- segments --- */

/* A saved segment edit. The server answers with the patch that reverses it,
   and answers that one with the patch that reverses it back, so one function
   goes both ways. */
function rememberSegment(id, reverse, label) {
  if (!reverse || !Object.keys(reverse).length) return;
  let patch = reverse;
  const play = async () => {
    const saved = await api('/api/segment/' + encodeURIComponent(id), sendJSON('PATCH', patch));
    patch = saved.undo;
    clipCache.delete(id.split('#')[0]);
    if ('title' in saved.undo) {
      renameInShortlist(id, saved.title);
      renameInPlans(id, saved.title);
    }
    await showSegmentChange(id);
  };
  remember(label, play, play, { guard: () => segmentGuard(id) });
}

/* The open editor is drawn from the sidecar as it was, and an undo under it
   would leave its boxes saying the old words -- or, with something typed in
   them, take that with it. */
const segmentGuard = id => state.tab !== 'Segments' || state.openSeg !== id || detailGuard();

async function showSegmentChange(id) {
  loadStates();
  if (state.tab === 'Plans') {
    if (state.panel?.id === id) paintPanel();
    return;
  }
  if (state.tab !== 'Segments') return;
  if (state.openSeg === id) paintDetail();
  await renderInPlace();
}

/* A deleted segment, with the plans and the strip it was taken out of. */
function rememberSegmentDeleted(segment, plansBefore, shortlistAt, shortlistEntry) {
  const id = segment.id;
  remember(`deleted “${segment.title || id}”`, async () => {
    await api('/api/segments', sendJSON('POST', { segment }));
    clipCache.delete(id.split('#')[0]);
    for (const [planId, before] of plansBefore) {
      const plan = findPlan(planId);
      if (!plan) continue;
      Object.assign(plan, structuredClone(before));
      await savePlan(plan, ['moments']);
    }
    if (shortlistEntry) putInShortlist(shortlistEntry, shortlistAt);
    if (state.tab === 'Segments' && !state.openSeg) {
      state.openSeg = id;
      state.openSegAt = null;
      paintDetail();
    }
    await loadOverview();   // the header counts segments
    await showSegmentChange(id);
  }, async () => {
    await api('/api/segment/' + encodeURIComponent(id), { method: 'DELETE' });
    clipCache.delete(id.split('#')[0]);
    dropFromShortlist(id);
    dropFromPlans(id);
    if (state.openSeg === id) { state.openSeg = null; paintDetail(); }
    await loadOverview();
    await showSegmentChange(id);
  }, { guard: () => segmentGuard(id) });
}

// --- boot ------------------------------------------------------------

async function renderView() {
  const view = $('#view');
  // Re-rendering the open cut keeps its <video> mounted until the new tree
  // replaces the old one in a single step; a "loading…" placeholder in
  // between would detach it and stop playback on every edit.
  const editing = state.tab === 'Reels' && (state.openCut || state.openDraft);
  if (!editing) {
    player.dispose();
    view.replaceChildren(el('div', { class: 'empty' }, 'loading…'));
  }
  const fn = {
    Plans: viewPlans, Schedule: viewSchedule,
    Segments: viewSegments, Review: viewReview, Clips: viewClips, Tags: viewTags,
    Reels: viewReels, Texts: viewTexts,
  }[state.tab];
  /* Only the newest render lands. Each keystroke in the search box starts
     one, a search now also works out every moment's state, and a slow
     "coco" (no whole word matches it) arriving after "coconut" would put an
     empty list over the right answer. */
  const mine = ++renderView.latest;
  let node;
  try { node = await fn(); }
  catch (e) { node = el('div', { class: 'empty' }, e.message); }
  if (mine === renderView.latest) { view.replaceChildren(node); syncUrl(); }
}
renderView.latest = 0;
function render() {
  if (state.tab !== 'Plans') closePanel();
  $('main').classList.toggle('wide', !['Segments', 'Review'].includes(state.tab));
  renderNav(); renderSide(); paintUndo(); return renderView();
}

async function boot() {
  await loadOverview();
  try { state.tagInfo = await api('/api/tags'); } catch { state.tagInfo = []; }
  await loadPlans();
  await render();
  /* Not awaited: 52 ms of reading every sidecar, the backup's comparison and
     the Final Cut library, none of which the first paint should wait on.
     `boot` runs again after every command, so a fix shows as fixed. */
  loadHealth();
  // A moment saved or deleted on Segments may be the one the panel is showing.
  if (state.panel) paintPanel();
}
/* Held through the first render, so a page still loading its plans does not
   write "no panel open" over the link that asked for one. */
syncUrl.held = true;
const arrived = fromUrl();
boot().then(() => settleUrl(arrived), () => { syncUrl.held = false; });
</script>
</body>
</html>
