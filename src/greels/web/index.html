<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>greels</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%239a5b2c'/><path d='M13 10 L23 16 L13 22 Z' fill='%23fbfaf8'/></svg>">
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --line: #e5e1da; --ink: #23201c;
  --muted: #7d766c; --accent: #9a5b2c; --accent-soft: #f2e7dd;
  --good: #3f7d52; --bad: #a2493c; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  /* Where a moment has got to. Seven, and every surface draws them with
     `stateBadge`, so a green disc means the same thing on a plan chip, a
     Segments row and the side panel. Warm to cool is idle to spoken for;
     the one red is the one that asks you to look. */
  --st-unseen: #aaa398; --st-seen: #6e8196; --st-rejected: #a2493c;
  --st-proposed: #b7832a; --st-planned: #3b6db3; --st-used: #3f7d52; --st-published: #7b4ea8;
  /* Not a state: the one stage whose moments are in a state another stage
     also gives them, and which still has to be told apart from an idea. Teal
     sits between the amber of an idea and the blue of ready. */
  --st-gathering: #2b8a86;
  --panel-w: clamp(360px, 32vw, 460px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --panel: #1e1d1a; --line: #322f2a; --ink: #ebe7e0;
    --muted: #9a9287; --accent: #d99a63; --accent-soft: #2c2620;
    --good: #7fb98f; --bad: #d98878;
    --st-unseen: #6f685f; --st-seen: #93a6ba; --st-rejected: #d98878;
    --st-proposed: #e0b25c; --st-planned: #82a9e3; --st-used: #7fb98f; --st-published: #bb97e3;
    --st-gathering: #6cc4bd;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 10;
}
h1 { font-size: 15px; margin: 0; letter-spacing: .14em; text-transform: uppercase; }
h1 span { color: var(--accent); }
.stats { color: var(--muted); font-size: 12.5px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button, .btn {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px;
  border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer;
}
nav button:hover, .btn:hover { color: var(--ink); background: var(--accent-soft); }
nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn { border-color: var(--line); }
nav .undo-btn { padding-inline: 8px; font-size: 15px; line-height: 1; }
nav .undo-btn:disabled { opacity: .35; cursor: default; background: none; }

main { display: grid; grid-template-columns: 250px 1fr; gap: 0; align-items: start; }
/* Only Segments has facets; the other tabs get the full width. */
main.wide { grid-template-columns: 1fr; }
main.wide aside { display: none; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
@media (max-width: 600px) {
  header { gap: 8px 14px; padding-inline: 14px; }
  nav { width: 100%; margin-left: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
  nav button, .btn { padding-inline: 6px; }
  main section { padding-inline: 16px; }
  .subnav { flex-wrap: wrap; }
}
aside {
  padding: 16px 14px; border-right: 1px solid var(--line);
  position: sticky; top: 57px; max-height: calc(100vh - 57px); overflow-y: auto;
}
aside h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted); margin: 18px 0 6px;
}
aside h3:first-child { margin-top: 0; }
input, select, textarea {
  width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--ink);
}
textarea { resize: vertical; min-height: 62px; line-height: 1.55; }
.facet {
  display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px;
  border-radius: 5px; cursor: pointer; font-size: 13px;
}
.facet:hover { background: var(--accent-soft); }
.facet.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.facet .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.facet.on .n { color: var(--accent); }

section { padding: 18px 22px 60px; min-width: 0; }
/* Column gap only. The thumbnail spans nine rows (see below) and a card
   fills three of them, so a row-gap would be charged six more times under
   the tags -- sixty pixels of nothing at the foot of every card. The stacked
   text carries its own spacing instead. */
.row {
  display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 0;
  align-items: baseline;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); margin-bottom: 7px; cursor: pointer;
}
.row { grid-template-columns: 72px 1fr auto; }
.row:hover { border-color: var(--accent); }
/* `span 9`, not `1 / -1`. -1 is the last line of the *explicit* grid, and the
   card declares no rows, so it meant row 1 alone: the 128 px thumbnail was
   stretching the title's row to its own height and leaving that much blank
   beside a one-line title. Nine is more rows than a card ever has; with the
   row-gap gone the ones nothing lands in cost nothing. */
.row .thumb {
  grid-row: 1 / span 9; width: 72px; aspect-ratio: 9 / 16; object-fit: cover;
  border-radius: 6px; background: var(--line); align-self: start;
}
.row .thumb[data-missing] { visibility: hidden; }
.clipthumb {
  width: 40px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 4px;
  background: var(--line); display: block;
}
.clipthumb[data-missing] { visibility: hidden; }
td:has(.clipthumb) { width: 40px; padding-right: 0; }
.row .t { font-weight: 600; }
.row .m { color: var(--muted); font-size: 12.5px; font-family: var(--mono); white-space: nowrap; }
.row .s { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
/* The summary and the tags ran the full width of the card, starting back in
   the thumbnail's column and so sitting under the picture, which left the
   space beside the title blank. In a column this narrow that blank is most of
   the card, so they stack under the title instead. */
.row .s, .row .tags, .row .said { grid-column: 2 / -1; }
/* What the row-gap used to do, charged only where something follows. */
.row .s, .row .tags { margin-top: 7px; }
/* Why a moment matched, when what matched was something said. Marked down
   the left rather than boxed: it is a fragment of the transcript quoted
   inside the card, not a second card. */
.said { margin-top: 7px; border-left: 2px solid var(--accent-soft); padding-left: 8px; }
.saidline {
  display: grid; grid-template-columns: auto 1fr; gap: 8px;
  font-size: 13px; line-height: 1.45; padding: 2px 0;
}
.saidline .tc { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.saidline:hover .quote { color: var(--accent); }
.saidmore { color: var(--muted); font-size: 12px; margin-top: 3px; }
.tag {
  font-size: 11.5px; font-family: var(--mono); padding: 1px 7px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}
.tag.proposed { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.fav { color: var(--good); border-color: var(--good); }
.pill.rej { color: var(--bad); border-color: var(--bad); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
tbody tr:hover { background: var(--accent-soft); cursor: pointer; }

.reel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px 16px; margin-bottom: 14px; }
.reel h4 { margin: 0 0 2px; font-size: 15px; }
.reel .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; font-family: var(--mono); }
.reel ol { margin: 0; padding-left: 20px; }
.reel li { padding: 2px 0; }
.reel li .m { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.reel .strip { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 2px; }
.reel .strip img {
  width: 54px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 4px;
  background: var(--line); cursor: pointer;
}

/* --- the shortlist --- */
/* One line, and only when there is something in it. It is a note to self, not
   a running order, and it should cost the page about as much room as one. */
.shortlist { display: flex; gap: 10px; align-items: center; }
.shortlist:not(:empty) {
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.shortlist .label { flex: none; white-space: nowrap; }
/* Scrolls inside itself rather than widening the page: twenty of these is a
   long afternoon, and the results underneath must not move sideways. */
.shortlist-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.shortlist-item {
  display: flex; align-items: center; gap: 6px; flex: none; max-width: 210px;
  padding: 3px 4px 3px 3px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel);
}
.shortlist-item:hover { border-color: var(--accent); }
.shortlist-thumb {
  width: 26px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 4px;
  background: var(--line); flex: none;
}
.shortlist-thumb[data-missing] { visibility: hidden; }
.shortlist-item .t {
  font-size: 12.5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; cursor: pointer;
}
.shortlist-item .iconbtn { flex: none; padding: 0 5px; border: 0; }

/* --- plans --- */
/* A plan is a shortlist with a name, a reason and an order. It is drawn as a
   block rather than a row because two of its four fields are boxes you type
   in; the card itself is `.reel`, and this is what the typing needs. */
/* The words on the left, the moments on the right. Stacked, a 1440 px window
   ran the description as two 200-character lines with nothing beside them,
   and the moments below in a strip that scrolled sideways: 13 of them were
   2530 px wide in 1362, so half of every plan was out of sight and a chip could
   not be dragged to a place it could not be seen. */
.plan {
  display: grid; gap: 6px 26px; align-items: start;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
}
@media (max-width: 1000px) { .plan { grid-template-columns: minmax(0, 1fr); } }
.plan-words, .plan-moments { min-width: 0; }
.plan-head { display: flex; align-items: baseline; gap: 8px; }
/* The title and the description are always editable but read as text until
   they are pointed at. Boxed, forty-two plans were eighty-four empty-looking
   form fields, and the border was most of what the eye found on the page. */
.plan-head input, .plan textarea {
  border-color: transparent; background: transparent; padding-inline: 6px;
}
.plan-head input:hover, .plan textarea:hover { border-color: var(--line); }
.plan-head input:focus, .plan textarea:focus {
  border-color: var(--accent); background: var(--panel); outline: none;
}
.plan-head input { font-size: 15px; font-weight: 600; padding-block: 3px; }
.plan .meta { margin: 0 0 0 6px; font-size: 12px; }
/* As tall as what is written in it. The rows it used to be given by length
   made every seeded plan (276-460 characters) a 103 px box, whatever the
   width. */
.plan textarea {
  display: block; margin: 4px 0 0; width: 100%;
  min-height: 0; resize: none; field-sizing: content; color: var(--ink);
  font-size: 13.5px; line-height: 1.5; padding-block: 4px;
}
/* Wrapped rather than scrolled, so the whole running order is on screen. Two
   lines of title beside a thumbnail tall enough to hold them, where the strip
   cut every title at 210 px. */
.plan .moment-grid {
  display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
.plan .shortlist-item { max-width: none; min-width: 0; cursor: grab; }
.plan .shortlist-item .t {
  flex: 1; min-width: 0; white-space: normal; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.plan-foot {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 8px;
  color: var(--muted); font-size: 12px; font-family: var(--mono);
}
.plan-foot .btn { font-family: inherit; font-size: 12px; padding: 1px 8px; border-color: transparent; }
.plan-foot .btn:hover { border-color: var(--line); }
.plan-empty { margin: 4px 0 0; }
.plan-usage { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
.row .plan-usage { grid-column: 2 / -1; }
.plan-link { font: inherit; font-size: 12px; text-align: left; background: var(--accent-soft);
  color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; cursor: pointer; }
.plan-link:hover, .plan-link:focus-visible { border-color: var(--accent); }
.plan { scroll-margin-top: 85px; }
/* The moments inside a plan are a running order, so they can be dragged (the
   `grab` cursor is set with the plan's grid above). The strip on Segments is
   not ordered and its chips are not draggable. */
.shortlist-item.dragging { opacity: .4; }

/* --- Segments: the list and the moment, side by side --- */
/* The editor was a modal, so the page under it was a list and nothing else --
   two thirds of a wide screen holding a column of rows. It is a pane now, and
   the page is what you actually do the evening's work on. */
/* The list used to take the larger half. It is a place you point at
   something; the pane is where the evening's work happens, and it holds the
   video, the title, the tags and every caption line. So the list is given
   what a card needs and the pane gets the rest.
   Not a ratio: at 1 : 1.7 a window just over the 1000 px breakpoint left the
   list 200 px and wrapped every title over three lines, and a 1900 px screen
   spent the extra 400 on it. 300 is a card that reads; past 440 the extra
   only widens the summary. */
.split {
  display: grid; gap: 22px; align-items: start;
  grid-template-columns: minmax(0, clamp(300px, 36%, 440px)) minmax(0, 1fr);
}
.results { min-width: 0; }
.detail { min-width: 0; position: sticky; top: 71px; }
/* 79 px is where the pane starts before anything is scrolled -- a 60.5 px
   header and 18 of section padding -- and 16 is a margin off the bottom. It
   was 130 while the Moments/Said-out-loud switcher sat between them, which
   left 67 px of dead space under the Save button once that went. Sized off
   where it sticks instead, the button hung below the fold on a list too short
   to scroll it back into view. */
.detail .segedit { max-height: calc(100vh - 95px); }
/* 1000, not 1150: at 1150 a window one notch off full screen fell back to a
   plain list, which is the page exactly as it looked before any of this, so
   the pane read as simply not there. */
@media (max-width: 1000px) {
  .split { grid-template-columns: 1fr; }
  /* Above the list rather than below it. Stacked, whichever one is second is
     the one nobody scrolls to, and between a list you can already see and the
     moment you just asked for, the moment wins. */
  .detail { position: static; order: -1; margin-bottom: 18px; }
  .detail .segedit { max-height: none; }
  .detail .empty { padding: 18px 0; }
}
.segedit { display: flex; flex-direction: column; min-height: 0; }
/* A card wherever it is on a page rather than in a dialog, which draws its
   own. In Review it flows with the pass instead of scrolling inside itself:
   the column is already as tall as the footage beside it. */
.detail .segedit, .review .segedit {
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
}
.review .segedit { margin-top: 4px; }
.review .segedit-body { overflow: visible; }
/* Nothing above it to name the moment, so the head can be empty but for the
   close -- and an empty flex row still has to put that on the right. */
.segedit-head:empty { display: none; }
.segedit-head {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
}
.segedit-body { padding: 4px 16px 16px; overflow-y: auto; min-height: 0; }
dialog .segedit-body { max-height: 60vh; }
.segedit-foot {
  padding: 12px 16px; border-top: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center;
}
.segedit-body .row { cursor: pointer; }
.segedit-body details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.segedit-body summary {
  cursor: pointer; font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); padding: 4px 0;
}
.segedit-body summary:hover { color: var(--ink); }
.segedit-body details[open] summary { color: var(--ink); }
/* Which row the pane is showing. */
.row.on { border-color: var(--accent); background: var(--accent-soft); }

dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  padding: 0; max-width: 720px; width: 92vw; max-height: 88vh;
  /* Centre it regardless of how far the list behind has been scrolled. */
  margin: auto; inset: 0; position: fixed;
}
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
.dlg-body { padding: 16px 20px; overflow-y: auto; max-height: 62vh; }
/* Stop the page behind scrolling under an open dialog. */
body:has(dialog[open]) { overflow: hidden; }
.dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
/* Two buttons joined into one control, so they read as a choice between them
   rather than as two unrelated things to press. The chosen one is `.primary`,
   which is the same filled shape the page uses everywhere else for "this is
   the one that will happen". */
.editorpick { display: inline-flex; }
.editorpick .btn { border-radius: 0; margin-left: -1px; }
.editorpick .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.editorpick .btn:last-child { border-radius: 0 6px 6px 0; }
.editorpick .btn.primary { position: relative; z-index: 1; }
.danger { color: var(--bad); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
/* These report a clip per line and line their columns up with spaces. */
.runlog {
  margin: 0; max-height: 46vh; overflow: auto; white-space: pre-wrap;
  font: 12px/1.55 var(--mono); color: var(--muted); overflow-wrap: anywhere;
}
.menu {
  position: fixed; z-index: 20; width: min(340px, 92vw); padding: 5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45); max-height: 78vh; overflow-y: auto;
}
.menu button {
  display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
  background: none; border: 0; border-radius: 7px; padding: 7px 9px; color: var(--ink);
}
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
.menu strong { display: block; font-size: 13px; font-weight: 600; }
/* Tab names, not commands with a sentence each: the Run menu's width is for those. */
#tabmenu { width: auto; min-width: 140px; }
#tabmenu [aria-current="page"] strong { color: var(--accent); }
.menu span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.45; margin-top: 2px; }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; }
.lines { font-family: var(--mono); font-size: 12.5px; }
.lines div { padding: 2px 0; border-bottom: 1px solid var(--line); }
.lines .tc { color: var(--muted); }
.subnav { display: flex; gap: 6px; margin-bottom: 18px; }
.subnav button {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer;
}
.subnav button:hover { border-color: var(--accent); color: var(--ink); }
.subnav button[aria-selected="true"] {
  border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.text-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 12px; }
.text-head h2 { margin: 0; font-size: 18px; }
.text-entry { border-top: 1px solid var(--line); padding: 16px 2px 18px; }
.text-entry:first-child { border-top: 0; }
.text-entry h3 { margin: 0 0 2px; font-size: 14px; }
.text-entry .meta {
  color: var(--muted); font: 12px/1.5 var(--mono); margin-bottom: 7px; overflow-wrap: anywhere;
}
.text-entry p { margin: 0; line-height: 1.7; white-space: pre-wrap; }

/* --- cuts --- */
.cut-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.cut-head h2 { margin: 0; font-size: 19px; }
.shot {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); margin-bottom: 6px;
}
.shot[draggable="true"] { cursor: grab; }
.shot.dragging { opacity: .4; }
.shot.over { border-color: var(--accent); border-style: dashed; }
.shot.broken { border-color: var(--bad); }
.shot { grid-template-columns: 20px 44px 1fr auto; }
.shot .n { font: 12px var(--mono); color: var(--muted); text-align: right; }
.shot .thumb {
  grid-row: 1 / -1; width: 44px; aspect-ratio: 9 / 16; object-fit: cover;
  border-radius: 4px; background: var(--line); align-self: start; cursor: pointer;
}
.shot .src, .shot .trim, .shot .warn { grid-column: 3 / -1; }
.shot .t { font-weight: 600; }
.shot .at { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.shot .src { grid-column: 2 / -1; color: var(--muted); font: 12px/1.5 var(--mono); overflow-wrap: anywhere; }
.shot .trim { grid-column: 2 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.shot .trim input { width: 76px; padding: 3px 6px; font: 12px var(--mono); }
.shot .trim label { margin: 0; }
.shot .warn { grid-column: 2 / -1; color: var(--bad); font-size: 12.5px; }
.iconbtn {
  font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; line-height: 1.4;
}
.iconbtn:hover { color: var(--ink); border-color: var(--accent); }
a.iconbtn, a.btn { text-decoration: none; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0 18px; }
.bar .grow { flex: 1; }
.spacer { margin-left: auto; }
.ruler { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0 16px; background: var(--line); }
.ruler span { display: block; border-right: 1px solid var(--bg); }
.ruler span:last-child { border-right: 0; }

/* --- the player --- */
.player {
  position: sticky; top: 57px; z-index: 5; background: var(--bg);
  padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 16px; align-items: start;
}
.player video {
  width: 100%; max-height: 360px; border-radius: 10px; background: #000;
  border: 1px solid var(--line);
}
/* Portrait phone footage is tall; at full height it pushes the fields off the
   bottom of the pane, and the fields are what you came for. */
.dlg-body .player, .segedit-body .player { grid-template-columns: minmax(0, 150px) 1fr; margin-bottom: 4px; }
.dlg-body .player video, .segedit-body .player video { max-height: 240px; }
/* The pane is not the dialog. It holds most of the page's width now, and a
   150 px phone screen adrift in the middle of it is a thumbnail -- too small
   to tell a good take from a shaky one, which is the first thing you use it
   for. Twice that, and the fields still clear the fold.
   The 45% is what keeps it honest between 1000 px, where the pane stops
   stacking, and about 1150: a flat 300 there left "Play this moment" ninety
   pixels to wrap into. */
.detail .segedit-body .player { grid-template-columns: minmax(0, min(300px, 45%)) 1fr; }
.detail .segedit-body .player video { max-height: 480px; }
.clipplayer { margin-top: 10px; }
.clipplayer video {
  max-height: 34vh; border-radius: 8px; background: #000; border: 1px solid var(--line);
  display: block; margin: 0 auto;
}
.moment { margin-bottom: 18px; }
.moment .transcript { max-height: none; margin-top: 4px; padding-left: 12px; }
.moment .row { cursor: pointer; }
.player .now { font-size: 13px; }
.player .now b { font-size: 15px; }
.player .now .m { color: var(--muted); font: 12px/1.6 var(--mono); }
.player .sub {
  margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--line); min-height: 44px; line-height: 1.5;
}
.player .sub .kok { color: var(--muted); font-size: 12.5px; }
/* Selecting a run of transcript. Empty until something is picked, so it does
   not take a line of the dialog for a feature nobody is using yet. */
.pickbar { display: none; }
.pickbar.on {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 10px; padding: 8px 10px; border-radius: 8px;
  background: var(--accent-soft); border: 1px solid var(--accent);
}
.transcript div.picked { background: var(--accent-soft); border-radius: 4px; }
/* Said in this moment, but outside what the shot currently holds. Shown
   because it is usually where the in point wants to be. */
.transcript div.outside { opacity: .48; }
.lineedit { display: grid; grid-template-columns: 62px 1fr 1fr 96px 24px 24px; gap: 6px; align-items: center; }
/* Half a dialog's width, so the two languages stack instead of sharing it:
   the box you are shortening is the English one, and 160 px of it is not a
   caption you can judge the length of. Every cell is placed by hand -- left
   to flow, the Konkani spanning the row pushed the speaker and the two
   buttons onto a third one of their own. */
.detail .lineedit { grid-template-columns: 62px 1fr 96px 24px 24px; row-gap: 2px; }
.detail .lineedit select.who { grid-area: 1 / 3; }
.detail .lineedit button:nth-of-type(1) { grid-area: 1 / 4; }
.detail .lineedit button:nth-of-type(2) { grid-area: 1 / 5; }
.detail .lineedit input.kok { grid-area: 2 / 2 / 3 / -1; }
.lineedit input { margin: 0; }
.lineedit input.kok { color: var(--muted); font-size: 12.5px; }
.lineedit .tc.bad { color: var(--bad); }
.lineedit select.who { margin: 0; font-size: 12.5px; }
@media (max-width: 720px) { .player { grid-template-columns: 1fr; } }
.shot .play { grid-row: span 1; }

/* --- the rendered cut --- */
/* Not sticky: two players pinned to the top at once leaves no room for the
   running order, which is the thing you are comparing them against. */
#rendered .player { position: static; border-bottom: 0; }
#rendered video::cue { font-size: 15px; background: rgba(0, 0, 0, .6); }
.progress {
  flex: 1; height: 6px; border-radius: 3px; background: var(--panel);
  border: 1px solid var(--line); overflow: hidden; max-width: 320px;
}
.progress .fill { height: 100%; background: var(--accent); transition: width .4s linear; }
.stats.bad { color: var(--bad); }

/* --- review --- */
.review { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 22px; align-items: start; }
.review video { width: 100%; max-height: 62vh; border-radius: 10px; background: #000; border: 1px solid var(--line); }
.review h2 { margin: 0 0 4px; font-size: 20px; }
.review .meta { color: var(--muted); font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
.review .summary { margin: 12px 0 14px; line-height: 1.65; }
.transcript { max-height: 34vh; overflow-y: auto; padding-right: 6px; margin-top: 10px; }
.transcript div { padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.transcript div:hover { color: var(--accent); }
.transcript .tc { color: var(--muted); font: 12px var(--mono); }
.transcript .on { background: var(--accent-soft); border-radius: 4px; padding-inline: 4px; }
/* The pass's own bar, which sits above .review rather than inside it -- so it
   cannot be selected through it, which is why it went unstyled. */
.pass { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 14px; }
.pass span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.keys { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.9; }
.keys kbd {
  font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; margin-right: 3px; color: var(--ink);
}
.verdict { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 4px; }
.verdict button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
@media (max-width: 820px) { .review { grid-template-columns: 1fr; } }
/* The script is the editing surface. A sticky context player obscures its
   reorder/trim controls when the browser scrolls a button into view. */
.draft-editor .player { position: static; }
.draft-editor .transcript { max-height: 28vh; }

/* --- states and stages --- */
/* The icon carries the state on its own -- colour is the second channel, not
   the only one, so the badges still read for anyone who cannot tell the green
   from the amber. A ring that fills as a moment goes further. */
.badge {
  display: inline-flex; align-items: center; gap: 4px; vertical-align: -2px;
  font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--muted);
}
.badge svg { width: 14px; height: 14px; flex: none; overflow: visible; }
.badge .word { color: var(--ink); }
.badge .fav { color: var(--st-proposed); font-size: 11px; }
/* Something about this moment contradicts itself -- rejected but still in a
   plan, or chosen for two reels. A ring rather than a new colour, so the
   state underneath stays legible. */
.badge.warn svg { border-radius: 50%; box-shadow: 0 0 0 1.5px var(--bad); }
.st-unseen { color: var(--st-unseen); } .st-seen { color: var(--st-seen); }
.st-rejected { color: var(--st-rejected); } .st-proposed { color: var(--st-proposed); }
.st-planned { color: var(--st-planned); } .st-used { color: var(--st-used); }
.st-published { color: var(--st-published); } .st-gathering { color: var(--st-gathering); }
.row .t .badge { margin-right: 5px; }
/* The chip's left edge says it at a glance across a grid of thirteen. The
   badge sits on the thumbnail's corner, and the cross waits for the pointer:
   side by side with a tick, a badge and a cross, a 175 px chip had room for
   "Apartment Courtyard…" and no more. */
.plan .shortlist-item { border-left-width: 3px; position: relative; }
.plan .shortlist-item > .badge {
  position: absolute; left: 17px; bottom: 1px; padding: 1px; border-radius: 50%; background: var(--panel);
}
@media (hover: hover) {
  .plan .shortlist-item > .iconbtn:not(.tick) { opacity: 0; }
  .plan .shortlist-item:hover > .iconbtn, .plan .shortlist-item:focus-within > .iconbtn { opacity: 1; }
}
[data-state="unseen"] { border-left-color: var(--st-unseen); }
[data-state="seen"] { border-left-color: var(--st-seen); }
[data-state="rejected"] { border-left-color: var(--st-rejected); }
[data-state="proposed"] { border-left-color: var(--st-proposed); }
[data-state="planned"] { border-left-color: var(--st-planned); }
[data-state="used"] { border-left-color: var(--st-used); }
[data-state="published"] { border-left-color: var(--st-published); }
.shortlist-item.on { border-color: var(--accent); background: var(--accent-soft); }
.shortlist-item .tick { flex: none; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); }
.shortlist-item .tick[aria-pressed="true"] {
  background: var(--st-used); border-color: var(--st-used); color: var(--panel); font-weight: 700;
}
.stage-pill {
  flex: none; display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); cursor: pointer; white-space: nowrap;
}
.stage-pill:hover { border-color: var(--accent); }
.plan-link .badge { margin-right: 4px; }
.plan-link.shelved { opacity: .6; }
.menu .menu-row { display: flex; gap: 8px; align-items: baseline; }
.menu .menu-row .badge { flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 10px; }
.legend button {
  font: inherit; font-size: 12px; background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 2px 6px; cursor: pointer; color: var(--muted);
}
.legend button:hover { border-color: var(--line); color: var(--ink); }
.legend .n { font-family: var(--mono); margin-left: 3px; }
.ruler.states { height: 10px; margin: 8px 0 4px; }
/* A plan card wraps its moments under its words when the page beside the
   panel is narrow, not only when the window is: at 1440 px with the panel
   open the plan column is 930 px, and 5 : 7 of that cuts every title short. */
.plan-list { container-type: inline-size; }
@container (max-width: 980px) { .plan { grid-template-columns: minmax(0, 1fr); } }
.plan-warn { color: var(--bad); }
.facet .badge { vertical-align: -3px; }

/* --- the side panel on Plans --- */
/* A moment looked at without leaving the plan it is in. Fixed rather than a
   column of the page, so opening it does not rebuild the plans and lose the
   scroll; `main` makes room for it instead. */
.moment-panel {
  position: fixed; right: 0; bottom: 0; top: 57px; width: var(--panel-w); z-index: 8;
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; box-shadow: -12px 0 28px rgba(0,0,0,.08);
}
/* `display: flex` above outranks the browser's own rule for `hidden`. */
.moment-panel[hidden] { display: none; }
body.panel-open main { margin-right: var(--panel-w); }
@media (max-width: 1000px) {
  body.panel-open main { margin-right: 0; }
  .moment-panel { width: min(460px, 100vw); box-shadow: -12px 0 32px rgba(0,0,0,.35); }
}
.moment-panel .mp-head {
  display: flex; gap: 8px; align-items: center; padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
}
.moment-panel .mp-body { overflow-y: auto; padding: 10px 14px 16px; min-height: 0; flex: 1; }
.moment-panel .mp-foot {
  display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line);
}
.moment-panel .mp-title { font-size: 15px; font-weight: 600; padding: 4px 6px; margin-top: 2px;
  border-color: transparent; background: transparent; }
.moment-panel .mp-title:hover { border-color: var(--line); }
.moment-panel .mp-title:focus { border-color: var(--accent); background: var(--panel); outline: none; }
/* Small on purpose: enough to tell a good take from a shaky one, and short
   enough that the tick and the plan's arrows are still on screen under it. */
.moment-panel .player { grid-template-columns: 1fr; gap: 8px; margin: 8px 0 4px; background: none; }
.moment-panel .player video {
  max-height: min(36vh, 340px); margin: 0 auto; display: block; width: auto; max-width: 100%;
}
.moment-panel h5 {
  margin: 14px 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 600;
}
.moment-panel .verdict { margin: 8px 0 2px; }
.moment-panel .transcript { max-height: 30vh; margin-top: 0; }
.moment-panel .summary { margin: 0; line-height: 1.55; }
.mp-plan { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mp-related { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 8px; align-items: center;
  padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.mp-related img { width: 30px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 3px;
  background: var(--line); grid-row: span 2; }
.mp-related .t { cursor: pointer; }
.mp-related .t:hover { color: var(--accent); }
.mp-related .m { color: var(--muted); font: 11.5px var(--mono); }

/* --- the schedule --- */
/* Two columns: the numbers, painted on the page, and the tiles beside them.
   A row is as tall as its tile, so a number stays level with whatever reel is
   in its place. */
.schedule-board {
  display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 8px 12px; max-width: 980px;
}
.sched-num {
  grid-column: 1; align-self: center; text-align: right; user-select: none;
  font: 600 22px/1 var(--mono); color: var(--muted); opacity: .5;
}
.sched-tile {
  grid-column: 2; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 14px; align-items: center; padding: 8px 12px 8px 8px;
  border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px;
  background: var(--panel); cursor: grab;
}
/* Said again here: the `border` above is later in the sheet than the
   `[data-state]` edges and of equal weight, so it was painting them grey. */
.sched-tile[data-state="planned"] { border-left-color: var(--st-planned); }
.sched-tile[data-state="published"] { border-left-color: var(--st-published); }
/* A ring rather than a border colour, which would paint over the state edge. */
.sched-tile:hover, .sched-tile:focus-visible { box-shadow: 0 0 0 1px var(--accent); outline: none; }
.sched-tile.dragging { opacity: .4; }
.sched-tile.posted { cursor: default; }
.sched-tile.posted > :not(.sched-progress) { opacity: .55; }
/* As wide as six, however many there are, so every title down the board
   starts at the same x; a column that shifts by a thumbnail reads as ragged. */
.sched-thumbs { display: flex; gap: 3px; width: calc(6 * 30px + 5 * 3px); }
.sched-thumbs .shortlist-thumb { width: 30px; }
.sched-thumbs.faded { opacity: .45; }
.sched-words { min-width: 0; }
.sched-title {
  font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink); text-align: left;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.sched-title:hover { color: var(--accent); }
/* Three steps in one control, so the tile says which it is at rather than
   which switch has been thrown. Each wears the colour of the state it gives
   the chosen takes where it has one; finished takes the green of a cut. */
.sched-progress { display: inline-flex; }
.sched-progress .btn { border-radius: 0; margin-left: -1px; }
.sched-progress .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.sched-progress .btn:last-child { border-radius: 0 6px 6px 0; }
.sched-progress .btn[aria-pressed="true"] { position: relative; font-weight: 600; }
.sched-progress [data-step="ready"][aria-pressed="true"] { border-color: var(--st-planned); color: var(--st-planned); }
.sched-progress [data-step="finished"][aria-pressed="true"] { border-color: var(--st-used); color: var(--st-used); }
.sched-progress [data-step="posted"][aria-pressed="true"] { border-color: var(--st-published); color: var(--st-published); }
.menu button[disabled] { cursor: default; opacity: .55; }
.menu button[disabled]:hover { background: none; }

/* The state of the machine around the archive, in the header, because that is
   where the evenings happen. `greels doctor` said all of this already and
   said it in a terminal, which on an evening spent in the browser is nowhere:
   an index behind the sidecars, a drive that did not mount, or transcripts
   sitting in exactly one place were things you found out by remembering to
   look. Quiet when there is nothing to say -- it is a health light, and one
   that is always amber is one nobody reads. */
#health[data-level="ok"] { color: var(--muted); }
#health[data-level="note"] { color: var(--accent); border-color: var(--accent-soft); }
#health[data-level="problem"] { color: var(--bad); border-color: var(--bad); font-weight: 600; }
.menu .health-row { display: block; }
.menu .health-row strong { font-weight: 600; }
.menu .health-row[data-level="problem"] strong { color: var(--bad); }
.menu .health-row[data-level="note"] strong { color: var(--accent); }
/* The fix sits under the complaint rather than beside it: "12 line timings
   sit off the speech" does not tell you it means `align`, and a column of
   buttons down the right is a column of targets for a stray click. */
.menu .health-fix {
  display: inline-block; margin-top: 5px; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 999px;
  font-size: 11.5px; color: var(--ink); background: var(--panel);
}
.menu .health-fix:hover { background: var(--accent-soft); }
@media (max-width: 600px) {
  .sched-tile { grid-template-columns: minmax(0, 1fr) auto; }
  .sched-thumbs { display: none; }
}

.bar.filters { margin: 0 0 12px; gap: 6px; }
.filter-chip {
  font: inherit; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink);
}
.filter-chip:hover { border-color: var(--bad); }

/* The chip wears the link's box and the link goes plain inside it, so the
   cross sits within the chip at its right end. Its room is kept while it is
   invisible, so hovering does not make the chips beside it jump -- and it is
   a whole end of the chip to aim at, not a 17 px corner badge that missed and
   opened the plan instead. */
.plan-chip {
  display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px;
  background: var(--accent-soft);
}
.plan-chip:hover, .plan-chip:focus-within { border-color: var(--accent); }
.plan-chip .plan-link { border: 0; background: none; padding-right: 3px; }
.plan-chip-x {
  font: 600 13px/1 system-ui, sans-serif; padding: 0 7px; border: 0; border-radius: 0 5px 5px 0;
  background: none; color: var(--ink); cursor: pointer; opacity: 0;
}
/* Keyboard too: tabbing onto the chip shows its cross, and tabbing on reaches it. */
.plan-chip:hover .plan-chip-x, .plan-chip:focus-within .plan-chip-x { opacity: 1; }
.plan-chip-x:hover, .plan-chip-x:focus-visible { color: var(--panel); background: var(--bad); outline: none; }
</style>
</head>
<body>
<header>
  <h1>gr<span>eels</span></h1>
  <div class="stats" id="stats">loading…</div>
  <nav id="nav"></nav>
</header>

<main>
  <aside id="side"></aside>
  <section id="view"><div class="empty">loading…</div></section>
</main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok) throw Object.assign(new Error(body?.error || r.statusText), { status: r.status });
  return body;
};
/* Built on first ask, so a segment whose clip has no proxy simply has none. */
const thumb = (id, cls = 'thumb', title = '') => el('img', {
  class: cls, loading: 'lazy', alt: '', title,
  src: '/thumb/' + encodeURIComponent(id),
  onerror: e => e.target.setAttribute('data-missing', ''),
});

const hms = s => {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? `${h}:${String(m).padStart(2,'0')}` : `${m}`) + ':' + String(x).padStart(2, '0');
};
const toast = msg => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
};

const TABS = ['Plans', 'Schedule', 'Segments', 'Review', 'Clips', 'Tags', 'Reels', 'Texts'];
const REEL_MODES = [['drafts', 'Draft scripts'], ['cuts', 'My cuts'], ['ideas', 'Suggestions'],
                    ['captions', 'Caption a cut you made']];
const TEXT_MODES = [
  ['summary', 'Summaries'],
  ['english', 'Translations'],
  ['konkani', 'Original lines'],
];
/* A shortlist is not a cut, and is deliberately much less than one. A cut has
   trims, a running order and an export; this is "those four might go
   together", which is the thought you have while looking at the twelfth
   moment and have lost by the fifteenth. There is nothing to decide and
   nothing to lose by writing it down.

   It lives in this browser and nowhere else -- no sidecar, no `archive/`, no
   backup. That is the point: `trash.keep` and a revision token are the price
   of a decision, and this is a note to self. When one of these turns out to
   be a real running order, `reel new` is what makes it one. */
const SHORTLIST_KEY = 'shortlist';
const readShortlist = () => {
  try { return JSON.parse(localStorage.getItem(SHORTLIST_KEY)) || []; }
  catch { return []; }   // a private window, or somebody's cleared site data
};

/* Plans are files in the archive, `index/plans/<id>.plan.json`. They lived in
   this browser until a plan could be marked published, which makes it the
   only record of what went out; `localStorage` is not a place for that. These
   two keys are where they used to be, read once to move them over and then
   left alone as a copy. */
const PLANS_KEY = 'plans';
const PLAN_SEEDS_KEY = 'planSeeds';
const PLANS_MOVED_KEY = 'plansMoved';
const readLegacyPlans = () => {
  try { return (JSON.parse(localStorage.getItem(PLANS_KEY)) || [])
    .map(p => ({ ...p, moments: p.moments || [] })); }
  catch { return []; }
};

/* The seven states, furthest along first, and what puts a moment in each.
   `plans.segment_states` decides; this only draws. The sentence is the
   tooltip, because "planned" and "proposed" are not self-explanatory and the
   difference is the whole point of the ticks. */
const STATES = [
  ['published', 'Published', 'Chosen for a reel that has been posted, or in a published cut'],
  ['used', 'Used', 'A shot in a cut'],
  ['planned', 'Planned', 'Chosen for a plan that is ready to cut'],
  ['proposed', 'Proposed', 'In a plan, but not chosen for its edit yet'],
  ['rejected', 'Rejected', 'Rated reject, and no plan has it'],
  ['seen', 'Seen', 'Reviewed or kept, and no plan has it'],
  ['unseen', 'Unseen', 'Nobody has looked at it or planned it yet'],
];
/* Each stage wears the colour of what it does to the moments ticked in it,
   except gathering. An idea and a plan being gathered for both only propose
   their moments, and one amber ring on both left the page unable to say which
   plans were being worked on; gathering has its own teal and a ring a quarter
   filled, between the empty ring of an idea and the half of ready.
   They stop at ready: when a ready plan goes out, and in what order, is the
   Schedule's -- a plan is an idea, and the order they are posted in is a
   separate decision that the ideas page should not have to carry. */
const STAGES = [
  ['idea', 'Idea', 'proposed', 'Might be a reel'],
  ['gathering', 'Gathering', 'gathering', 'Picking material and ticking the takes'],
  ['ready', 'Ready', 'planned', 'Takes chosen — it goes on the Schedule'],
  ['shelved', 'Shelved', 'unseen', 'Not doing it; lets go of its moments'],
];
const stageInfo = key => STAGES.find(([k]) => k === key) || STAGES[0];

/* The plans stay grouped by stage, furthest along first, and the files keep
   that order: `plans._restack` renumbers them on every save, and this is the
   same rule so a card can move before the save comes back. The ready plans
   follow the Schedule, posted reels included. */
const PLAN_RANK = plan => ({ ready: 0, gathering: 1, idea: 2, shelved: 3 })[plan.stage] ?? 2;
/* The ready ones in the order they go out, by their number on the Schedule.
   One just made ready has none until the save comes back, and goes after
   every reel that has: Infinity minus Infinity is NaN, which falls through
   to the saved order. */
const scheduleSlot = plan => plansView.slots.get(plan.id) ?? Infinity;
const planPlace = (a, b) => PLAN_RANK(a) - PLAN_RANK(b)
  || (a.stage === 'ready' && b.stage === 'ready' ? scheduleSlot(a) - scheduleSlot(b) : 0)
  || a.order - b.order;

/* `moved` has just changed stage and joins the end of its new group, as it
   does on the server. */
function restackPlans(plans, moved = null) {
  if (moved) moved.order = Math.max(...plans.map(p => p.order)) + 1;
  plans.sort(planPlace).forEach((plan, i) => { plan.order = i; });
  return plans;
}

/* The server's numbers onto the plans this page holds. One stage change
   renumbers the plans below it without moving their revisions, so the save's
   answer is the only place this tab hears about it. */
function applyPlanOrders(orders) {
  if (!orders) return;
  const before = state.plans.map(p => p.id).join();
  for (const plan of state.plans) if (plan.id in orders) plan.order = orders[plan.id];
  state.plans.sort(planPlace);
  if (state.plans.map(p => p.id).join() !== before) placePlanCards();
}
const stateInfo = key => STATES.find(([k]) => k === key) || STATES[STATES.length - 1];

const ICONS = {
  unseen: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  seen: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<circle cx="8" cy="8" r="2.1" fill="currentColor"/>',
  proposed: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="2.6 2"/>',
  gathering: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="2.6 2"/>'
    + '<path d="M8 8V2.4a5.6 5.6 0 0 1 5.6 5.6z" fill="currentColor"/>',
  planned: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/>',
  used: '<circle cx="8" cy="8" r="6.4" fill="currentColor"/>',
  published: '<circle cx="8" cy="8" r="6.4" fill="currentColor"/>'
    + '<path d="M5 8.3l2.1 2 3.9-4.3" fill="none" style="stroke:var(--panel)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  rejected: '<circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M4.1 11.9l7.8-7.8" stroke="currentColor" stroke-width="1.6"/>',
};

/* The only drawing of a state. `word` adds its name; `warn` and `favorite`
   come from `/api/states` and ride on top rather than replacing it. */
function stateBadge(key, { word = false, warn = '', favorite = false, title = '' } = {}) {
  const [, name, why] = stateInfo(key);
  const node = el('span', { class: `badge st-${key}` + (warn ? ' warn' : ''),
    title: title || [`${name} — ${why}`, warn && `⚠ ${warn}`].filter(Boolean).join('\n') });
  node.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${ICONS[key] || ICONS.unseen}</svg>`;
  if (word) node.append(el('span', { class: 'word' }, name));
  if (favorite) node.append(el('span', { class: 'fav', title: 'Rated keep' }, '★'));
  return node;
}

function stageBadge(stage, { word = true } = {}) {
  const [, name, colour, why] = stageInfo(stage);
  const node = stateBadge(colour, { title: `${name} — ${why}` });
  if (word) node.append(el('span', { class: 'word' }, name));
  return node;
}

/* What `/api/states` said about one moment. A moment the index does not know
   has no state, and draws as unseen rather than as nothing. */
const standing = id => state.segStates?.segments?.[id]
  || { state: 'unseen', warn: '', favorite: false, plans: [], cuts: [] };

/* A badge that knows which moment it is for, so a tick or a rating can repaint
   every copy of it on the page without rebuilding what it sits in. */
function segBadge(id, { word = false } = {}) {
  const s = standing(id);
  const node = stateBadge(s.state, { word, warn: s.warn, favorite: s.favorite });
  node.dataset.badgeSeg = id;
  if (word) node.dataset.badgeWord = '1';
  return node;
}

const state = {
  tab: 'Plans', textMode: 'summary', texts: null,
  shortlist: readShortlist(), plans: [], plansReady: false,
  planSeed: null, segStates: null,
  /* Which plans the page shows, by stage. A view, so it can live here. */
  planStage: (() => { try { return localStorage.getItem('planStage') || ''; } catch { return ''; } })(),
  /* The moment the side panel on Plans is showing, and the plan it was
     opened from -- the same moment can be in four. */
  panel: null,
  q: '', tags: [], segState: '', rating: '', tagInfo: [],
  reelMode: 'drafts', openDraft: null, openCut: null, cuts: [],
  timeline: null, timelineLang: 'en', timelineName: '',
  reviewAt: null, reviewKeys: false, clipOrder: 'shot',
  /* The moment a review pass is on, for the address, and the one an address
     asked to start from. `reviewAt` is an index, and an index into a list
     the filters reorder is not something a link can carry. */
  reviewSeg: null, reviewFrom: null,
  /* The clip whose dialog is open on Clips. */
  openClip: null,
  /* Whether the pass is showing the moment or letting you fix it. A mode
     rather than a dialog, so the footage stays on screen beside the words. */
  reviewEditing: false,
  overview: null,
  /* Which moment the Segments pane is showing. It outlives a search, because
     the pane it belongs to does. */
  openSeg: null, openSegAt: null,
  /* A review pass is 91 minutes of footage. Which end you start from and how
     fast it plays are the two things that decide whether it gets finished. */
  reviewOrder: localStorage.getItem('reviewOrder') || 'promise',
  reviewRate: parseFloat(localStorage.getItem('reviewRate')) || 1,
  /* Which editor the footage is being handed to. A preference and not a fact
     about the archive, so it lives in the browser the way the review speed
     does -- an address should not change which program you use. The server
     decides what the name means; this only remembers it. */
  editor: (() => { try { return localStorage.getItem('editor') || 'fcp'; }
                   catch { return 'fcp'; } })(),
  editors: [{ name: 'fcp', label: 'Final Cut Pro' },
            { name: 'resolve', label: 'DaVinci Resolve' }],
};

/* Every request that writes a document, reads a library or checks the machine
   has to say which editor it means, and forgetting on one of them is how the
   page ends up offering a Resolve export and a Final Cut sentence about it. */
function withEditor(path) {
  return path + (path.includes('?') ? '&' : '?') + 'editor=' + state.editor;
}

function setEditor(name) {
  if (name === state.editor) return;
  state.editor = name;
  try { localStorage.setItem('editor', name); } catch {}
  renderView();
  renderNav();
  loadHealth();   /* the Resolve check and the DTD line are both editor-specific */
}

function editorLabel(name) {
  return (state.editors.find(e => e.name === (name || state.editor)) || {}).label
    || 'Final Cut Pro';
}

/* --- the address -----------------------------------------------------------

   A reload used to land on Plans whatever was on screen, because where you
   were lived only in `state`. Each tab is a path now, and what is open in it
   -- the moment in the Segments pane, a plan's side panel, the moment a review
   pass is on, a cut -- is in the query, so a reload or a pasted link comes back
   to the same thing.

   Written from `state` once the page has drawn it, rather than at each of the
   forty places that change it: one function saying what the page shows cannot
   drift from the page the way forty hand-built URLs would.

   The review order and speed stay out, and so does the stage filter's
   fallback: those are facts about you, kept in this browser, and a link
   somebody pastes should not change them. */
const PAGE_OF = Object.fromEntries(TABS.map(t => ['/' + t.toLowerCase(), t]));
const RATINGS = ['favorite', 'rejected', 'none'];

function urlOf() {
  const p = new URLSearchParams();
  const filters = () => {
    if (state.q) p.set('q', state.q);
    if (state.segState) p.set('state', state.segState);
    if (state.rating) p.set('rating', state.rating);
    for (const t of state.tags) p.append('tag', t);
  };
  if (state.tab === 'Plans') {
    if (state.planStage) p.set('stage', state.planStage);
    if (state.panel) p.set('moment', state.panel.id);
    if (state.panel?.planId) p.set('plan', state.panel.planId);
  } else if (state.tab === 'Segments') {
    filters();
    if (state.openSeg) p.set('seg', state.openSeg);
    if (state.openSeg && state.openSegAt !== null) p.set('at', String(state.openSegAt));
  } else if (state.tab === 'Review') {
    filters();
    if (state.reviewSeg) p.set('seg', state.reviewSeg);
  } else if (state.tab === 'Clips') {
    if (state.clipOrder !== 'shot') p.set('order', state.clipOrder);
    if (state.openClip) p.set('clip', state.openClip);
  } else if (state.tab === 'Reels') {
    if (state.reelMode !== 'drafts') p.set('mode', state.reelMode);
    // The order `viewReels` decides in: an open draft wins, and a cut is only
    // on screen outside the drafts list.
    if (state.openDraft) p.set('draft', state.openDraft);
    else if (state.openCut && state.reelMode !== 'drafts') p.set('cut', state.openCut);
  } else if (state.tab === 'Texts') {
    if (state.textMode !== 'summary') p.set('mode', state.textMode);
  }
  const query = p.toString();
  return '/' + state.tab.toLowerCase() + (query ? '?' + query : '');
}

/* Opening something is a step Back should undo. Narrowing a list, stepping
   through a review pass or closing what was open is not: a history entry per
   keystroke in the search box, or per moment judged, is a Back button that
   takes ninety presses to leave the page. */
const OPENS = ['seg', 'moment', 'clip', 'cut', 'draft', 'mode'];

function syncUrl() {
  if (syncUrl.held) return;
  const next = urlOf();
  const here = location.pathname + location.search;
  if (next === here) return;
  const was = new URLSearchParams(location.search);
  const to = new URL(next, location.origin);
  const opened = to.pathname !== location.pathname || OPENS.some(key =>
    !(key === 'seg' && state.tab === 'Review')
    && to.searchParams.get(key) && to.searchParams.get(key) !== was.get(key));
  history[opened ? 'pushState' : 'replaceState'](null, '', next);
  document.title = `${state.tab} · greels`;
}
/* Held while an address is being turned back into a page: everything that
   runs on the way -- a render, a panel closing -- would otherwise write the
   half-applied state over the address it is being read from. */
syncUrl.held = false;

/* The address into `state`, for the tab it names only. A filter on Segments
   outlives a visit to Plans on purpose, so going Back to Plans must not
   clear it just because Plans' address has no search in it.

   What needs the page to do something rather than hold a value -- a panel to
   slide out, a dialog to open -- comes back for `settleUrl`, which runs once
   the tab has drawn. `null` for an address that is not a page, which is `/`:
   the page opens as it always has. */
function fromUrl() {
  const tab = PAGE_OF[location.pathname.replace(/(.)\/+$/, '$1')];
  if (!tab) return null;
  const p = new URLSearchParams(location.search);
  const pick = (key, keys) => keys.includes(p.get(key)) ? p.get(key) : '';
  const wants = { panel: undefined, clip: undefined };
  state.tab = tab;
  if (tab === 'Plans') {
    // Not `setPlanStageFilter`: that also remembers it for the next visit to
    // `/`, and following a link is not choosing a filter.
    state.planStage = pick('stage', STAGES.map(([key]) => key));
    wants.panel = p.get('moment') ? { id: p.get('moment'), planId: p.get('plan') || null } : null;
  }
  if (tab === 'Segments' || tab === 'Review') {
    state.q = p.get('q') || '';
    state.segState = pick('state', STATES.map(([key]) => key));
    state.rating = pick('rating', RATINGS);
    state.tags = p.getAll('tag');
  }
  if (tab === 'Segments') {
    state.openSeg = p.get('seg') || null;
    const at = parseFloat(p.get('at'));
    state.openSegAt = state.openSeg && Number.isFinite(at) ? at : null;
  }
  if (tab === 'Review') {
    // A place to start, not a position: `viewReview` looks for it among what
    // the filters leave, and starts where the work is when it is not there.
    state.reviewFrom = p.get('seg') || null;
    state.reviewAt = null;
  }
  if (tab === 'Clips') {
    state.clipOrder = pick('order', CLIP_ORDER.map(([key]) => key)) || 'shot';
    wants.clip = p.get('clip') || null;
  }
  if (tab === 'Reels') {
    state.reelMode = pick('mode', REEL_MODES.map(([key]) => key)) || 'drafts';
    state.openDraft = p.get('draft') || null;
    state.openCut = p.get('cut') || null;
  }
  if (tab === 'Texts') state.textMode = pick('mode', TEXT_MODES.map(([key]) => key)) || 'summary';
  return wants;
}

function settleUrl(wants) {
  if (wants && state.tab === 'Plans' && wants.panel !== undefined) {
    const p = wants.panel;
    if (!p) closePanel();
    else if (p.id !== state.panel?.id || p.planId !== state.panel?.planId) openPanel(p.id, p.planId);
  }
  // Back from an open clip, from any tab: the dialog is modal, but the
  // browser's own Back button is not inside it.
  const clip = wants && state.tab === 'Clips' ? wants.clip : null;
  if (clip && clip !== state.openClip) openClip(clip);
  else if (!clip && state.openClip) {
    // Cleared first: the dialog's close event arrives after the address below
    // has been written, and would find it still naming the clip.
    state.openClip = null;
    if ($('#dlg').open) $('#dlg').close();
  }
  syncUrl.held = false;
  history.replaceState(null, '', urlOf());
  document.title = `${state.tab} · greels`;
}

window.addEventListener('popstate', async () => {
  /* A moment in the Segments pane with a half-typed correction in it is not
     thrown away by Back any more than by clicking another row. Refused, the
     address is put back to what is still on screen. */
  if (PAGE_OF[location.pathname.replace(/(.)\/+$/, '$1')] === 'Segments') {
    const p = new URLSearchParams(location.search);
    const at = parseFloat(p.get('at'));
    const seg = p.get('seg') || null;
    if ((seg !== state.openSeg || (seg && (Number.isFinite(at) ? at : null) !== state.openSegAt))
        && !detailGuard()) {
      history.pushState(null, '', urlOf());
      return;
    }
  }
  syncUrl.held = true;
  const seg = [state.openSeg, state.openSegAt];
  // `/` is the one address that is not a page, and it is where Plans opens.
  const wants = fromUrl() || (state.tab = 'Plans', {});
  if (state.openSeg !== seg[0] || state.openSegAt !== seg[1]) paintDetail();
  await render();
  settleUrl(wants);
});

const REVIEW_ORDERS = [
  ['promise', 'Most promising first'],
  ['shot', 'The order it was shot'],
  ['clip', 'By clip name'],
];
const RATES = [1, 1.25, 1.5, 2];

/* The header ran out of width: eight tabs and three buttons wrapped the nav
   under the stats on a laptop. Plans, Schedule and Segments are where the
   evenings go; the rest are visited, so they share one button, which takes
   the name of whichever of them is open so the header still says where you
   are. TABS stays whole, because the server's addresses are checked against
   it. */
const NAV_MORE = TABS.slice(TABS.indexOf('Review'));

function renderNav() {
  const inMore = NAV_MORE.includes(state.tab);
  $('#nav').replaceChildren(
    ...TABS.filter(t => !NAV_MORE.includes(t)).map(t => el('button', {
      'aria-selected': String(state.tab === t),
      onclick: () => { state.tab = t; render(); },
    }, t)),
    el('button', { 'aria-selected': String(inMore), 'aria-haspopup': 'menu',
      onclick: e => popMenu(e.currentTarget, 'tabmenu', close => NAV_MORE.map(t =>
        el('button', { role: 'menuitem', 'aria-current': state.tab === t ? 'page' : null,
          onclick: () => { close(); state.tab = t; render(); } }, el('strong', {}, t)))),
    }, (inMore ? state.tab : 'More') + ' \u25be'),
    ...undoButtons,
    el('button', { class: 'btn', title: 'Take in whatever is new in raw/',
      onclick: () => openCommand('sync') }, 'Sync raw'),
    el('button', { class: 'btn', 'aria-haspopup': 'menu',
      title: 'The rest of greels',
      onclick: e => openCommandMenu(e.currentTarget) }, 'Run \u25be'),
    editorChoice(),
    el('button', { class: 'btn', title: 'Copy the sidecars into the repo',
      onclick: runBackup }, 'Back up'),
    healthButton(),
  );
}

/* Which editor everything here is aimed at. Two buttons rather than a select,
   because it is two things and a select hides the one you are not on -- and
   because the answer changes what four other buttons on this page say.

   It sits beside Sync raw and Run, since those are the two that hand work
   over. Each export button still names both editors outright, so this is the
   default rather than the only way to say it. */
function editorChoice() {
  return el('div', { class: 'editorpick', role: 'group',
    'aria-label': 'Which editor to hand the footage to' },
    ...state.editors.map(e => el('button', {
      class: 'btn' + (e.name === state.editor ? ' primary' : ''),
      'aria-pressed': String(e.name === state.editor),
      title: e.name === state.editor ? e.label + ': what Sync raw and the '
        + 'Run menu will write' : 'Hand the footage to ' + e.label + ' instead',
      onclick: () => setEditor(e.name),
    }, e.name === 'fcp' ? 'Final Cut' : 'Resolve')));
}

async function runBackup() {
  try {
    const r = await api('/api/backup', { method: 'POST' });
    if (r.refused) { alert('Backup refused:\n\n' + r.refused); return; }
    toast(`backup: ${r.added} added, ${r.updated} updated, ${r.removed} removed`);
  } catch (e) { toast('backup failed: ' + e.message); }
  loadHealth();
}

/* --- the health light ------------------------------------------------- */

async function loadHealth() {
  try { state.health = await api(withEditor('/api/health')); }
  catch { state.health = null; }
  renderNav();
}

/* A problem outranks a note, and the count is of the things that are not ok.
   A clean archive still shows the light, muted: it is the only way to ask
   "is anything wrong?" without running something, and that question is worth
   an answer even when the answer is no. */
function healthButton() {
  const h = state.health;
  const level = !h ? 'ok' : h.problems ? 'problem' : h.notes ? 'note' : 'ok';
  const n = h ? h.problems + h.notes : 0;
  const mark = level === 'problem' ? '✕' : level === 'note' ? '⚠' : '✓';
  return el('button', {
    class: 'btn', id: 'health', 'data-level': level, 'aria-haspopup': 'menu',
    title: !h ? 'Checking the machine around the archive…'
      : n ? `${n} thing(s) worth knowing about this machine`
      : 'ffmpeg, agy, the index, the backup and the cuts are all in order',
    onclick: e => openHealth(e.currentTarget),
  }, n ? `${mark} ${n}` : mark);
}

function openHealth(anchor) {
  const h = state.health;
  const wrong = (h?.checks || []).filter(c => c.level !== 'ok');
  popMenu(anchor, 'healthmenu', close => [
    ...(wrong.length ? wrong : [null]).map(c => c === null
      ? el('button', { role: 'menuitem', disabled: '',
          onclick: () => close() },
          el('strong', {}, 'Everything is in order'),
          el('span', {}, 'ffmpeg, agy, the index, the backup and the cuts.'))
      : el('button', { class: 'health-row', role: 'menuitem', 'data-level': c.level,
          /* The whole row runs the fix where there is one; where there is
             not, it is a statement and clicking it only closes the menu. */
          onclick: () => { close(); if (c.fix) applyFix(c.fix); } },
          el('strong', {}, `${c.section} · ${c.label}`),
          el('span', {}, c.detail),
          c.fix ? el('span', { class: 'health-fix' }, FIX_LABELS[c.fix] || c.fix) : null)),
    el('button', { role: 'menuitem',
      onclick: () => { close(); openCommand('doctor'); } },
      el('strong', {}, 'Run the whole check'),
      el('span', {}, 'Everything above and everything that is fine, in full.')),
  ]);
}

/* What the row's button says. The Run menu already carries each command's own
   sentence; here there is only room for the verb. */
const FIX_LABELS = {
  align: 'Align the subtitles →', index: 'Rebuild the index →',
  backup: 'Back up now →', sync: 'Sync raw/ →',
};

function applyFix(name) {
  // `backup` is its own button and its own endpoint, not a Run-menu command.
  if (name === 'backup') return void runBackup();
  openCommand(name);
}

/* The two things done every evening are buttons; the rest of greels is behind
   this. A menu rather than ten more buttons in the header, and each item
   carries its own sentence, because "reclassify" and "align" mean nothing
   from the name alone and the wrong guess costs an evening.

   Built from `/api/commands` rather than from a list here, so a command added
   to the server appears without this file knowing about it. */
/* A menu hung under the button that opened it, dismissed by a click anywhere
   else or by Escape. `items` is handed `close`, because every item closes the
   menu and then does its own thing. Two callers now -- the header's Run menu
   and a moment's plans -- and one copy of the dismissing, which is the part
   that is easy to get subtly different. */
/* Below the button unless it does not fit there and fits better above. A
   stage pill on the last plan in the window put its four stages under the
   bottom edge. The menu is fixed, so scrolling the page could not reach them.
   Whichever side it opens on, it is capped to the room on that side and
   scrolls inside itself. */
function menuPlacement(box, height, viewport, gap = 6, margin = 8) {
  const below = viewport - box.bottom - gap - margin;
  const above = box.top - gap - margin;
  const cap = room => `${Math.max(0, Math.min(room, viewport * 0.78))}px`;
  return height > below && above > below
    ? { top: '', bottom: `${viewport - box.top + gap}px`, maxHeight: cap(above) }
    : { top: `${box.bottom + gap}px`, bottom: '', maxHeight: cap(below) };
}

function popMenu(anchor, id, items) {
  const open = document.getElementById(id);
  if (open) { open.remove(); return; }   // a second click closes it
  const close = () => {
    menu.remove();
    document.removeEventListener('mousedown', away);
    document.removeEventListener('keydown', key);
  };
  const menu = el('div', { class: 'menu', id, role: 'menu' }, ...items(close));
  const away = e => { if (!menu.contains(e.target) && e.target !== anchor) close(); };
  /* On the document, not the menu: clicking the button leaves focus wherever
     the pointer put it, and an Escape that only works when the menu happens
     to hold focus is an Escape that does not work. */
  const key = e => { if (e.key === 'Escape') { close(); anchor.focus(); } };

  document.body.append(menu);
  const box = anchor.getBoundingClientRect();
  Object.assign(menu.style, menuPlacement(box, menu.offsetHeight, window.innerHeight),
    { right: `${window.innerWidth - box.right}px` });
  setTimeout(() => {
    document.addEventListener('mousedown', away);
    document.addEventListener('keydown', key);
  }, 0);
  menu.querySelector('button')?.focus();
}

async function openCommandMenu(anchor) {
  // Before the request, so a second click closes the menu without asking the
  // server for a list it already has on screen.
  if ($('#runmenu')) return void $('#runmenu').remove();
  const { commands, editors } = await api(withEditor('/api/commands'));
  if (editors) state.editors = editors;
  popMenu(anchor, 'runmenu', close => commands.filter(c => c.name !== 'sync').map(c =>
    el('button', { role: 'menuitem', onclick: () => { close(); openCommand(c.name); } },
      el('strong', {}, c.label), el('span', {}, c.blurb))));
}

/* Every one of these opens with its dry run where it has one, because the
   real thing is hours of agy, or a rename that moves the originals in raw/,
   and `--dry-run` already says exactly what it would do. The run itself is
   the second click, with what it will cost on screen.

   The output is the command's own, arriving as it is printed: these say what
   they are doing in sentences already, and paraphrasing them in a progress
   bar would only lose the clip names. */
async function openCommand(name) {
  const dlg = $('#dlg');
  dlg.oncancel = null;   // nothing here is typed into
  const menu = await api(withEditor('/api/commands'));
  if (menu.editors) state.editors = menu.editors;

  /* One runs at a time. Asking for a second while the first is going shows
     the first, which is also how a reopened tab finds its way back to it. */
  const busy = menu.job?.state === 'running' ? menu.job : null;
  if (busy && busy.name !== name) { toast(`${busy.label} is already running`); name = busy.name; }
  const command = menu.commands.find(c => c.name === name);
  let job = menu.job?.name === name ? menu.job : null;

  const log = el('pre', { class: 'runlog', role: 'status', 'aria-live': 'polite' });
  const note = el('p', { class: 'stats' });
  const go = el('button', { class: 'btn primary' });

  const paint = next => {
    job = next;
    const running = job?.state === 'running';
    log.textContent = (job?.lines || []).join('\n')
      || (running ? 'Working…' : 'Nothing has run yet.');
    log.scrollTop = log.scrollHeight;
    go.disabled = running;
    /* A dry run that failed is not a reason to run the real thing: whatever
       stopped it -- an unmounted media root, agy signed out -- stops that
       too, and finding out was the point of the check. */
    go.textContent =
      running ? (job.check ? 'Checking…' : 'Running…')
      : !job ? (command.check ? 'Check first' : 'Run it')
      : job.state === 'failed' ? 'Try again'
      : job.check ? 'Run it'
      : command.check ? 'Check again' : 'Run it again';
    note.textContent =
      job?.state === 'failed' ? job.error
      : running && !job.check && command.holds ? 'Editing is refused until this finishes.'
      : job?.state === 'done' && job.check ? 'Nothing has changed yet.'
      : '';
  };

  const poll = async () => {
    if (!dlg.open) return;   // the run outlives the dialog; the polling need not
    try {
      const was = job?.state === 'running' && !job.check;
      const next = (await api(withEditor('/api/commands'))).job;
      if (!dlg.open) return;
      paint(next?.name === name ? next : null);
      if (job?.state === 'running') setTimeout(poll, 1200);
      else if (was) { toast(`${command.label.toLowerCase()}: finished`); boot(); }
    } catch (e) { note.textContent = e.message; }
  };

  const start = async check => {
    go.disabled = true;
    try {
      paint(await api('/api/commands', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, check, editor: state.editor }) }));
      poll();
    } catch (e) { note.textContent = e.message; go.disabled = false; }
  };
  go.addEventListener('click', () => start(
    !job ? !!command.check
    : job.state === 'failed' ? job.check
    : job.check ? false : !!command.check));

  paint(job);
  dlg.replaceChildren(
    el('div', { class: 'dlg-head' }, el('h2', {}, command.label),
      el('p', { class: 'stats' }, command.blurb)),
    el('div', { class: 'dlg-body' }, log, note),
    el('div', { class: 'dlg-foot' }, go,
      el('button', { class: 'btn', onclick: () => dlg.close() }, 'Close')));
  dlg.showModal();

  if (job?.state === 'running') poll();
  else if (command.check) start(true);
}

async function loadOverview() {
  const o = state.overview = await api('/api/overview');
  /* The judged count sits up here rather than only in Review, because it is
     the number everything else is waiting on and the tab you are looking at
     is usually not that one. */
  paintStats();
  return o;
}

/* Redrawn from the numbers already in hand rather than refetched: the
   overview reads every sidecar, and a review pass lands a verdict every two
   seconds. */
function paintStats() {
  const o = state.overview;
  if (!o) return;
  $('#stats').textContent =
    `${o.clips} clips · ${hms(o.duration)} · ${o.segments} segments` +
    (o.segments ? ` · ${o.judged} judged` : '') +
    (Object.keys(o.proposed).length ? ` · ${Object.keys(o.proposed).length} tags awaiting review` : '');
}

// --- sidebar ---------------------------------------------------------

function renderSide() {
  if (state.tab !== 'Segments' && state.tab !== 'Review') {
    $('#side').replaceChildren(); return;
  }
  const byNs = {};
  for (const t of state.tagInfo) {
    if (!t.segments) continue;
    (byNs[t.namespace] ||= []).push(t);
  }
  const facet = (label, count, on, toggle) =>
    el('div', { class: 'facet' + (on ? ' on' : ''), onclick: toggle },
      el('span', {}, label), el('span', { class: 'n' }, String(count)));

  const kids = [
    el('h3', {}, 'Search'),
    el('input', {
      type: 'search', placeholder: 'title, speech, tag…', value: state.q,
      oninput: e => { clearTimeout(window._d);
        window._d = setTimeout(() => { state.q = e.target.value.trim(); renderView(); }, 220); },
    }),
    /* One list for where a moment has got to, which is also the legend for
       the badges on the rows. It replaced a hand-set status and an "in a
       cut" filter: both are part of the state now, and three controls for
       one question gave three answers. */
    el('h3', {}, 'State'),
    ...STATES.map(([key, name]) => {
      const node = facet(el('span', {}, stateBadge(key), ' ', name),
        state.segStates?.counts?.[key] ?? '·', state.segState === key, () => {
          state.segState = state.segState === key ? '' : key;
          state.reviewAt = null;
          renderSide(); renderView();
        });
      node.lastChild.dataset.stateCount = key;
      return node;
    }),
    el('h3', {}, 'Rating'),
    el('select', { onchange: e => { state.rating = e.target.value; renderView(); } },
      ...['', 'favorite', 'rejected', 'none'].map(v =>
        el('option', { value: v, selected: state.rating === v || null }, v || 'any rating'))),
  ];
  if (state.tags.length) {
    kids.push(el('h3', {}, 'Active tags'),
      ...state.tags.map(t => facet(t, '×', true, () => {
        state.tags = state.tags.filter(x => x !== t); renderSide(); renderView();
      })));
  }
  for (const ns of Object.keys(byNs).sort()) {
    kids.push(el('h3', {}, ns));
    for (const t of byNs[ns].sort((a, b) => b.segments - a.segments)) {
      kids.push(facet(t.label, t.segments, state.tags.includes(t.tag), () => {
        state.tags = state.tags.includes(t.tag)
          ? state.tags.filter(x => x !== t.tag) : [...state.tags, t.tag];
        renderSide(); renderView();
      }));
    }
  }
  $('#side').replaceChildren(...kids);
}
