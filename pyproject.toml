[project]
name = "splice"
version = "0.1.0"
license = "MIT"
readme = "README.md"
description = "Index family footage with Gemini, then cut it into short videos in Final Cut or Resolve"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=12.3.0",
]

[project.scripts]
splice = "splice.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splice"]

[tool.hatch.build.targets.wheel.force-include]
"src/splice/web" = "splice/web"
"src/splice/defaults" = "splice/defaults"

[tool.pytest.ini_options]
testpaths = ["tests"]
